name: Temporary author final P1 remediation V5

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-final-p1-batch-v5.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BASELINE_PARENT: f4c7731792310340dddf35570dd5418931bfa84f
      SELF_PATH: .github/workflows/tmp-author-final-p1-batch-v5.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind one-shot author to frozen candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:BASELINE_PARENT){throw "V5 author parent mismatch. Expected $env:BASELINE_PARENT, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V5 bootstrap scope mismatch: $($changed -join ', ')"}

      - name: Apply exact final P1 remediation batch
        shell: python
        run: |
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8',newline='\n')
          def replace_once(p,old,new,label):
              s=read(p); n=s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected one anchor, found {n}')
              write(p,s.replace(old,new,1))

          builder='scripts/Build-HmsCompositeSkill.ps1'
          replace_once(builder,
          "    [bool]$Taste = $true,\n    [bool]$Impeccable = $true\n)",
          "    [bool]$Taste = $true,\n    [bool]$Impeccable = $true,\n    [string]$TrustedRepoRoot,\n    [string]$TrustedHead,\n    [string]$TrustedBootstrapBlob\n)",
          'builder trusted parameters')

          old_root="""$repoRoot = Split-Path -Parent $PSScriptRoot
          $selfRelative = 'scripts/Build-HmsCompositeSkill.ps1'
          $implementationRelative = 'scripts/Build-HmsCompositeSkill.impl.ps1'
          $helperRelative = 'scripts/Copy-HmsCommittedGitPath.ps1'
          $superLockRelative = 'superpowers.lock.json'
          $uiLockRelative = 'ui-skills.lock.json'
          $head = ((& git -C $repoRoot rev-parse HEAD 2>$null) -join '').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -notmatch '^[0-9a-f]{40}$') {
              throw 'Composite support materialization could not resolve a canonical repository HEAD.'
          }
          """
          new_root="""$selfRelative = 'scripts/Build-HmsCompositeSkill.ps1'
          $implementationRelative = 'scripts/Build-HmsCompositeSkill.impl.ps1'
          $helperRelative = 'scripts/Copy-HmsCommittedGitPath.ps1'
          $superLockRelative = 'superpowers.lock.json'
          $uiLockRelative = 'ui-skills.lock.json'
          $trustedValues = @($TrustedRepoRoot,$TrustedHead,$TrustedBootstrapBlob)
          $trustedCount = @($trustedValues | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count
          if ($trustedCount -notin @(0,3)) { throw 'Composite builder trusted snapshot context is incomplete.' }
          $trustedBootstrap = $trustedCount -eq 3
          $trustedBlob = $null
          if ($trustedBootstrap) {
              try { $repoRoot = (Resolve-Path -LiteralPath $TrustedRepoRoot -ErrorAction Stop).Path.TrimEnd('\\') }
              catch { throw "Composite builder trusted repository root is invalid: $TrustedRepoRoot" }
              $head = $TrustedHead.Trim().ToLowerInvariant()
              if ($head -notmatch '^[0-9a-f]{40}$') { throw "Composite builder trusted HEAD is invalid: $TrustedHead" }
              $trustedBlob = $TrustedBootstrapBlob.Trim().ToLowerInvariant()
              if ($trustedBlob -notmatch '^[0-9a-f]{40}$') { throw "Composite builder trusted bootstrap blob is invalid: $TrustedBootstrapBlob" }
              $expectedTrustedSelf = ((& git -C $repoRoot rev-parse "$head`:$selfRelative" 2>$null) -join '').Trim().ToLowerInvariant()
              if ($LASTEXITCODE -ne 0 -or $expectedTrustedSelf -notmatch '^[0-9a-f]{40}$' -or $expectedTrustedSelf -cne $trustedBlob) {
                  throw 'Composite builder trusted snapshot context does not match the captured committed builder.'
              }
              $trustedType = ((& git -C $repoRoot cat-file -t $expectedTrustedSelf 2>$null) -join '').Trim().ToLowerInvariant()
              if ($LASTEXITCODE -ne 0 -or $trustedType -cne 'blob') { throw 'Composite builder trusted bootstrap object is not a committed blob.' }
          }
          else {
              if ([string]::IsNullOrWhiteSpace([string]$PSScriptRoot)) { throw 'Composite builder direct bootstrap has no file-backed repository root.' }
              $repoRoot = Split-Path -Parent $PSScriptRoot
              $head = ((& git -C $repoRoot rev-parse HEAD 2>$null) -join '').Trim().ToLowerInvariant()
              if ($LASTEXITCODE -ne 0 -or $head -notmatch '^[0-9a-f]{40}$') {
                  throw 'Composite support materialization could not resolve a canonical repository HEAD.'
              }
          }
          """
          replace_once(builder,old_root,new_root,'builder trusted root/head binding')

          old_self="""$expectedSelf = Get-ExpectedSupportBlob -RelativePath $selfRelative -Label 'Public composite bootstrap'
          $actualSelf = ((& git -C $repoRoot hash-object --no-filters -- $PSCommandPath 2>$null) -join '').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSelf -notmatch '^[0-9a-f]{40}$') {
              throw 'Public composite bootstrap literal worktree bytes could not be hashed.'
          }
          """
          new_self="""$expectedSelf = Get-ExpectedSupportBlob -RelativePath $selfRelative -Label 'Public composite bootstrap'
          if ($trustedBootstrap) {
              $actualSelf = $trustedBlob
          }
          else {
              if ([string]::IsNullOrWhiteSpace([string]$PSCommandPath)) { throw 'Public composite bootstrap has no file-backed path to authenticate.' }
              $actualSelf = ((& git -C $repoRoot hash-object --no-filters -- $PSCommandPath 2>$null) -join '').Trim().ToLowerInvariant()
              if ($LASTEXITCODE -ne 0 -or $actualSelf -notmatch '^[0-9a-f]{40}$') {
                  throw 'Public composite bootstrap literal worktree bytes could not be hashed.'
              }
          }
          """
          replace_once(builder,old_self,new_self,'builder trusted self identity')

          manager='manager/HmsSuperpowersManager.ps1'
          replace_once(manager,
          "$modelSettingsShimPath = Join-Path $repoRoot 'manager\\HmsModelSettings.ps1'\n$modelSettingsShimRecord = Read-ExactHeadFileBytes -Path $modelSettingsShimPath -RelativePath 'manager/HmsModelSettings.ps1' -Label 'Model settings public shim'\n",
          "$modelSettingsShimPath = Join-Path $repoRoot 'manager\\HmsModelSettings.ps1'\n$modelSettingsShimRecord = Read-ExactHeadFileBytes -Path $modelSettingsShimPath -RelativePath 'manager/HmsModelSettings.ps1' -Label 'Model settings public shim'\n$builderPath = Join-Path $repoRoot 'scripts\\Build-HmsCompositeSkill.ps1'\n$builderRecord = Read-ExactHeadFileBytes -Path $builderPath -RelativePath 'scripts/Build-HmsCompositeSkill.ps1' -Label 'Composite builder public shim'\n",
          'manager builder snapshot')
          replace_once(manager,
          "    $modelSettingsShimSource = $utf8Strict.GetString([byte[]]$modelSettingsShimRecord.Bytes)\n",
          "    $modelSettingsShimSource = $utf8Strict.GetString([byte[]]$modelSettingsShimRecord.Bytes)\n    $builderSource = $utf8Strict.GetString([byte[]]$builderRecord.Bytes)\n",
          'manager builder UTF8 decode')
          replace_once(manager,
          "    $__HmsVerifiedStrictReaderScriptBlock_v1 = [ScriptBlock]::Create($strictReaderSource)\n    $__HmsVerifiedModelSettingsShimScriptBlock_v1 = [ScriptBlock]::Create($modelSettingsShimSource)\n",
          "    $__HmsVerifiedStrictReaderScriptBlock_v1 = [ScriptBlock]::Create($strictReaderSource)\n    $__HmsVerifiedModelSettingsShimScriptBlock_v1 = [ScriptBlock]::Create($modelSettingsShimSource)\n    $__HmsVerifiedBuilderScriptBlock_v1 = [ScriptBlock]::Create($builderSource)\n",
          'manager builder ScriptBlock')
          replace_once(manager,
          "$__HmsVerifiedModelSettingsShimBlob_v1 = [string]$modelSettingsShimRecord.ExpectedBlob\n",
          "$__HmsVerifiedModelSettingsShimBlob_v1 = [string]$modelSettingsShimRecord.ExpectedBlob\n$__HmsVerifiedBuilderBlob_v1 = [string]$builderRecord.ExpectedBlob\n",
          'manager builder blob binding')
          anchor="# Replace the legacy manifest parser with the strict reader loaded from verified bytes.\n"
          injection="""# Replace the live builder invocation with the exact builder bytes snapshotted above.
          # The trusted context binds that snapshot to this Manager-captured repository HEAD.
          $builderInvokeNeedle = '    & $BuilderPath `'
          $builderInvokeReplacement = '    & $__HmsVerifiedBuilderScriptBlock_v1 -TrustedRepoRoot $__HmsTrustedRepoRoot_v1 -TrustedHead $__HmsTrustedHead_v1 -TrustedBootstrapBlob $__HmsVerifiedBuilderBlob_v1 `'
          $builderInvokeCount = [regex]::Matches($source, [regex]::Escape($builderInvokeNeedle)).Count
          if ($builderInvokeCount -ne 1) { throw "Manager builder launch contract mismatch: expected one live builder invocation, found $builderInvokeCount." }
          $source = $source.Replace($builderInvokeNeedle, $builderInvokeReplacement)

          """
          replace_once(manager,anchor,injection+anchor,'manager builder invocation transform')

          manager_impl='manager/HmsSuperpowersManager.utf8.ps1'
          replace_once(manager_impl,
          "        & (Join-Path $RepoRoot 'scripts\\Test-HmsSkills.ps1')\n",
          "        # Developer/CI test harnesses are intentionally not executable from the trusted production Manager.\n",
          'manager production validate developer-suite removal')

          delivery='scripts/Sync-DeliveryTools.ps1'
          old_marker="""function Write-CodeGraphBundleMarker {
              param([Parameter(Mandatory)][string]$Path,[Parameter(Mandatory)]$Identity)
              Assert-RegularCodeGraphBundle -Path $Path -Label 'CodeGraph transaction bundle'
              $treeHash = [string]$Identity['bundle_tree_sha256']
              if ([string]::IsNullOrWhiteSpace($treeHash)) {
                  $treeHash = Get-CodeGraphBundleTreeSha256 -Path $Path
                  $Identity['bundle_tree_sha256'] = $treeHash
              }
              if ($treeHash -notmatch '^[0-9a-f]{64}$') { throw "CodeGraph transaction identity has invalid bundle tree SHA-256: $treeHash" }
              $markerPath = Join-Path $Path $CodeGraphBundleMarkerName
              $Identity | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $markerPath -Encoding UTF8
          }
          """
          new_marker="""function Write-CodeGraphBundleMarker {
              param([Parameter(Mandatory)][string]$Path,[Parameter(Mandatory)]$Identity)
              Assert-RegularCodeGraphBundle -Path $Path -Label 'CodeGraph transaction bundle'
              $treeHash = [string]$Identity['bundle_tree_sha256']
              if ([string]::IsNullOrWhiteSpace($treeHash)) {
                  $treeHash = Get-CodeGraphBundleTreeSha256 -Path $Path
                  $Identity['bundle_tree_sha256'] = $treeHash
              }
              if ($treeHash -notmatch '^[0-9a-f]{64}$') { throw "CodeGraph transaction identity has invalid bundle tree SHA-256: $treeHash" }
              $markerPath = Join-Path $Path $CodeGraphBundleMarkerName
              $markerItem = Get-Item -LiteralPath $markerPath -Force -ErrorAction SilentlyContinue
              if ($null -ne $markerItem -and ([bool]$markerItem.PSIsContainer -or [bool]($markerItem.Attributes -band [IO.FileAttributes]::ReparsePoint))) {
                  throw "CodeGraph transaction marker must be a regular non-reparse file before publication: $markerPath"
              }
              $publishParent = Split-Path -Parent $Path
              $publishTemp = Join-Path $publishParent ('.hms-codegraph-marker-publish-' + [guid]::NewGuid().ToString('N') + '.tmp')
              $json = $Identity | ConvertTo-Json -Depth 4
              $bytes = (New-Object Text.UTF8Encoding($false)).GetBytes($json + "`n")
              $stream = $null
              try {
                  $stream = New-Object IO.FileStream($publishTemp,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                  $stream.Write($bytes,0,$bytes.Length)
                  $stream.Flush($true)
              }
              finally {
                  if ($null -ne $stream) { $stream.Dispose() }
              }
              if ($null -eq $markerItem) {
                  # Same-volume File.Move publishes a new marker without exposing a partial canonical file.
                  [IO.File]::Move($publishTemp,$markerPath)
              }
              else {
                  # ReplaceFile semantics keep the previous canonical marker intact if publication fails.
                  # On failure the random temp file is intentionally retained rather than pathname-deleted.
                  [IO.File]::Replace($publishTemp,$markerPath,$null,$true)
              }
          }
          """
          replace_once(delivery,old_marker,new_marker,'atomic CodeGraph marker publication')

          p1='.github/workflows/validate-p1-trust-boundaries.yml'
          replace_once(p1,
          "          $uninstallPath = Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'\n          foreach ($path in @($builderPath,$implPath,$uninstallPath)) {\n",
          "          $uninstallPath = Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'\n          $managerShimPath = Join-Path $env:GITHUB_WORKSPACE 'manager\\HmsSuperpowersManager.ps1'\n          $managerImplPath = Join-Path $env:GITHUB_WORKSPACE 'manager\\HmsSuperpowersManager.utf8.ps1'\n          $deliveryPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\\Sync-DeliveryTools.ps1'\n          foreach ($path in @($builderPath,$implPath,$uninstallPath,$managerShimPath,$managerImplPath,$deliveryPath)) {\n",
          'P1 parser scope')
          replace_once(p1,
          "          $uninstallText = [IO.File]::ReadAllText($uninstallPath)\n",
          "          $uninstallText = [IO.File]::ReadAllText($uninstallPath)\n          $managerShimText = [IO.File]::ReadAllText($managerShimPath)\n          $managerImplText = [IO.File]::ReadAllText($managerImplPath)\n          $deliveryText = [IO.File]::ReadAllText($deliveryPath)\n",
          'P1 trust texts')
          p1_anchor="          Write-Host 'PASS: committed source contains literal bootstrap hashing and explicit composite quarantine/revalidation boundaries.'\n"
          p1_static="""          foreach ($literal in @('Composite builder public shim','$__HmsVerifiedBuilderScriptBlock_v1','$__HmsVerifiedBuilderBlob_v1','-TrustedBootstrapBlob $__HmsVerifiedBuilderBlob_v1')) {
              if ($managerShimText -notmatch [regex]::Escape($literal)) { throw "Manager is missing authenticated builder snapshot contract: $literal" }
          }
          if ($managerImplText -match [regex]::Escape("scripts\\Test-HmsSkills.ps1")) { throw 'Production Manager still executes the developer validation suite.' }
          foreach ($literal in @('[IO.File]::Replace($publishTemp,$markerPath,$null,$true)','intentionally retained rather than pathname-deleted')) {
              if ($deliveryText -notmatch [regex]::Escape($literal)) { throw "Delivery tools are missing atomic marker publication contract: $literal" }
          }
          if ($deliveryText -match [regex]::Escape('$Identity | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $markerPath')) { throw 'CodeGraph marker publication regressed to direct canonical-path Set-Content.' }
          Write-Host 'PASS: Manager builder execution and production Validate are authenticated/non-developer, and CodeGraph marker publication is atomic.'

          """
          replace_once(p1,p1_anchor,p1_static+p1_anchor,'P1 new static trust checks')

          final_anchor="          Write-Host 'PASS: all three remediated P1 trust boundaries are qualified on exact candidate HEAD.'"
          dynamic="""          # P1 regression 4: modified builder bytes must be rejected before injected pre-auth code can execute.
          $managerSentinel = Join-Path ([IO.Path]::GetTempPath()) ('hms-manager-builder-sentinel-' + [guid]::NewGuid().ToString('N') + '.txt')
          $originalBuilderBytes = [IO.File]::ReadAllBytes($builderPath)
          try {
              $sentinelLiteral = $managerSentinel.Replace("'", "''")
              $originalBuilderText = (New-Object Text.UTF8Encoding($false,$true)).GetString($originalBuilderBytes)
              $mutatedBuilder = "[IO.File]::WriteAllText('$sentinelLiteral','UNREVIEWED_BUILDER_EXECUTED')`n" + $originalBuilderText
              [IO.File]::WriteAllText($builderPath,$mutatedBuilder,(New-Object Text.UTF8Encoding($false)))
              $blocked = $false
              try { & $managerShimPath -SelfTest }
              catch {
                  if ($_.Exception.Message -match 'Composite builder public shim literal bytes do not match HMS HEAD') { $blocked = $true }
                  else { throw }
              }
              if (-not $blocked) { throw 'Manager accepted modified composite builder bytes.' }
              if (Test-Path -LiteralPath $managerSentinel) { throw 'Modified builder executed pre-auth code before Manager rejection.' }
          }
          finally {
              [IO.File]::WriteAllBytes($builderPath,$originalBuilderBytes)
              Remove-Item -LiteralPath $managerSentinel -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'PASS: Manager rejects altered builder bytes before injected pre-auth code can execute.'

          # P1 regression 5: failed publication of an existing CodeGraph marker must preserve old bytes exactly.
          $markerProbeRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-codegraph-marker-atomic-' + [guid]::NewGuid().ToString('N'))
          try {
              & {
                  param($DeliveryPath,$ProbeRoot)
                  . $DeliveryPath -SkipCodeGraph -SkipThreeLevelDelivery
                  $bundle = Join-Path $ProbeRoot 'current'
                  New-Item -ItemType Directory -Force -Path $bundle | Out-Null
                  [IO.File]::WriteAllText((Join-Path $bundle 'payload.txt'),'owned payload',(New-Object Text.UTF8Encoding($false)))
                  $tree = Get-CodeGraphBundleTreeSha256 -Path $bundle
                  $sha = ('a' * 64) -join ''
                  $oldIdentity = New-CodeGraphBundleIdentity -TransactionId ('1' * 32 -join '') -Role 'candidate' -Version '1.0.0' -Tag 'v1.0.0' -Commit ('b' * 40 -join '') -Asset 'codegraph.zip' -Sha256 $sha -BundleTreeSha256 $tree
                  Write-CodeGraphBundleMarker -Path $bundle -Identity $oldIdentity
                  Assert-CodeGraphTransactionBundle -Path $bundle -Identity $oldIdentity
                  $marker = Join-Path $bundle $CodeGraphBundleMarkerName
                  $before = [Convert]::ToBase64String([IO.File]::ReadAllBytes($marker))
                  $newIdentity = New-CodeGraphBundleIdentity -TransactionId ('2' * 32 -join '') -Role 'backup' -Version '1.0.0' -Tag 'v1.0.0' -Commit ('b' * 40 -join '') -Asset 'codegraph.zip' -Sha256 $sha -BundleTreeSha256 $tree
                  $guard = [IO.File]::Open($marker,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
                  $failed = $false
                  try { Write-CodeGraphBundleMarker -Path $bundle -Identity $newIdentity }
                  catch { $failed = $true }
                  finally { $guard.Dispose() }
                  if (-not $failed) { throw 'Atomic marker regression did not force a publication failure.' }
                  $after = [Convert]::ToBase64String([IO.File]::ReadAllBytes($marker))
                  if ($after -cne $before) { throw 'Failed atomic marker publication changed the previous canonical marker bytes.' }
                  Assert-CodeGraphTransactionBundle -Path $bundle -Identity $oldIdentity
              } $deliveryPath $markerProbeRoot
          }
          finally {
              Remove-Item -LiteralPath $markerProbeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'PASS: failed existing-marker publication preserves the exact previous CodeGraph marker and identity.'

          """
          replace_once(p1,final_anchor,dynamic+"          Write-Host 'PASS: all five remediated P1 trust boundaries are qualified on exact candidate HEAD.'",'P1 dynamic regressions')

      - name: Create local final candidate and run pre-publication qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'manager/HmsSuperpowersManager.ps1',
            'manager/HmsSuperpowersManager.utf8.ps1',
            'scripts/Build-HmsCompositeSkill.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            '.github/workflows/validate-p1-trust-boundaries.yml'
          )
          Remove-Item -LiteralPath $env:SELF_PATH -Force
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $allowed=@($targets + $env:SELF_PATH)
          $unexpected=@($changed | Where-Object {$_ -notin $allowed})
          if($unexpected.Count -ne 0){throw "Unexpected V5 changed paths: $($unexpected -join ', ')"}
          foreach($path in $allowed){if($path -notin $changed){throw "Expected V5 path not changed: $path"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V5.'}
          foreach($path in $targets | Where-Object {$_.EndsWith('.ps1')}){
              $tokens=$null;$errors=$null
              [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errors)|Out-Null
              if(@($errors).Count -ne 0){throw "Parser rejected $path : $((@($errors)|ForEach-Object Message)-join ' | ')"}
          }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Close final Manager and CodeGraph P1 trust boundaries'
          if($LASTEXITCODE -ne 0){throw 'Local V5 candidate commit failed.'}
          $net=@(& git diff --name-only $env:BASELINE_PARENT HEAD)
          if($net.Count -ne $targets.Count){throw "V5 net scope count mismatch: $($net -join ', ')"}
          foreach($path in $targets){if($path -notin $net){throw "V5 net scope missing $path"}}
          if(@($net|Where-Object {$_ -notin $targets}).Count -ne 0){throw "V5 net scope escaped: $($net -join ', ')"}
          Write-Host "LOCAL_CANDIDATE=$(git rev-parse HEAD)"
          Write-Host "LOCAL_TREE=$(git rev-parse HEAD^{tree})"

          # Structural suite on the exact local candidate.
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}

          # Execute authenticated builder bytes directly with all work modules OFF; no external clones are required.
          $localHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $builderRel='scripts/Build-HmsCompositeSkill.ps1'
          $builderBlob=((& git rev-parse "$localHead`:$builderRel")-join '').Trim().ToLowerInvariant()
          $builderBytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $builderRel))
          $builderSource=(New-Object Text.UTF8Encoding($false,$true)).GetString($builderBytes)
          $builderBlock=[ScriptBlock]::Create($builderSource)
          $probe=Join-Path $env:TEMP ('hms-v5-builder-probe-' + [guid]::NewGuid().ToString('N'))
          try {
              & $builderBlock -InstallRoot $env:GITHUB_WORKSPACE -OutputRoot (Join-Path $probe 'output') -SkillsRoot (Join-Path $probe 'skills') -Hms $false -Superpowers $false -Taste $false -Impeccable $false -TrustedRepoRoot $env:GITHUB_WORKSPACE -TrustedHead $localHead -TrustedBootstrapBlob $builderBlob
          }
          finally { Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host 'PASS: authenticated builder snapshot executes against its exact local candidate HEAD.'

      - name: Run focused new P1 regressions on local candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $head=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $manager=Join-Path $root 'manager\HmsSuperpowersManager.ps1'
          $builder=Join-Path $root 'scripts\Build-HmsCompositeSkill.ps1'
          $delivery=Join-Path $root 'scripts\Sync-DeliveryTools.ps1'
          $managerImpl=Join-Path $root 'manager\HmsSuperpowersManager.utf8.ps1'
          if(([IO.File]::ReadAllText($managerImpl)) -match [regex]::Escape('scripts\Test-HmsSkills.ps1')){throw 'Production Manager still exposes live developer validator execution.'}

          $sentinel=Join-Path $env:TEMP ('hms-v5-manager-sentinel-' + [guid]::NewGuid().ToString('N') + '.txt')
          $original=[IO.File]::ReadAllBytes($builder)
          try {
              $sentinelLiteral=$sentinel.Replace("'","''")
              $text=(New-Object Text.UTF8Encoding($false,$true)).GetString($original)
              [IO.File]::WriteAllText($builder,"[IO.File]::WriteAllText('$sentinelLiteral','EXECUTED')`n"+$text,(New-Object Text.UTF8Encoding($false)))
              $blocked=$false
              try { & $manager -SelfTest }
              catch { if($_.Exception.Message -match 'Composite builder public shim literal bytes do not match HMS HEAD'){$blocked=$true}else{throw} }
              if(-not $blocked){throw 'Manager did not reject altered builder.'}
              if(Test-Path -LiteralPath $sentinel){throw 'Altered builder executed before rejection.'}
          }
          finally { [IO.File]::WriteAllBytes($builder,$original); Remove-Item -LiteralPath $sentinel -Force -ErrorAction SilentlyContinue }
          Write-Host 'PASS: Manager builder snapshot rejects pre-auth drift.'

          $probeRoot=Join-Path $env:TEMP ('hms-v5-marker-' + [guid]::NewGuid().ToString('N'))
          try {
              & {
                  param($Delivery,$Probe)
                  . $Delivery -SkipCodeGraph -SkipThreeLevelDelivery
                  $bundle=Join-Path $Probe 'current'; New-Item -ItemType Directory -Force -Path $bundle|Out-Null
                  [IO.File]::WriteAllText((Join-Path $bundle 'payload.txt'),'owned',(New-Object Text.UTF8Encoding($false)))
                  $tree=Get-CodeGraphBundleTreeSha256 -Path $bundle
                  $sha=('a'*64)-join ''; $commit=('b'*40)-join ''
                  $old=New-CodeGraphBundleIdentity -TransactionId (('1'*32)-join '') -Role 'candidate' -Version '1.0.0' -Tag 'v1.0.0' -Commit $commit -Asset 'codegraph.zip' -Sha256 $sha -BundleTreeSha256 $tree
                  Write-CodeGraphBundleMarker -Path $bundle -Identity $old
                  $marker=Join-Path $bundle $CodeGraphBundleMarkerName
                  $before=[Convert]::ToBase64String([IO.File]::ReadAllBytes($marker))
                  $new=New-CodeGraphBundleIdentity -TransactionId (('2'*32)-join '') -Role 'backup' -Version '1.0.0' -Tag 'v1.0.0' -Commit $commit -Asset 'codegraph.zip' -Sha256 $sha -BundleTreeSha256 $tree
                  $guard=[IO.File]::Open($marker,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
                  $failed=$false
                  try { Write-CodeGraphBundleMarker -Path $bundle -Identity $new } catch {$failed=$true} finally {$guard.Dispose()}
                  if(-not $failed){throw 'Marker failure injection did not fail.'}
                  if(([Convert]::ToBase64String([IO.File]::ReadAllBytes($marker))) -cne $before){throw 'Old marker bytes changed after failed publication.'}
                  Assert-CodeGraphTransactionBundle -Path $bundle -Identity $old
              } $delivery $probeRoot
          }
          finally { Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host 'PASS: failed atomic marker publication preserves previous marker bytes and identity.'

      - name: Prepare verified GitHub blobs for connector atomic commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'manager/HmsSuperpowersManager.ps1',
            'manager/HmsSuperpowersManager.utf8.ps1',
            'scripts/Build-HmsCompositeSkill.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            '.github/workflows/validate-p1-trust-boundaries.yml'
          )
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
              $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
              $body=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
              $blob=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/blobs" -Body $body -ContentType 'application/json'
              if(-not $blob.sha){throw "Blob creation failed for $path"}
              $localBlob=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
              if($localBlob -cne ([string]$blob.sha).ToLowerInvariant()){throw "GitHub blob identity mismatch for $path"}
              Write-Host "PREPARED_BLOB $path $($blob.sha)"
          }
          Write-Host "QUALIFIED_LOCAL_HEAD=$(((& git rev-parse HEAD)-join '').Trim())"
          Write-Host "QUALIFIED_LOCAL_TREE=$(((& git rev-parse HEAD^{tree})-join '').Trim())"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'
