name: Diagnose CodeGraph tree drift

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/diagnose-codegraph-tree-drift.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture exact release file drift
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $lock=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'delivery-tools.lock.json') -Raw|ConvertFrom-Json
          $spec=$lock.codegraph
          $arch='x64'
          $asset=$spec.windows_assets.$arch
          $temp=Join-Path $env:RUNNER_TEMP ('cg-drift-'+[guid]::NewGuid().ToString('N'))
          $zip=Join-Path $temp ([string]$asset.name)
          $extract=Join-Path $temp 'extract'
          $flat=Join-Path $temp 'flat'
          function Snapshot([string]$Root){
            $r=(Resolve-Path -LiteralPath $Root).Path.TrimEnd('\')
            $m=[ordered]@{}
            foreach($f in @(Get-ChildItem -LiteralPath $r -File -Force -Recurse|Sort-Object FullName)){
              $rel=$f.FullName.Substring($r.Length).TrimStart('\').Replace('\','/')
              $m[$rel]=(Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            return $m
          }
          function Show-TreeDiff([string]$Label,$A,$B){
            Write-Host "=== $Label ==="
            $keys=@($A.Keys)+@($B.Keys)|Sort-Object -Unique
            $count=0
            foreach($k in $keys){
              $av=if($A.Contains($k)){$A[$k]}else{'<missing>'}
              $bv=if($B.Contains($k)){$B[$k]}else{'<missing>'}
              if($av -cne $bv){Write-Host "$k : $av -> $bv";$count++}
            }
            Write-Host "DIFF_COUNT=$count"
          }
          try{
            New-Item -ItemType Directory -Force -Path $extract,$flat|Out-Null
            $url="https://github.com/colbymchenry/codegraph/releases/download/$([string]$spec.tag)/$([string]$asset.name)"
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
            $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -cne [string]$asset.sha256){throw "asset SHA mismatch $sha"}
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $inner=Join-Path $extract 'codegraph-win32-x64'
            Get-ChildItem -LiteralPath $inner -Force|ForEach-Object{Move-Item -LiteralPath $_.FullName -Destination $flat -Force}
            $s0=Snapshot $flat
            $cmd=Join-Path $flat 'bin\codegraph.cmd'
            $out=(& $cmd --version 2>&1)-join "`n"
            if($LASTEXITCODE -ne 0){throw "version failed: $out"}
            Write-Host "VERSION=$out"
            $s1=Snapshot $flat
            $marker=Join-Path $flat '.hms-codegraph-bundle.json'
            [IO.File]::WriteAllText($marker,'{"diagnostic":true}',(New-Object Text.UTF8Encoding($false)))
            $s2=Snapshot $flat
            Start-Sleep -Seconds 3
            $s3=Snapshot $flat
            Show-TreeDiff 'extract -> after-version' $s0 $s1
            Show-TreeDiff 'after-version -> after-marker' $s1 $s2
            Show-TreeDiff 'after-marker -> after-delay' $s2 $s3
            Write-Host "MARKER_NAME=$([IO.Path]::GetFileName($marker))"
          } finally {Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue}
