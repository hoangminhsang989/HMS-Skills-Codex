name: Temporary author fresh review P1 remediation V9

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-fresh-review-p1-v9.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BASELINE_PARENT: 2dd454f10bd7503045b2aec3ad4656d733464782
      SELF_PATH: .github/workflows/tmp-author-fresh-review-p1-v9.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind one-shot V9 author to exact reviewed parent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:BASELINE_PARENT){throw "V9 parent mismatch. Expected $env:BASELINE_PARENT, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V9 bootstrap scope mismatch: $($changed -join ', ')"}

      - name: Apply exact four-file fresh-review P1 remediation
        shell: python
        run: |
          from pathlib import Path

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path,text): Path(path).write_text(text,encoding='utf-8',newline='\n')
          def once(text,old,new,label):
              n=text.count(old)
              if n != 1: raise SystemExit(f'{label}: expected exactly one anchor, found {n}')
              return text.replace(old,new,1)
          def between(text,start,end,replacement,label):
              a=text.find(start); b=text.find(end,a+len(start)) if a>=0 else -1
              if a<0 or b<0: raise SystemExit(f'{label}: boundary not found')
              return text[:a]+replacement+text[b:]

          # 1) Composite stage/current transitions: carry exact directory handles through activation,
          #    post-activation validation and discovery publication; exact-handle cleanup on Windows.
          p='scripts/Build-HmsCompositeSkill.impl.ps1'; t=load(p)

          new_identity_cleanup=r'''function Remove-OwnedCompositeIdentityQuarantine {
              param(
                  [Parameter(Mandatory)][string]$Path,
                  [Parameter(Mandatory)][string]$ExpectedTreeSha256
              )
              if (-not (Test-Path -LiteralPath $Path)) { return }
              $parent = Split-Path -Parent $Path
              $quarantine = Join-Path $parent ('.hms-composite-deleting-' + [guid]::NewGuid().ToString('N'))
              if (Test-Path -LiteralPath $quarantine) { throw "Composite identity quarantine path already exists: $quarantine" }
              if ($env:OS -cne 'Windows_NT') {
                  Assert-OwnedCompositeIdentity -Path $Path -ExpectedTreeSha256 $ExpectedTreeSha256
                  Rename-Item -LiteralPath $Path -NewName (Split-Path -Leaf $quarantine) -ErrorAction Stop
                  Assert-OwnedCompositeIdentity -Path $quarantine -ExpectedTreeSha256 $ExpectedTreeSha256
                  Remove-Item -LiteralPath $quarantine -Recurse -Force -ErrorAction Stop
                  if (Test-Path -LiteralPath $quarantine) { throw "Composite identity quarantine removal did not complete: $quarantine" }
                  return
              }
              $guard = Open-HmsCompositeDirectoryGuard -Path $Path -Label 'Composite identity quarantine'
              $renamed = $false
              $deleteStarted = $false
              try {
                  Assert-OwnedCompositeIdentity -Path $Path -ExpectedTreeSha256 $ExpectedTreeSha256
                  Move-HmsCompositeDirectoryGuard -Guard $guard -Destination $quarantine -Label 'Composite identity quarantine'
                  $renamed = $true
                  Assert-OwnedCompositeIdentity -Path $quarantine -ExpectedTreeSha256 $ExpectedTreeSha256
                  $deleteStarted = $true
                  foreach ($child in @(Get-ChildItem -LiteralPath $quarantine -Force -ErrorAction Stop)) {
                      Remove-Item -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop
                  }
                  $code = 0
                  if (-not [HmsCompositeExactFsNative]::DeleteByHandle($guard.Handle,[ref]$code)) { throw "Composite exact quarantine delete-pending transition failed (Win32=$code): $quarantine" }
                  $guard.Handle.Dispose(); $guard.Handle = $null
                  if (Test-Path -LiteralPath $quarantine) { throw "Composite exact quarantine remained after handle deletion: $quarantine" }
              }
              catch {
                  $e = $_
                  if (-not $deleteStarted -and $renamed -and $null -ne $guard.Handle -and -not $guard.Handle.IsClosed -and -not (Test-Path -LiteralPath $Path)) {
                      try {
                          Move-HmsCompositeDirectoryGuard -Guard $guard -Destination $Path -Label 'Composite identity quarantine rollback'
                          Assert-OwnedCompositeIdentity -Path $Path -ExpectedTreeSha256 $ExpectedTreeSha256
                      } catch { throw "Composite identity quarantine validation failed and exact-object rollback was incomplete. Original: $($e.Exception.Message). Rollback: $($_.Exception.Message)" }
                  }
                  elseif ($deleteStarted -and (Test-Path -LiteralPath $quarantine)) {
                      throw "Composite identity deletion failed after destructive child removal started; exact quarantined remainder was not restored: $quarantine. Original: $($e.Exception.Message)"
                  }
                  throw $e
              }
              finally { if ($null -ne $guard -and $null -ne $guard.Handle) { $guard.Handle.Dispose() } }
          }

          '''
          t=between(t,'function Remove-OwnedCompositeIdentityQuarantine {','function Remove-OwnedCompositeQuarantine {',new_identity_cleanup,'composite identity cleanup')

          stage_helper=r'''function Move-OwnedCompositeStageToFinal {
              param(
                  [Parameter(Mandatory)][string]$Path,
                  [Parameter(Mandatory)][string]$FinalPath,
                  [Parameter(Mandatory)][string]$StageId,
                  [Parameter(Mandatory)][string]$ExpectedTreeSha256
              )
              if (Test-Path -LiteralPath $FinalPath) { throw "Composite FinalRoot is occupied before staged activation: $FinalPath" }
              if ($env:OS -cne 'Windows_NT') {
                  Assert-OwnedCompositeStage -Path $Path -StageId $StageId
                  Assert-OwnedCompositeIdentity -Path $Path -ExpectedTreeSha256 $ExpectedTreeSha256
                  Rename-Item -LiteralPath $Path -NewName (Split-Path -Leaf $FinalPath) -ErrorAction Stop
                  Assert-OwnedCompositeStage -Path $FinalPath -StageId $StageId
                  Assert-OwnedCompositeIdentity -Path $FinalPath -ExpectedTreeSha256 $ExpectedTreeSha256
                  return $null
              }
              $guard = Open-HmsCompositeDirectoryGuard -Path $Path -Label 'Composite stage activation'
              try {
                  Assert-OwnedCompositeStage -Path $Path -StageId $StageId
                  Assert-OwnedCompositeIdentity -Path $Path -ExpectedTreeSha256 $ExpectedTreeSha256
                  $probe = [string]$env:HMS_TEST_STAGE_ACTIVATION_GUARD_READY
                  if (-not [string]::IsNullOrWhiteSpace($probe)) {
                      [IO.File]::WriteAllText($probe,$Path,(New-Object Text.UTF8Encoding($false)))
                      Start-Sleep -Milliseconds 1200
                  }
                  Move-HmsCompositeDirectoryGuard -Guard $guard -Destination $FinalPath -Label 'Composite stage activation'
                  Assert-OwnedCompositeStage -Path $FinalPath -StageId $StageId
                  Assert-OwnedCompositeIdentity -Path $FinalPath -ExpectedTreeSha256 $ExpectedTreeSha256
                  return $guard
              }
              catch {
                  $activationError = $_
                  if ($null -ne $guard -and $null -ne $guard.Handle -and -not $guard.Handle.IsClosed -and [string]$guard.Path -ceq $FinalPath -and -not (Test-Path -LiteralPath $Path)) {
                      try {
                          Move-HmsCompositeDirectoryGuard -Guard $guard -Destination $Path -Label 'Composite stage activation verification rollback'
                          Assert-OwnedCompositeStage -Path $Path -StageId $StageId
                          Assert-OwnedCompositeIdentity -Path $Path -ExpectedTreeSha256 $ExpectedTreeSha256
                      }
                      catch { throw "Composite stage activation validation failed and exact-object return also failed. Validation: $($activationError.Exception.Message). Return: $($_.Exception.Message)" }
                  }
                  if ($null -ne $guard -and $null -ne $guard.Handle) { $guard.Handle.Dispose(); $guard.Handle = $null }
                  throw $activationError
              }
          }

          '''
          t=once(t,'function Remove-OwnedCompositeStageQuarantine {',stage_helper+'function Remove-OwnedCompositeStageQuarantine {','insert exact composite stage activation helper')

          old_stage_cleanup='''function Remove-OwnedCompositeStageQuarantine {
              param([Parameter(Mandatory)][string]$Path,[Parameter(Mandatory)][string]$StageId)
              if (-not (Test-Path -LiteralPath $Path)) { return }
              Assert-OwnedCompositeStage -Path $Path -StageId $StageId
              $parent = Split-Path -Parent $Path
              $leaf = '.hms-stage-deleting-' + [guid]::NewGuid().ToString('N')
              $quarantine = Join-Path $parent $leaf
              $deleteStarted = $false
              Rename-Item -LiteralPath $Path -NewName $leaf -ErrorAction Stop
              try {
                  Assert-OwnedCompositeStage -Path $quarantine -StageId $StageId
                  $deleteStarted = $true
                  Remove-Item -LiteralPath $quarantine -Recurse -Force
                  if (Test-Path -LiteralPath $quarantine) { throw "Composite stage quarantine removal did not complete: $quarantine" }
              }
              catch {
                  $e = $_
                  if (-not $deleteStarted) {
                      try { Restore-Quarantine -Original $Path -Quarantine $quarantine }
                      catch { throw "Composite stage quarantine validation failed and rollback was incomplete. Original: $($e.Exception.Message). Rollback: $($_.Exception.Message)" }
                  }
                  elseif (Test-Path -LiteralPath $quarantine) {
                      throw "Composite stage deletion failed after destructive removal started; quarantined remainder was not restored: $quarantine. Original: $($e.Exception.Message)"
                  }
                  throw $e
              }
          }
          '''
          new_stage_cleanup=r'''function Remove-OwnedCompositeStageQuarantine {
              param([Parameter(Mandatory)][string]$Path,[Parameter(Mandatory)][string]$StageId)
              if (-not (Test-Path -LiteralPath $Path)) { return }
              $parent = Split-Path -Parent $Path
              $quarantine = Join-Path $parent ('.hms-stage-deleting-' + [guid]::NewGuid().ToString('N'))
              if ($env:OS -cne 'Windows_NT') {
                  Assert-OwnedCompositeStage -Path $Path -StageId $StageId
                  Rename-Item -LiteralPath $Path -NewName (Split-Path -Leaf $quarantine) -ErrorAction Stop
                  Assert-OwnedCompositeStage -Path $quarantine -StageId $StageId
                  Remove-Item -LiteralPath $quarantine -Recurse -Force -ErrorAction Stop
                  return
              }
              $guard = Open-HmsCompositeDirectoryGuard -Path $Path -Label 'Composite stage cleanup'
              $renamed = $false; $deleteStarted = $false
              try {
                  Assert-OwnedCompositeStage -Path $Path -StageId $StageId
                  Move-HmsCompositeDirectoryGuard -Guard $guard -Destination $quarantine -Label 'Composite stage cleanup'
                  $renamed = $true
                  Assert-OwnedCompositeStage -Path $quarantine -StageId $StageId
                  $deleteStarted = $true
                  foreach ($child in @(Get-ChildItem -LiteralPath $quarantine -Force -ErrorAction Stop)) { Remove-Item -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop }
                  $code = 0
                  if (-not [HmsCompositeExactFsNative]::DeleteByHandle($guard.Handle,[ref]$code)) { throw "Composite stage exact delete-pending transition failed (Win32=$code): $quarantine" }
                  $guard.Handle.Dispose(); $guard.Handle = $null
              }
              catch {
                  $e=$_
                  if (-not $deleteStarted -and $renamed -and $null -ne $guard.Handle -and -not (Test-Path -LiteralPath $Path)) {
                      try { Move-HmsCompositeDirectoryGuard -Guard $guard -Destination $Path -Label 'Composite stage cleanup rollback'; Assert-OwnedCompositeStage -Path $Path -StageId $StageId }
                      catch { throw "Composite stage cleanup failed and exact-object rollback was incomplete. Original: $($e.Exception.Message). Rollback: $($_.Exception.Message)" }
                  }
                  elseif ($deleteStarted -and (Test-Path -LiteralPath $quarantine)) { throw "Composite stage deletion failed after destructive child removal started; exact quarantined remainder was not restored: $quarantine. Original: $($e.Exception.Message)" }
                  throw $e
              }
              finally { if ($null -ne $guard -and $null -ne $guard.Handle) { $guard.Handle.Dispose() } }
          }
          '''
          t=once(t,old_stage_cleanup,new_stage_cleanup,'exact composite stage cleanup')
          t=once(t,'    $newActivated = $false\n','    $newActivated = $false\n    $stageActivationGuard = $null\n','stage activation guard declaration')
          old_prev='''            Rename-Item -LiteralPath $FinalRoot -NewName (Split-Path -Leaf $backup) -ErrorAction Stop
                      $oldMovedToBackup = $true
                      Assert-OwnedCompositeIdentity -Path $backup -ExpectedTreeSha256 $previousCompositeTreeSha
                      # Immediately move the exact previous bundle off the predictable backup pathname.
          '''
          new_prev='''            if ($env:OS -ceq 'Windows_NT') {
                          $previousGuard = Open-HmsCompositeDirectoryGuard -Path $FinalRoot -Label 'Previous composite backup transition'
                          try {
                              Assert-OwnedCompositeIdentity -Path $FinalRoot -ExpectedTreeSha256 $previousCompositeTreeSha
                              Move-HmsCompositeDirectoryGuard -Guard $previousGuard -Destination $backup -Label 'Previous composite backup transition'
                              $oldMovedToBackup = $true
                              Assert-OwnedCompositeIdentity -Path $backup -ExpectedTreeSha256 $previousCompositeTreeSha
                          }
                          finally { if ($null -ne $previousGuard -and $null -ne $previousGuard.Handle) { $previousGuard.Handle.Dispose() } }
                      }
                      else {
                          Assert-OwnedCompositeIdentity -Path $FinalRoot -ExpectedTreeSha256 $previousCompositeTreeSha
                          Rename-Item -LiteralPath $FinalRoot -NewName (Split-Path -Leaf $backup) -ErrorAction Stop
                          $oldMovedToBackup = $true
                          Assert-OwnedCompositeIdentity -Path $backup -ExpectedTreeSha256 $previousCompositeTreeSha
                      }
                      # Immediately move the exact previous bundle off the predictable backup pathname.
          '''
          t=once(t,old_prev,new_prev,'previous composite exact backup transition')
          old_activate='''        Assert-OwnedCompositeStage -Path $stage -StageId $stageId
                  Rename-Item -LiteralPath $stage -NewName (Split-Path -Leaf $FinalRoot) -ErrorAction Stop
                  $newActivated = $true
                  $stage = $null
          '''
          new_activate='''        $stageActivationGuard = Move-OwnedCompositeStageToFinal -Path $stage -FinalPath $FinalRoot -StageId $stageId -ExpectedTreeSha256 $candidateCompositeTreeSha
                  $newActivated = $true
                  $stage = $null
          '''
          t=once(t,old_activate,new_activate,'exact stage activation call')
          old_success='''        else {
                      $state = Get-ExactJunctionState -Link $CompositeLink -Target $FinalRoot
                      if ($state.State -eq 'Exact') { Remove-ExactJunction -Link $CompositeLink -Target $FinalRoot }
                      elseif ($state.State -eq 'Conflict') { throw $state.Detail }
                  }
              }
              catch {
                  $mutationError = $_
                  $rollbackErrors = @()
          '''
          new_success='''        else {
                      $state = Get-ExactJunctionState -Link $CompositeLink -Target $FinalRoot
                      if ($state.State -eq 'Exact') { Remove-ExactJunction -Link $CompositeLink -Target $FinalRoot }
                      elseif ($state.State -eq 'Conflict') { throw $state.Detail }
                  }
                  if ($null -ne $stageActivationGuard) {
                      $finalHandleIdentity = Get-HmsCompositeDirectoryIdentityFromHandle -Handle $stageActivationGuard.Handle -Label 'Composite stage discovery publication'
                      if ($finalHandleIdentity -cne [string]$stageActivationGuard.Identity) { throw 'Composite stage exact identity changed before discovery publication completed.' }
                      Assert-OwnedCompositeIdentity -Path $FinalRoot -ExpectedTreeSha256 $candidateCompositeTreeSha
                      $stageActivationGuard.Handle.Dispose(); $stageActivationGuard.Handle = $null; $stageActivationGuard = $null
                  }
              }
              catch {
                  $mutationError = $_
                  if ($null -ne $stageActivationGuard -and $null -ne $stageActivationGuard.Handle) { $stageActivationGuard.Handle.Dispose(); $stageActivationGuard.Handle = $null; $stageActivationGuard = $null }
                  $rollbackErrors = @()
          '''
          t=once(t,old_success,new_success,'stage guard through discovery publication')
          save(p,t)

          # 2) CodeGraph: immutable locked archive authority, immutable archive-derived tree,
          #    no pre-publication launcher execution, and exact-handle current/candidate renames.
          p='scripts/Sync-DeliveryTools.ps1'; t=load(p)
          archive_helpers=r'''
          function Get-CodeGraphArchiveLogicalTreeSha256 {
              param([Parameter(Mandatory)][string]$ArchivePath,[Parameter(Mandatory)][string]$Architecture)
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $archive = [IO.Compression.ZipFile]::OpenRead($ArchivePath)
              try {
                  $files = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty([string]$_.Name) })
                  if ($files.Count -eq 0) { throw "CodeGraph verified archive contains no files: $ArchivePath" }
                  $prefix = "codegraph-win32-$Architecture/"
                  $prefixed = @($files | Where-Object { ([string]$_.FullName).Replace('\\','/').StartsWith($prefix,[StringComparison]::Ordinal) })
                  $selected = if ($prefixed.Count -gt 0) { $prefixed } else { $files }
                  $records = New-Object System.Collections.Generic.List[string]
                  $seen = @{}
                  foreach ($entry in $selected) {
                      $name = ([string]$entry.FullName).Replace('\\','/')
                      $logical = if ($prefixed.Count -gt 0) { $name.Substring($prefix.Length) } else { $name.TrimStart('/') }
                      if ([string]::IsNullOrWhiteSpace($logical) -or $logical.StartsWith('/') -or $logical.Contains('\\') -or $logical -match '(^|/)\.\.(/|$)' -or $logical -match '^[A-Za-z]:') { throw "CodeGraph archive contains unsafe logical path: $name" }
                      $key = $logical.ToLowerInvariant()
                      if ($seen.ContainsKey($key)) { throw "CodeGraph archive contains duplicate Windows logical path: $logical" }
                      $seen[$key] = $true
                      $stream = $entry.Open(); $sha = [Security.Cryptography.SHA256]::Create()
                      try { $hash = ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','').ToLowerInvariant() }
                      finally { $sha.Dispose(); $stream.Dispose() }
                      $records.Add($logical + "`t" + $hash)
                  }
                  $sorted = [string[]]@($records); [Array]::Sort($sorted,[StringComparer]::Ordinal)
                  $payload = [string]::Join("`n",$sorted)
                  $treeSha = [Security.Cryptography.SHA256]::Create()
                  try { return ([BitConverter]::ToString($treeSha.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload)))).Replace('-','').ToLowerInvariant() }
                  finally { $treeSha.Dispose() }
              }
              finally { $archive.Dispose() }
          }

          function Open-CodeGraphVerifiedArchive {
              param([Parameter(Mandatory)][string]$Path,[Parameter(Mandatory)][string]$ExpectedSha256,[Parameter(Mandatory)][string]$Architecture)
              $stream = New-Object IO.FileStream($Path,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
              try {
                  $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actual -cne $ExpectedSha256) { throw "CodeGraph release asset SHA-256 mismatch. Expected $ExpectedSha256, found $actual" }
                  $tree = Get-CodeGraphArchiveLogicalTreeSha256 -ArchivePath $Path -Architecture $Architecture
                  return [pscustomobject]@{ Stream=$stream; ExpectedTreeSha256=$tree; AssetSha256=$actual }
              }
              catch { $stream.Dispose(); throw }
          }

          function Move-CodeGraphCandidateToCurrent {
              param([Parameter(Mandatory)][string]$CandidatePath,[Parameter(Mandatory)][string]$CurrentPath,[Parameter(Mandatory)]$Identity)
              if (Test-Path -LiteralPath $CurrentPath) { throw "CodeGraph current path is occupied before candidate activation: $CurrentPath" }
              $guard = Open-HmsDeliveryDirectoryGuard -Path $CandidatePath -Label 'CodeGraph candidate activation'
              try {
                  Assert-CodeGraphTransactionBundle -Path $CandidatePath -Identity $Identity
                  $probe = [string]$env:HMS_TEST_CODEGRAPH_CANDIDATE_GUARD_READY
                  if (-not [string]::IsNullOrWhiteSpace($probe)) { [IO.File]::WriteAllText($probe,$CandidatePath,(New-Object Text.UTF8Encoding($false))); Start-Sleep -Milliseconds 1200 }
                  Move-HmsDeliveryDirectoryGuard -Guard $guard -Destination $CurrentPath -Label 'CodeGraph candidate activation'
                  Assert-CodeGraphTransactionBundle -Path $CurrentPath -Identity $Identity
                  return $guard
              }
              catch {
                  $e=$_
                  if ($null -ne $guard -and $null -ne $guard.Handle -and -not $guard.Handle.IsClosed -and [string]$guard.Path -ceq $CurrentPath -and -not (Test-Path -LiteralPath $CandidatePath)) {
                      try { Move-HmsDeliveryDirectoryGuard -Guard $guard -Destination $CandidatePath -Label 'CodeGraph candidate activation rollback'; Assert-CodeGraphTransactionBundle -Path $CandidatePath -Identity $Identity }
                      catch { throw "CodeGraph candidate activation failed and exact-object return also failed. Original: $($e.Exception.Message). Return: $($_.Exception.Message)" }
                  }
                  if ($null -ne $guard -and $null -ne $guard.Handle) { $guard.Handle.Dispose(); $guard.Handle = $null }
                  throw $e
              }
          }

          '''
          t=once(t,'function Read-ManagedCodeGraphManifest {',archive_helpers+'function Read-ManagedCodeGraphManifest {','insert CodeGraph immutable archive/exact activation helpers')

          old_move='''function Move-CodeGraphCurrentToRollbackBackup {
              param(
                  [Parameter(Mandatory)][string]$CurrentPath,
                  [Parameter(Mandatory)][string]$BackupPath,
                  [Parameter(Mandatory)]$ExistingManifest,
                  [Parameter(Mandatory)]$BackupIdentity,
                  [ref]$PreviousIdentityRef
              )
              if (-not (Test-Path -LiteralPath $CurrentPath)) { throw "CodeGraph current bundle disappeared before backup preparation: $CurrentPath" }
              if (Test-Path -LiteralPath $BackupPath) { throw "CodeGraph rollback backup path is already occupied: $BackupPath" }

              # Authenticate the existing bundle from the root-manifest-pinned transaction marker and
              # deterministic tree hash before touching or executing any bytes beneath current.
              $existingIdentity = Assert-CodeGraphBundleAgainstManifest -Path $CurrentPath -Manifest $ExistingManifest
              if ($null -ne $PreviousIdentityRef) { $PreviousIdentityRef.Value = $existingIdentity }

              $markerRewritten = $false
              try {
                  Write-CodeGraphBundleMarker -Path $CurrentPath -Identity $BackupIdentity
                  $markerRewritten = $true
                  Assert-CodeGraphTransactionBundle -Path $CurrentPath -Identity $BackupIdentity
                  Move-Item -LiteralPath $CurrentPath -Destination $BackupPath
                  # Path-independent validation only. Never execute a launcher from a randomized backup path.
                  Assert-CodeGraphTransactionBundle -Path $BackupPath -Identity $BackupIdentity
              }
              catch {
                  $transitionError = $_
                  if ($markerRewritten -and (Test-Path -LiteralPath $CurrentPath) -and -not (Test-Path -LiteralPath $BackupPath)) {
                      try {
                          Write-CodeGraphBundleMarker -Path $CurrentPath -Identity $existingIdentity
                          Assert-CodeGraphTransactionBundle -Path $CurrentPath -Identity $existingIdentity
                      }
                      catch {
                          throw "CodeGraph current-to-backup transition failed and original marker restoration was incomplete. Original: $($transitionError.Exception.Message). Rollback: $($_.Exception.Message)"
                      }
                  }
                  throw $transitionError
              }
              return $existingIdentity
          }
          '''
          new_move=r'''function Move-CodeGraphCurrentToRollbackBackup {
              param(
                  [Parameter(Mandatory)][string]$CurrentPath,
                  [Parameter(Mandatory)][string]$BackupPath,
                  [Parameter(Mandatory)]$ExistingManifest,
                  [Parameter(Mandatory)]$BackupIdentity,
                  [ref]$PreviousIdentityRef
              )
              if (-not (Test-Path -LiteralPath $CurrentPath)) { throw "CodeGraph current bundle disappeared before backup preparation: $CurrentPath" }
              if (Test-Path -LiteralPath $BackupPath) { throw "CodeGraph rollback backup path is already occupied: $BackupPath" }
              $currentGuard = Open-HmsDeliveryDirectoryGuard -Path $CurrentPath -Label 'CodeGraph current-to-backup transition'
              try {
                  $existingIdentity = Assert-CodeGraphBundleAgainstManifest -Path $CurrentPath -Manifest $ExistingManifest
                  if ($null -ne $PreviousIdentityRef) { $PreviousIdentityRef.Value = $existingIdentity }
                  $markerRewritten = $false
                  try {
                      Write-CodeGraphBundleMarker -Path $CurrentPath -Identity $BackupIdentity
                      $markerRewritten = $true
                      Assert-CodeGraphTransactionBundle -Path $CurrentPath -Identity $BackupIdentity
                      $probe = [string]$env:HMS_TEST_CODEGRAPH_CURRENT_GUARD_READY
                      if (-not [string]::IsNullOrWhiteSpace($probe)) { [IO.File]::WriteAllText($probe,$CurrentPath,(New-Object Text.UTF8Encoding($false))); Start-Sleep -Milliseconds 1200 }
                      Move-HmsDeliveryDirectoryGuard -Guard $currentGuard -Destination $BackupPath -Label 'CodeGraph current-to-backup transition'
                      Assert-CodeGraphTransactionBundle -Path $BackupPath -Identity $BackupIdentity
                  }
                  catch {
                      $transitionError = $_
                      if ($markerRewritten -and [string]$currentGuard.Path -ceq $CurrentPath -and (Test-Path -LiteralPath $CurrentPath) -and -not (Test-Path -LiteralPath $BackupPath)) {
                          try { Write-CodeGraphBundleMarker -Path $CurrentPath -Identity $existingIdentity; Assert-CodeGraphTransactionBundle -Path $CurrentPath -Identity $existingIdentity }
                          catch { throw "CodeGraph current-to-backup transition failed and original marker restoration was incomplete. Original: $($transitionError.Exception.Message). Rollback: $($_.Exception.Message)" }
                      }
                      throw $transitionError
                  }
                  return $existingIdentity
              }
              finally { if ($null -ne $currentGuard -and $null -ne $currentGuard.Handle) { $currentGuard.Handle.Dispose() } }
          }
          '''
          t=once(t,old_move,new_move,'CodeGraph exact current-to-backup transition')
          t=once(t,'        $previousIdentity = $null\n        $manifestPublished = $false\n','        $previousIdentity = $null\n        $candidateActivationGuard = $null\n        $manifestPublished = $false\n','CodeGraph candidate guard declaration')

          old_extract='''            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
                      $actualSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
                      if ($actualSha -ne $expectedSha) { throw "CodeGraph release asset SHA-256 mismatch. Expected $expectedSha, found $actualSha" }
                      Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

                      $inner = Join-Path $extract ("codegraph-win32-" + $arch)
                      if (Test-Path -LiteralPath $inner) {
                          $flat = Join-Path $temp 'flat'
                          New-Item -ItemType Directory -Force -Path $flat | Out-Null
                          Get-ChildItem -LiteralPath $inner -Force | ForEach-Object { Move-Item -LiteralPath $_.FullName -Destination $flat -Force }
                          $candidate = $flat
                      }
                      $candidateCommand = Join-Path $candidate 'bin\\codegraph.cmd'
                      # Execution is allowed only here, while bytes are still inside the freshly downloaded,
                      # exact-SHA-qualified release candidate. Persisted/renamed bundles are validated by bytes only.
                      Assert-CodeGraphVersion -CommandPath $candidateCommand -ExpectedVersion ([string]$Spec.version)
                      $candidateTreeSha = Get-CodeGraphBundleTreeSha256 -Path $candidate
                      $candidateIdentity = New-CodeGraphBundleIdentity -TransactionId $transactionId -Role 'candidate' -Version ([string]$Spec.version) -Tag ([string]$Spec.tag) -Commit ([string]$Spec.commit) -Asset $assetName -Sha256 $expectedSha -BundleTreeSha256 $candidateTreeSha
                      Write-CodeGraphBundleMarker -Path $candidate -Identity $candidateIdentity
                      Assert-CodeGraphTransactionBundle -Path $candidate -Identity $candidateIdentity
          '''
          new_extract='''            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
                      $archiveAuthority = $null
                      try {
                          $archiveAuthority = Open-CodeGraphVerifiedArchive -Path $zip -ExpectedSha256 $expectedSha -Architecture $arch
                          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
                          $inner = Join-Path $extract ("codegraph-win32-" + $arch)
                          if (Test-Path -LiteralPath $inner) {
                              $flat = Join-Path $temp 'flat'
                              New-Item -ItemType Directory -Force -Path $flat | Out-Null
                              Get-ChildItem -LiteralPath $inner -Force | ForEach-Object { Move-Item -LiteralPath $_.FullName -Destination $flat -Force }
                              $candidate = $flat
                          }
                          $candidateCommand = Join-Path $candidate 'bin\\codegraph.cmd'
                          $commandItem = Get-Item -LiteralPath $candidateCommand -Force -ErrorAction Stop
                          if ([bool]$commandItem.PSIsContainer -or [bool]($commandItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "CodeGraph launcher must be a regular non-reparse file: $candidateCommand" }
                          # Do not execute extracted release bytes before publication. The exact locked ZIP SHA and
                          # archive-derived logical tree are immutable authority for every persisted candidate byte.
                          $actualCandidateTree = Get-CodeGraphBundleTreeSha256 -Path $candidate
                          if ($actualCandidateTree -cne [string]$archiveAuthority.ExpectedTreeSha256) { throw "CodeGraph extracted candidate tree does not match the exact verified archive. Expected $($archiveAuthority.ExpectedTreeSha256), found $actualCandidateTree" }
                          $candidateTreeSha = [string]$archiveAuthority.ExpectedTreeSha256
                          $candidateIdentity = New-CodeGraphBundleIdentity -TransactionId $transactionId -Role 'candidate' -Version ([string]$Spec.version) -Tag ([string]$Spec.tag) -Commit ([string]$Spec.commit) -Asset $assetName -Sha256 $expectedSha -BundleTreeSha256 $candidateTreeSha
                          Write-CodeGraphBundleMarker -Path $candidate -Identity $candidateIdentity
                          Assert-CodeGraphTransactionBundle -Path $candidate -Identity $candidateIdentity
                      }
                      finally { if ($null -ne $archiveAuthority -and $null -ne $archiveAuthority.Stream) { $archiveAuthority.Stream.Dispose(); $archiveAuthority.Stream = $null } }
          '''
          t=once(t,old_extract,new_extract,'immutable CodeGraph archive/extracted tree binding')
          t=once(t,'                Move-Item -LiteralPath $candidate -Destination $current\n                Assert-CodeGraphTransactionBundle -Path $current -Identity $candidateIdentity\n','                $candidateActivationGuard = Move-CodeGraphCandidateToCurrent -CandidatePath $candidate -CurrentPath $current -Identity $candidateIdentity\n                Assert-CodeGraphTransactionBundle -Path $current -Identity $candidateIdentity\n','exact CodeGraph candidate activation')
          old_manifest='''                $manifestPublished = $true
                          if ($null -ne $backup -and (Test-Path -LiteralPath $backup)) {
                              Remove-CodeGraphTransactionBundle -Path $backup -Identity $backupIdentity
                          }
                      }
                      catch {
                          $installError = $_
                          if ($null -eq $candidateIdentity) { throw $installError }
          '''
          new_manifest='''                $manifestPublished = $true
                          Assert-CodeGraphTransactionBundle -Path $current -Identity $candidateIdentity
                          if ($null -ne $candidateActivationGuard -and $null -ne $candidateActivationGuard.Handle) { $candidateActivationGuard.Handle.Dispose(); $candidateActivationGuard.Handle = $null; $candidateActivationGuard = $null }
                          if ($null -ne $backup -and (Test-Path -LiteralPath $backup)) {
                              Remove-CodeGraphTransactionBundle -Path $backup -Identity $backupIdentity
                          }
                      }
                      catch {
                          $installError = $_
                          if ($null -ne $candidateActivationGuard -and $null -ne $candidateActivationGuard.Handle) { $candidateActivationGuard.Handle.Dispose(); $candidateActivationGuard.Handle = $null; $candidateActivationGuard = $null }
                          if ($null -eq $candidateIdentity) { throw $installError }
          '''
          t=once(t,old_manifest,new_manifest,'CodeGraph guard through manifest publication')
          t=once(t,"        finally {\n            if (Test-Path -LiteralPath $temp) { Remove-CodeGraphTempRoot -Path $temp -TransactionId $transactionId }\n        }\n","        finally {\n            if ($null -ne $candidateActivationGuard -and $null -ne $candidateActivationGuard.Handle) { $candidateActivationGuard.Handle.Dispose(); $candidateActivationGuard = $null }\n            if (Test-Path -LiteralPath $temp) { Remove-CodeGraphTempRoot -Path $temp -TransactionId $transactionId }\n        }\n",'CodeGraph final candidate guard disposal')
          save(p,t)

          # 3) Model Settings popup/read path uses the same exact locked-handle reader as writes.
          p='manager/HmsModelSettings.utf8.ps1'; t=load(p)
          old_reader='''function Read-ModelState-Unserialized {
              param([string]$Path = $SettingsPath)
              if (-not (Test-Path -LiteralPath $Path)) { return New-DefaultModelState }
              Assert-RegularSettingsFile -Path $Path
              try { $text = [IO.File]::ReadAllText($Path,(New-Object System.Text.UTF8Encoding($false,$true))) }
              catch { throw "Model settings could not be read: $($_.Exception.Message)" }
              return Convert-ModelSettingsTextToState -Text $text -Label 'Model settings'
          }
          '''
          new_reader=r'''function Read-ModelState-Unserialized {
              param([string]$Path = $SettingsPath)
              if (-not (Test-Path -LiteralPath $Path)) { return New-DefaultModelState }
              $guard = $null
              try {
                  $guard = Open-HmsModelSettingsFileGuard -Path $Path -Label 'Model settings'
                  return Read-ModelStateFromGuard -Guard $guard -Label 'Model settings'
              }
              finally { if ($null -ne $guard -and $null -ne $guard.Handle) { $guard.Handle.Dispose(); $guard.Handle = $null } }
          }
          '''
          t=once(t,old_reader,new_reader,'guarded Model Settings read path')
          save(p,t)

          # 4) Permanent exact-SHA regression gate: static contracts + deterministic lock probes.
          p='.github/workflows/validate-p1-trust-boundaries.yml'; t=load(p)
          if 'Qualify fresh-review V9 exact-object activation boundaries' in t: raise SystemExit('V9 regression step already exists')
          step=r'''

                - name: Qualify fresh-review V9 exact-object activation boundaries
                  shell: pwsh
                  run: |
                    $ErrorActionPreference='Stop'
                    Set-StrictMode -Version Latest
                    $builder=Join-Path $env:GITHUB_WORKSPACE 'scripts\\Build-HmsCompositeSkill.ps1'
                    $impl=Join-Path $env:GITHUB_WORKSPACE 'scripts\\Build-HmsCompositeSkill.impl.ps1'
                    $delivery=Join-Path $env:GITHUB_WORKSPACE 'scripts\\Sync-DeliveryTools.ps1'
                    $model=Join-Path $env:GITHUB_WORKSPACE 'manager\\HmsModelSettings.utf8.ps1'
                    $modelShim=Join-Path $env:GITHUB_WORKSPACE 'manager\\HmsModelSettings.ps1'
                    $it=[IO.File]::ReadAllText($impl);$dt=[IO.File]::ReadAllText($delivery);$mt=[IO.File]::ReadAllText($model)
                    foreach($literal in @('Move-OwnedCompositeStageToFinal','Move-HmsCompositeDirectoryGuard -Guard $previousGuard','Composite stage discovery publication')){if($it -notmatch [regex]::Escape($literal)){throw "Missing V9 composite exact-object contract: $literal"}}
                    if($it -match [regex]::Escape('Rename-Item -LiteralPath $stage -NewName (Split-Path -Leaf $FinalRoot)')){throw 'Composite stage activation still uses the mutable stage pathname.'}
                    foreach($literal in @('Open-CodeGraphVerifiedArchive','Get-CodeGraphArchiveLogicalTreeSha256','Move-HmsDeliveryDirectoryGuard -Guard $currentGuard','Move-CodeGraphCandidateToCurrent','archive-derived logical tree')){if($dt -notmatch [regex]::Escape($literal)){throw "Missing V9 CodeGraph trust contract: $literal"}}
                    foreach($bad in @('Move-Item -LiteralPath $CurrentPath -Destination $BackupPath','Move-Item -LiteralPath $candidate -Destination $current','Assert-CodeGraphVersion -CommandPath $candidateCommand')){if($dt -match [regex]::Escape($bad)){throw "CodeGraph retains superseded mutable/executable transition: $bad"}}
                    $reader=[regex]::Match($mt,'(?s)function Read-ModelState-Unserialized \{.*?\n\}').Value
                    foreach($literal in @('Open-HmsModelSettingsFileGuard','Read-ModelStateFromGuard')){if($reader -notmatch [regex]::Escape($literal)){throw "Model Settings reader missing exact guard contract: $literal"}}
                    if($reader -match [regex]::Escape('[IO.File]::ReadAllText')){throw 'Model Settings reader still reopens canonical pathname after regular-file validation.'}

                    # Composite stage guard: while the exact DELETE-capable stage root handle is live,
                    # a second process must be unable to rename/replace that staged object.
                    $r=Join-Path $env:RUNNER_TEMP ('hms-v9-stage-'+[guid]::NewGuid().ToString('N'));$o=Join-Path $r 'out';$s=Join-Path $r 'skills';$signal=Join-Path $r 'ready.txt';New-Item -ItemType Directory -Force -Path $r|Out-Null
                    $job=Start-Job -ScriptBlock {param($b,$repo,$o,$s,$sig);$env:HMS_TEST_STAGE_ACTIVATION_GUARD_READY=$sig;& $b -InstallRoot $repo -OutputRoot $o -SkillsRoot $s -Hms $false -Superpowers $false -Taste $false -Impeccable $false} -ArgumentList $builder,$env:GITHUB_WORKSPACE,$o,$s,$signal
                    try{$deadline=[DateTime]::UtcNow.AddSeconds(40);while(-not(Test-Path -LiteralPath $signal)-and[DateTime]::UtcNow-lt$deadline){Start-Sleep -Milliseconds 50};if(-not(Test-Path -LiteralPath $signal)){throw 'Stage guard probe never became ready.'};$stage=[IO.File]::ReadAllText($signal);$blocked=$false;try{Rename-Item -LiteralPath $stage -NewName 'foreign-stage-swap' -ErrorAction Stop}catch{$blocked=$true};if(-not$blocked){throw 'Exact stage guard allowed hostile stage rename.'};$null=Wait-Job $job -Timeout 60;if($job.State-ne'Completed'){throw "Stage build probe failed: $($job.State)"};Receive-Job $job -ErrorAction Stop|Out-Null}finally{Remove-Job $job -Force -ErrorAction SilentlyContinue;Remove-Item $r -Recurse -Force -ErrorAction SilentlyContinue}

                    . $delivery -SkipCodeGraph -SkipThreeLevelDelivery
                    # Exact verified archive: holding authority must block replacement, and archive-derived
                    # logical tree must equal extracted immutable contents.
                    $r=Join-Path $env:RUNNER_TEMP ('hms-v9-zip-'+[guid]::NewGuid().ToString('N'));$src=Join-Path $r 'codegraph-win32-x64';$bin=Join-Path $src 'bin';$zip=Join-Path $r 'cg.zip';$x=Join-Path $r 'x';New-Item -ItemType Directory -Force -Path $bin|Out-Null;[IO.File]::WriteAllText((Join-Path $bin 'codegraph.cmd'),'@echo off',[Text.Encoding]::ASCII);[IO.File]::WriteAllText((Join-Path $src 'payload.txt'),'immutable',[Text.Encoding]::UTF8);Compress-Archive -Path $src -DestinationPath $zip; $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$a=Open-CodeGraphVerifiedArchive -Path $zip -ExpectedSha256 $sha -Architecture 'x64'
                    try{$blocked=$false;try{Move-Item -LiteralPath $zip -Destination (Join-Path $r 'swap.zip') -ErrorAction Stop}catch{$blocked=$true};if(-not$blocked){throw 'Verified archive authority allowed pathname replacement.'};Expand-Archive $zip -DestinationPath $x; $inner=Join-Path $x 'codegraph-win32-x64';$tree=Get-CodeGraphBundleTreeSha256 -Path $inner;if($tree-cne[string]$a.ExpectedTreeSha256){throw 'Archive-derived tree did not match extracted immutable tree.'}}finally{$a.Stream.Dispose();Remove-Item $r -Recurse -Force -ErrorAction SilentlyContinue}

                    # Model Settings direct production self-test exercises the guarded read/write resolver path.
                    & $modelShim -SelfTest
                    Write-Host 'PASS: V9 fresh-review exact-object stage/CodeGraph/archive/Model-Settings boundaries qualified.'
          '''
          t += step
          save(p,t)
