name: Diagnose composite builder support cleanup race

on:
  push:
    branches: ['stage/hms-superpowers-v0.2.0-ui-design-authority']

permissions:
  contents: read

jobs:
  windows-builder-support-cleanup-race:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Diagnose exact handle rename path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $workspace = $env:GITHUB_WORKSPACE
          $builderPath = Join-Path $workspace 'scripts\Build-HmsCompositeSkill.ps1'
          $source = [IO.File]::ReadAllText($builderPath)
          foreach ($literal in @('SetFileInformationByHandle','RenameHmsOwnedDirectoryByHandle','[uint32]0x00010000')) {
            if ($source -notmatch [regex]::Escape($literal)) { throw "Production exact-handle contract missing: $literal" }
          }

          $start = $source.IndexOf("if (-not ('HmsOwnedTempNative' -as [type])) {")
          $endMarker = "`n`n`n`$repoRoot = Split-Path -Parent `$PSScriptRoot"
          $end = $source.IndexOf($endMarker,$start)
          if ($start -lt 0 -or $end -lt 0) { throw 'Could not isolate production owned-temp helper prelude.' }
          $helperPath = Join-Path $env:RUNNER_TEMP ('hms-owned-temp-helper-' + [guid]::NewGuid().ToString('N') + '.ps1')
          [IO.File]::WriteAllText($helperPath,$source.Substring($start,$end-$start),(New-Object Text.UTF8Encoding($false)))
          . $helperPath

          if (-not ('HmsHandlePathNative' -as [type])) {
            Add-Type -TypeDefinition @'
using System;
using System.Runtime.InteropServices;
using System.Text;
using Microsoft.Win32.SafeHandles;

public static class HmsHandlePathNative
{
    [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
    public static extern uint GetFinalPathNameByHandleW(
        SafeFileHandle hFile,
        StringBuilder lpszFilePath,
        uint cchFilePath,
        uint dwFlags);
}
'@
          }

          function Get-OracleHandlePath {
            param([Parameter(Mandatory)]$Handle)
            $buffer = New-Object Text.StringBuilder 4096
            $n = [HmsHandlePathNative]::GetFinalPathNameByHandleW($Handle,$buffer,[uint32]$buffer.Capacity,[uint32]0)
            if ($n -eq 0 -or $n -ge $buffer.Capacity) {
              $code=[Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "GetFinalPathNameByHandleW failed/overflowed: n=$n Win32=$code"
            }
            return $buffer.ToString()
          }

          $owned = New-HmsOwnedTempDirectory -Prefix 'hms-owned-temp-oracle-' -Label 'handle-rename oracle'
          $original = [string]$owned.Path
          $moved = $original + '-moved-by-foreign'
          $parent = Split-Path -Parent $original
          $quarantine = Join-Path $parent ('.hms-owned-temp-oracle-quarantine-' + [guid]::NewGuid().ToString('N'))
          $foreign = Join-Path $original 'FOREIGN.txt'
          $job = $null
          $finalHandlePath = $null
          try {
            Write-Host "HANDLE_PATH_INITIAL=$(Get-OracleHandlePath -Handle $owned.Guard)"
            $job = Start-Job -ScriptBlock {
              param($Original,$Moved)
              $ErrorActionPreference='Stop'
              Rename-Item -LiteralPath $Original -NewName (Split-Path -Leaf $Moved) -ErrorAction Stop
            } -ArgumentList $original,$moved
            $null=Wait-Job -Job $job -Timeout 20
            if($job.State -ne 'Completed'){throw "Foreign rename job state=$($job.State)"}
            Receive-Job -Job $job -ErrorAction Stop | Out-Null
            Write-Host "HANDLE_PATH_AFTER_FOREIGN_RENAME=$(Get-OracleHandlePath -Handle $owned.Guard)"
            Write-Host "MOVED_EXISTS_BEFORE_HANDLE_RENAME=$(Test-Path -LiteralPath $moved -PathType Container)"

            New-Item -ItemType Directory -Path $original -ErrorAction Stop | Out-Null
            [IO.File]::WriteAllText($foreign,'foreign',(New-Object Text.UTF8Encoding($false)))

            $renameError=0
            $ok=[HmsOwnedTempNative]::RenameHmsOwnedDirectoryByHandle($owned.Guard,$quarantine,[ref]$renameError)
            Write-Host "HANDLE_RENAME_OK=$ok"
            Write-Host "HANDLE_RENAME_ERROR=$renameError"
            $finalHandlePath=Get-OracleHandlePath -Handle $owned.Guard
            Write-Host "HANDLE_PATH_AFTER_HANDLE_RENAME=$finalHandlePath"
            Write-Host "EXPECTED_QUARANTINE=$quarantine"
            Write-Host "EXPECTED_QUARANTINE_EXISTS=$(Test-Path -LiteralPath $quarantine -PathType Container)"
            Write-Host "MOVED_EXISTS_AFTER_HANDLE_RENAME=$(Test-Path -LiteralPath $moved -PathType Container)"
            Write-Host "FOREIGN_SENTINEL_SURVIVES=$(Test-Path -LiteralPath $foreign -PathType Leaf)"
            $siblings=@(Get-ChildItem -LiteralPath $parent -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'hms-owned-temp-oracle-*' -or $_.Name -like '.hms-owned-temp-oracle-*' } | ForEach-Object FullName)
            Write-Host ('ORACLE_SIBLINGS=' + ($siblings -join '|'))
            throw 'ORACLE_COMPLETE'
          }
          finally {
            if($null -ne $job){Remove-Job -Job $job -Force -ErrorAction SilentlyContinue}
            if($null -ne $owned.Guard){$owned.Guard.Dispose();$owned.Guard=$null}
            foreach($p in @($original,$moved,$quarantine,$finalHandlePath,$helperPath)){
              if([string]::IsNullOrWhiteSpace([string]$p)){continue}
              $clean=[string]$p
              if($clean.StartsWith('\\?\')){$clean=$clean.Substring(4)}
              if(Test-Path -LiteralPath $clean){Remove-Item -LiteralPath $clean -Recurse -Force -ErrorAction SilentlyContinue}
            }
          }
