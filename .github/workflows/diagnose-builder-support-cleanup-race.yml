name: Diagnose composite builder support cleanup race

on:
  push:
    branches: ['stage/hms-superpowers-v0.2.0-ui-design-authority']

permissions:
  contents: read

jobs:
  windows-builder-support-cleanup-race:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Qualify exact filesystem identity cleanup boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $workspace = $env:GITHUB_WORKSPACE

          foreach ($relative in @('scripts\Build-HmsCompositeSkill.ps1','scripts\Copy-HmsCommittedGitPath.ps1')) {
            $path = Join-Path $workspace $relative
            $text = [IO.File]::ReadAllText($path)
            foreach ($literal in @(
              'function Open-HmsOwnedDirectoryIdentityHandle',
              'function Get-HmsOwnedDirectoryIdentity',
              'function New-HmsOwnedTempDirectory',
              'function Remove-HmsOwnedTempDirectory',
              "'.hms-owned-temp-quarantine-'",
              '-ShareMode ([uint32]3)'
            )) {
              if ($text -notmatch [regex]::Escape($literal)) { throw "$relative is missing owned-temp identity contract: $literal" }
            }
            if ($text -match [regex]::Escape('Remove-Item -LiteralPath $transportRoot -Recurse -Force -ErrorAction SilentlyContinue')) {
              throw "$relative still recursively deletes a transport pathname without identity binding."
            }
          }

          # Extract the exact production helper prelude from the public builder and execute it in isolation.
          $builderPath = Join-Path $workspace 'scripts\Build-HmsCompositeSkill.ps1'
          $source = [IO.File]::ReadAllText($builderPath)
          $start = $source.IndexOf("if (-not ('HmsOwnedTempNative' -as [type])) {")
          $endMarker = "`n`n`n`$repoRoot = Split-Path -Parent `$PSScriptRoot"
          $end = $source.IndexOf($endMarker,$start)
          if ($start -lt 0 -or $end -lt 0) { throw 'Could not isolate production owned-temp helper prelude.' }
          $helperText = $source.Substring($start,$end-$start)
          $helperPath = Join-Path $env:RUNNER_TEMP ('hms-owned-temp-helper-' + [guid]::NewGuid().ToString('N') + '.ps1')
          [IO.File]::WriteAllText($helperPath,$helperText,(New-Object Text.UTF8Encoding($false)))
          . $helperPath

          # Case A: active guard must deny rename/delete sharing by a non-cooperating process.
          $ownedA = New-HmsOwnedTempDirectory -Prefix 'hms-owned-temp-active-' -Label 'active-guard regression'
          $movedA = ([string]$ownedA.Path) + '-moved'
          $renameBlocked = $false
          try {
            try { Rename-Item -LiteralPath ([string]$ownedA.Path) -NewName (Split-Path -Leaf $movedA) -ErrorAction Stop }
            catch { $renameBlocked = $true }
            if (-not $renameBlocked) { throw 'Active owned-temp guard allowed the root to be renamed.' }
            Remove-HmsOwnedTempDirectory -Owned $ownedA -Label 'active-guard regression'
            if (Test-Path -LiteralPath ([string]$ownedA.Path)) { throw 'Exact owned temp root remained after normal identity-bound cleanup.' }
          }
          finally {
            if ($null -ne $ownedA.Guard) { $ownedA.Guard.Dispose(); $ownedA.Guard=$null }
            foreach ($p in @([string]$ownedA.Path,$movedA)) { if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue } }
          }

          # Case B: after guard release, replace the pathname and prove cleanup rejects the foreign object.
          $ownedB = New-HmsOwnedTempDirectory -Prefix 'hms-owned-temp-replace-' -Label 'foreign-replacement regression'
          $originalB = [string]$ownedB.Path
          $movedB = $originalB + '-owned-original'
          $sentinelB = Join-Path $originalB 'FOREIGN-PRESERVE.txt'
          try {
            $ownedB.Guard.Dispose(); $ownedB.Guard=$null
            Rename-Item -LiteralPath $originalB -NewName (Split-Path -Leaf $movedB) -ErrorAction Stop
            New-Item -ItemType Directory -Path $originalB -ErrorAction Stop | Out-Null
            [IO.File]::WriteAllText($sentinelB,'foreign replacement must survive',(New-Object Text.UTF8Encoding($false)))
            $rejected = $false
            try { Remove-HmsOwnedTempDirectory -Owned $ownedB -Label 'foreign-replacement regression' }
            catch {
              if ($_.Exception.Message -match 'cleanup rejected a foreign pathname replacement') { $rejected = $true }
              else { throw }
            }
            if (-not $rejected) { throw 'Identity-bound cleanup accepted a foreign pathname replacement.' }
            if (-not (Test-Path -LiteralPath $sentinelB -PathType Leaf)) { throw 'Identity-bound cleanup deleted the foreign replacement.' }
            if (-not (Test-Path -LiteralPath $movedB -PathType Container)) { throw 'Original exact owned directory disappeared during foreign-replacement regression.' }
          }
          finally {
            foreach ($p in @($originalB,$movedB,$helperPath)) { if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue } }
          }

          Write-Host 'PASS: active filesystem guard blocks support-root rename and identity-bound cleanup rejects/deletes no foreign pathname replacement.'
