name: Add lifecycle target EOL RED test

on:
  push:
    paths:
      - '.github/workflows/add-lifecycle-target-eol-red-test.yml'

permissions:
  contents: write

jobs:
  add-lifecycle-target-eol-red-test:
    runs-on: windows-latest
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Prove exact guarded inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Workflow checkout mismatch: $head" }
          $sourceRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $remoteLine = ((& git ls-remote origin $sourceRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve guarded source ref.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "Guarded source ref moved. Expected $head, found $remoteSha" }
          $status = ((& git status --porcelain=v1 --untracked-files=all) -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($status)) { throw "Workflow checkout is not clean: $status" }

      - name: Add permanent authenticated lifecycle target EOL contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsWindowsSetup.ps1'
          $content = [IO.File]::ReadAllText($path)
          $marker = "    if (`$Scope -eq 'Lifecycle') {"
          $matches = [regex]::Matches($content,[regex]::Escape($marker)).Count
          if ($matches -ne 1) { throw "Expected exactly one Lifecycle return marker; found $matches." }
          $block = @'
              if ([Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT) {
                  $gitCommand = @((Get-Command git.exe -CommandType Application -ErrorAction Stop))[0]
                  $gitExe = [string]$gitCommand.Source
                  $targetEolRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-lifecycle-target-eol-' + [guid]::NewGuid().ToString('N'))
                  New-Item -ItemType Directory -Path $targetEolRoot -Force | Out-Null
                  try {
                      Copy-Item -LiteralPath (Join-Path $RepoRoot '.gitattributes') -Destination (Join-Path $targetEolRoot '.gitattributes')
                      foreach ($relative in @('install.ps1','update.ps1','uninstall.ps1')) {
                          $sourcePath = Join-Path $RepoRoot $relative
                          $sourceText = [IO.File]::ReadAllText($sourcePath).Replace("`r`n","`n").Replace("`r","`n")
                          [IO.File]::WriteAllText((Join-Path $targetEolRoot $relative),$sourceText,(New-Object Text.UTF8Encoding($false)))
                      }
                      & $gitExe -C $targetEolRoot init --initial-branch=main 2>$null | Out-Null
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize lifecycle target EOL regression repository.' }
                      & $gitExe -C $targetEolRoot config core.autocrlf true
                      & $gitExe -C $targetEolRoot config user.name 'HMS Regression'
                      & $gitExe -C $targetEolRoot config user.email 'hms-regression@example.invalid'
                      & $gitExe -C $targetEolRoot add -- .gitattributes install.ps1 update.ps1 uninstall.ps1
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to stage lifecycle target EOL regression fixture.' }
                      & $gitExe -C $targetEolRoot commit -m 'fixture' 2>$null | Out-Null
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to commit lifecycle target EOL regression fixture.' }
                      foreach ($relative in @('install.ps1','update.ps1','uninstall.ps1')) {
                          Remove-Item -LiteralPath (Join-Path $targetEolRoot $relative) -Force
                      }
                      & $gitExe -C $targetEolRoot checkout -- install.ps1 update.ps1 uninstall.ps1 2>$null
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to restore lifecycle target EOL regression fixture.' }
                      foreach ($relative in @('install.ps1','update.ps1','uninstall.ps1')) {
                          $expected = ((& $gitExe -C $targetEolRoot rev-parse ('HEAD:' + $relative) 2>$null) -join '').Trim().ToLowerInvariant()
                          $actual = ((& $gitExe -C $targetEolRoot hash-object --no-filters -- $relative 2>$null) -join '').Trim().ToLowerInvariant()
                          if ($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{40}$') { throw "Unable to hash restored authenticated lifecycle target bytes: $relative" }
                          if ($actual -cne $expected) {
                              throw "Authenticated lifecycle target checkout bytes must remain literal under Windows core.autocrlf=true: $relative. Expected $expected, found $actual."
                          }
                      }
                  }
                  finally { Remove-Item -LiteralPath $targetEolRoot -Recurse -Force -ErrorAction SilentlyContinue }
              }
          '@
          $content = $content.Replace($marker,($block.TrimEnd() + "`r`n`r`n" + $marker))
          [IO.File]::WriteAllText($path,$content,(New-Object Text.UTF8Encoding($false)))
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'RED test patch failed git diff --check.' }

      - name: Prove new contract is RED for uninstall target EOL drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'hms-lifecycle-eol-red.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'hms-lifecycle-eol-red.stderr.log'
          $proc = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-File','./scripts/Test-HmsWindowsSetup.ps1','-Scope','Lifecycle') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $combined = ((Get-Content -LiteralPath $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $combined
          if ($proc.ExitCode -eq 0) { throw 'RED lifecycle target EOL contract unexpectedly passed before remediation.' }
          $plain = [regex]::Replace($combined,"`e\[[0-9;?]*[ -/]*[@-~]",'')
          $normalized = ($plain -replace '\s+',' ').Trim()
          if ($normalized -notmatch 'Authenticated lifecycle target checkout bytes must remain literal.*uninstall\.ps1') {
              throw "RED lifecycle target EOL contract failed for an unexpected reason. Normalized output: $normalized"
          }
          Write-Host 'PASS: permanent regression is RED specifically for uninstall.ps1 checkout-byte drift.'

      - name: Publish test-only RED successor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Test-HmsWindowsSetup.ps1
          git commit -m 'test: require literal lifecycle target checkout bytes'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit test-only lifecycle target EOL successor.' }
          git push origin HEAD:refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish test-only lifecycle target EOL successor.' }
