name: Temporary author V11B fresh-review P1 remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-v11b-fresh-review-p1-batch.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      CLEAN_BASELINE: f627df23dfc65b8f4cd8ecb2192c9bfccfdd69f5
      EXPECTED_PARENT: 8b743883cd5fe1326f11ec7856efc9769ce0589d
      V11_SOURCE: .github/workflows/tmp-author-v11-fresh-review-p1-batch.yml
      SELF_PATH: .github/workflows/tmp-author-v11b-fresh-review-p1-batch.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V11B author to exact failed V11 bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:EXPECTED_PARENT){throw "V11B parent mismatch. Expected $env:EXPECTED_PARENT, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V11B bootstrap scope mismatch: $($changed -join ', ')"}
          $baselineParent=((& git rev-parse "$env:EXPECTED_PARENT^")-join '').Trim().ToLowerInvariant()
          if($baselineParent -cne $env:CLEAN_BASELINE){throw "V11B failed-V11 parent chain mismatch. Expected clean baseline $env:CLEAN_BASELINE, found $baselineParent"}

      - name: Extract and execute exact V11 remediation recipe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE $env:V11_SOURCE
          if(-not(Test-Path -LiteralPath $source)){throw "V11 source workflow is missing: $source"}
          $lines=[IO.File]::ReadAllLines($source)
          $stepStart='      - name: Apply exact four-P1 remediation batch'
          $stepEnd='      - name: Create exact local V11 candidate and run full permanent structural suite'
          $start=[Array]::IndexOf($lines,$stepStart)
          $end=[Array]::IndexOf($lines,$stepEnd)
          if($start -lt 0 -or $end -le $start){throw "Could not bind exact V11 remediation step boundaries. start=$start end=$end"}
          $run=-1
          for($i=$start;$i -lt $end;$i++){if($lines[$i] -ceq '        run: |'){$run=$i;break}}
          if($run -lt 0){throw 'V11 remediation run block marker not found.'}
          $body=New-Object System.Collections.Generic.List[string]
          for($i=$run+1;$i -lt $end;$i++){
            $line=[string]$lines[$i]
            if($line.StartsWith('          ')){$body.Add($line.Substring(10))}else{$body.Add($line)}
          }
          $runner=Join-Path $env:RUNNER_TEMP 'v11-extracted-remediation.py'
          [IO.File]::WriteAllText($runner,([string]::Join("`n",$body)+"`n"),(New-Object Text.UTF8Encoding($false)))
          $runnerBytes=[IO.File]::ReadAllBytes($runner)
          $runnerSha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($runnerBytes)).ToLowerInvariant()
          Write-Host "EXTRACTED_V11_RECIPE_SHA256=$runnerSha"
          & python $runner
          if($LASTEXITCODE -ne 0){throw "Extracted V11 remediation recipe failed with exit code $LASTEXITCODE"}

      - name: Create exact local V11B candidate and run full permanent structural suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'install.ps1','update.ps1','scripts/Sync-DeliveryTools.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1','uninstall.ps1',
            'scripts/Test-HmsTrustRemediations.ps1','scripts/Test-HmsOwnedTempCleanup.ps1','scripts/Test-HmsLateTrustBoundaries.ps1'
          )
          $temps=@($env:V11_SOURCE,$env:SELF_PATH)
          foreach($temp in $temps){if(-not(Test-Path -LiteralPath $temp)){throw "Expected temp author file missing before cleanup: $temp"};Remove-Item -LiteralPath $temp -Force}
          $allowed=@($targets+$temps)
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $unexpected=@($changed|Where-Object{$_ -notin $allowed})
          if($unexpected.Count){throw "Unexpected V11B author paths: $($unexpected -join ', ')"}
          foreach($path in $allowed){if($path -notin $changed){throw "Expected V11B path not changed: $path"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V11B.'}
          foreach($path in $targets){
            $tokens=$null;$errs=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errs)|Out-Null
            if(@($errs).Count){throw "Parser rejected $path : $((@($errs)|ForEach-Object Message)-join ' | ')"}
          }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Close fresh-review lifecycle and exact-file cleanup P1s'
          if($LASTEXITCODE -ne 0){throw 'Local V11B candidate commit failed.'}
          $net=@(& git diff --name-only $env:CLEAN_BASELINE HEAD)
          if($net.Count -ne $targets.Count -or @($net|Where-Object{$_ -notin $targets}).Count){throw "V11B net scope mismatch: $($net -join ', ')"}
          Write-Host "LOCAL_CANDIDATE=$(((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant())"
          Write-Host "LOCAL_TREE=$(((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant())"
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}

      - name: Prove lifecycle no longer executes developer validators
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('install.ps1','update.ps1')){
            $text=[IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $path))
            foreach($bad in @('scripts\Test-HmsSkills.ps1','scripts\Test-DeliveryTools.ps1')){if($text-match[regex]::Escape($bad)){throw "$path still executes developer validator: $bad"}}
          }
          Write-Host 'PASS: production install/update have no developer-validator execution boundary.'

      - name: Prepare nine verified GitHub blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'install.ps1','update.ps1','scripts/Sync-DeliveryTools.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1','uninstall.ps1',
            'scripts/Test-HmsTrustRemediations.ps1','scripts/Test-HmsOwnedTempCleanup.ps1','scripts/Test-HmsLateTrustBoundaries.ps1'
          )
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
            $payload=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
            $result=Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/git/blobs" -Headers $headers -Body $payload -ContentType 'application/json'
            $expected=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
            if([string]$result.sha -cne $expected){throw "GitHub blob mismatch for $path. Expected $expected, got $($result.sha)"}
            Write-Host "PREPARED_BLOB $path $expected"
          }
          Write-Host "QUALIFIED_LOCAL_HEAD=$(((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant())"
          Write-Host "QUALIFIED_LOCAL_TREE=$(((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant())"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'
