name: Apply guarded HMS setup bootstrap parser fix

on:
  push:
    branches:
      - stage/hms-superpowers-v0.3.0-windows-setup-menu

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact patch authority SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply one-byte-equivalent guarded parser repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branchRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $expectedBlob = 'a36caa4bfac016eca515d3c11d0e342ad4de7547'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Patch checkout mismatch: $head" }
          $remoteLine = ((& git ls-remote origin $branchRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve canonical patch branch.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "Patch branch moved. Expected $head, found $remoteSha" }

          $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'installer\Invoke-HmsSetupBootstrap.ps1'
          $blob = (& git rev-parse 'HEAD:installer/Invoke-HmsSetupBootstrap.ps1').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $blob -cne $expectedBlob) { throw "Bootstrap blob authority mismatch. Expected $expectedBlob, found $blob" }
          $workingBlob = (& git hash-object -- $bootstrap).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $workingBlob -cne $expectedBlob) { throw "Checked-out bootstrap bytes differ from committed authority blob: $workingBlob" }

          $old = [Text.Encoding]::UTF8.GetBytes("if (-not (Test-HmsPinnedCodexExecutable -Path `$finalExe -ExpectedSha256 ([string]`$Lock.exe_sha256)) { throw 'Pinned Codex fallback failed its executable/version smoke check.' }")
          $new = [Text.Encoding]::UTF8.GetBytes("if (-not (Test-HmsPinnedCodexExecutable -Path `$finalExe -ExpectedSha256 ([string]`$Lock.exe_sha256))) { throw 'Pinned Codex fallback failed its executable/version smoke check.' }")
          $bytes = [IO.File]::ReadAllBytes($bootstrap)
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $oldText = [Text.Encoding]::UTF8.GetString($old)
          $newText = [Text.Encoding]::UTF8.GetString($new)
          $matches = [regex]::Matches($text, [regex]::Escape($oldText)).Count
          if ($matches -ne 1) { throw "Expected exactly one malformed Codex parser expression; found $matches." }
          $patched = $text.Replace($oldText, $newText)
          [IO.File]::WriteAllBytes($bootstrap, [Text.Encoding]::UTF8.GetBytes($patched))

          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($bootstrap, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw "Patched bootstrap still fails PowerShell parser: $($errors[0].Message)" }
          ./scripts/Test-HmsWindowsSetup.ps1 -Scope Bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Permanent bootstrap regression test failed after parser repair.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after parser repair.' }
          $changed = @(& git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -cne 'installer/Invoke-HmsSetupBootstrap.ps1') { throw "Parser repair changed unexpected paths: $($changed -join ', ')" }
          $diff = (& git diff --unified=0 -- installer/Invoke-HmsSetupBootstrap.ps1) -join "`n"
          if ($diff -notmatch [regex]::Escape("exe_sha256))) {")) { throw 'Expected closing-parenthesis repair is absent from diff.' }
          Write-Host 'PASS: exact bootstrap blob received the single parser repair and permanent regression test is green.'

      - name: Commit guarded parser repair to successor branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $branchRef = 'refs/heads/' + $branch
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $remoteLine = ((& git ls-remote origin $branchRef) -join "`n").Trim()
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $remoteSha -cne $head) { throw "Successor branch moved before parser repair push. Expected $head, found $remoteSha" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- installer/Invoke-HmsSetupBootstrap.ps1
          git commit -m 'fix: close setup bootstrap Codex parser expression'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit guarded bootstrap parser repair.' }
          $newHead = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          git push origin ("HEAD:refs/heads/" + $branch)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fast-forward successor branch with parser repair.' }
          $after = (((& git ls-remote origin $branchRef) -join "`n").Trim() -split '\s+')[0].ToLowerInvariant()
          if ($after -cne $newHead) { throw "Remote successor branch did not land on parser repair commit. Expected $newHead, found $after" }
          Write-Host "PASS: guarded parser repair published as $newHead"
