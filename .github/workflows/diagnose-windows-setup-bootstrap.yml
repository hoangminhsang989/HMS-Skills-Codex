name: Diagnose HMS setup bootstrap runtime failure

on:
  push:
    branches:
      - stage/hms-superpowers-v0.3.0-windows-setup-menu

permissions:
  contents: read

jobs:
  diagnose-bootstrap-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact identity and generate candidate authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Diagnostic checkout mismatch: $head" }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw "Diagnostic tree capture failed: $tree" }
          $sourceRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $remoteLine = ((& git ls-remote origin $sourceRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve diagnostic source ref.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "Diagnostic source ref moved. Expected $head, found $remoteSha" }
          $generated = Join-Path $env:RUNNER_TEMP 'hms-bootstrap-runtime-diagnostic'
          New-Item -ItemType Directory -Path $generated | Out-Null
          $authorityPath = Join-Path $generated 'setup-authority.json'
          $authority = [ordered]@{
            schema_version = 1
            product_version = '0.3.0'
            mode = 'candidate'
            repository = 'https://github.com/hoangminhsang989/HMS-Skills-Codex.git'
            source_ref = $sourceRef
            commit = $head
            tree = $tree
            release_tag = $null
          }
          [IO.File]::WriteAllText($authorityPath, ($authority | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding($false)))
          "AUTHORITY_PATH=$authorityPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PASS: runtime diagnostic authority HEAD=$head TREE=$tree"

      - name: Execute committed bootstrap and expose exact runtime failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsPowerShell = Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell\v1.0\powershell.exe'
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'installer\Invoke-HmsSetupBootstrap.ps1'
          $toolsLock = Join-Path $env:GITHUB_WORKSPACE 'installer\setup-tools.lock.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'hms-bootstrap.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'hms-bootstrap.stderr.log'
          $arguments = @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',('"' + $bootstrap + '"'),
            '-AuthorityPath',('"' + $env:AUTHORITY_PATH + '"'),
            '-ToolsLockPath',('"' + $toolsLock + '"'),
            '-Mode','Install'
          )
          $proc = Start-Process -FilePath $windowsPowerShell -ArgumentList $arguments -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Write-Host "BOOTSTRAP_EXIT=$($proc.ExitCode)"
          Write-Host '=== BOOTSTRAP STDOUT ==='
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Raw | Write-Host }
          Write-Host '=== BOOTSTRAP STDERR ==='
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw | Write-Host }
          if ($proc.ExitCode -eq 0) { throw 'Runtime diagnostic expected the reproduced bootstrap failure, but bootstrap succeeded.' }
          throw "Runtime diagnostic captured bootstrap exit $($proc.ExitCode); inspect stderr above for root cause."
