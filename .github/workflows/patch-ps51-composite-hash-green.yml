name: Patch PS5.1 composite hash GREEN

on:
  push:
    paths:
      - '.github/workflows/patch-ps51-composite-hash-green.yml'

permissions:
  contents: write

jobs:
  patch-ps51-composite-hash-green:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Prove exact guarded inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Workflow checkout mismatch: $head" }
          $sourceRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $remoteLine = ((& git ls-remote origin $sourceRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve guarded source ref.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "Guarded source ref moved. Expected $head, found $remoteSha" }
          $status = ((& git status --porcelain=v1 --untracked-files=all) -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($status)) { throw "Workflow checkout is not clean: $status" }

          $implBlob = ((& git rev-parse 'HEAD:scripts/Build-HmsCompositeSkill.impl.ps1') -join '').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $implBlob -cne '4225e2ddef2795edb9f7e1b1319c1804e0e0112a') { throw "Composite implementation blob changed. Expected 4225e2ddef2795edb9f7e1b1319c1804e0e0112a, found $implBlob" }
          $testBlob = ((& git rev-parse 'HEAD:scripts/Test-HmsWindowsSetup.ps1') -join '').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $testBlob -cne '444d2a4c5e0b8d7d120599529f377cc7c94df188') { throw "Permanent RED test blob changed. Expected 444d2a4c5e0b8d7d120599529f377cc7c94df188, found $testBlob" }

      - name: Apply minimal pure-dotnet SHA-256 remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\Build-HmsCompositeSkill.impl.ps1'
          $source = [IO.File]::ReadAllText($path)
          if ($source -match '\bGet-HmsCompositeFileSha256\b') { throw 'Composite SHA-256 helper already exists; refusing non-unique patch.' }
          $oldHash = '        $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()'
          $oldCount = [regex]::Matches($source,[regex]::Escape($oldHash)).Count
          if ($oldCount -ne 1) { throw "Expected exactly one Get-FileHash composite callsite, found $oldCount." }
          $allGetFileHash = [regex]::Matches($source,'(?i)\bGet-FileHash\b').Count
          if ($allGetFileHash -ne 1) { throw "Expected exactly one Get-FileHash token in composite implementation, found $allGetFileHash." }
          $anchor = 'function Add-OwnedCompositeTreeRecords {'
          $anchorCount = [regex]::Matches($source,[regex]::Escape($anchor)).Count
          if ($anchorCount -ne 1) { throw "Expected exactly one composite tree-record function anchor, found $anchorCount." }
          $helper = @'
          function Get-HmsCompositeFileSha256 {
              param([Parameter(Mandatory)][string]$Path)
              $stream = New-Object IO.FileStream($Path,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
              $sha = [Security.Cryptography.SHA256]::Create()
              try {
                  return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','').ToLowerInvariant()
              }
              finally {
                  $sha.Dispose()
                  $stream.Dispose()
              }
          }

          '@
          $helper = ($helper -replace '(?m)^          ','')
          $source = $source.Replace($anchor,($helper + $anchor))
          $source = $source.Replace($oldHash,'        $hash = Get-HmsCompositeFileSha256 -Path $item.FullName')
          [IO.File]::WriteAllText($path,$source,(New-Object Text.UTF8Encoding($false)))

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) { throw "Patched composite implementation does not parse: $($errors[0].Message)" }
          $updated = [IO.File]::ReadAllText($path)
          if ([regex]::Matches($updated,'(?i)\bGet-FileHash\b').Count -ne 0) { throw 'Patched composite implementation still contains Get-FileHash.' }
          if ([regex]::Matches($updated,'\bGet-HmsCompositeFileSha256\b').Count -ne 2) { throw 'Patched composite implementation does not contain exactly one helper definition and one callsite.' }

      - name: Verify permanent RED turns GREEN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-HmsWindowsSetup.ps1 -Scope Bootstrap
          Write-Host 'PASS: PS5.1 composite hashing regression is GREEN.'

      - name: Run full HMS qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-HmsSkills.ps1
          Write-Host 'PASS: full HMS qualification is GREEN after composite hashing remediation.'

      - name: Prove exact one-file production scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Composite hashing remediation failed git diff --check.' }
          $changed = @(& git diff --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate remediation scope.' }
          if ($changed.Count -ne 1 -or $changed[0] -cne 'scripts/Build-HmsCompositeSkill.impl.ps1') {
            throw "Unexpected production remediation scope: $($changed -join ', ')"
          }
          $diff = (& git diff -- scripts/Build-HmsCompositeSkill.impl.ps1) -join "`n"
          if ($diff -notmatch 'Get-HmsCompositeFileSha256' -or $diff -notmatch 'Get-FileHash') { throw 'Expected composite hash helper/callsite diff is missing.' }
          Write-Host 'PASS: remediation scope is exactly one production file.'

      - name: Publish GREEN production successor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Build-HmsCompositeSkill.impl.ps1
          git commit -m 'fix: make composite hashing PS5.1-safe'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit PS5.1 composite hashing remediation.' }
          git push origin HEAD:refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish PS5.1 composite hashing remediation.' }
