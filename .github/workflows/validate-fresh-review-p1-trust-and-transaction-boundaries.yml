name: Invoke review 486 P1 remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'chore: invoke registered review 486 P1 remediation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stage/hms-superpowers-v0.2.0-ui-design-authority
          fetch-depth: 0
      - name: Execute staged exact remediation script
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\remediate-review-486-p1.yml'
          $lines = [IO.File]::ReadAllLines($source)
          $marker = -1
          for($i=0;$i -lt $lines.Length;$i++) { if($lines[$i].Trim() -ceq 'run: |') { $marker=$i; break } }
          if($marker -lt 0) { throw 'Staged remediation workflow has no run block.' }
          $body = New-Object System.Collections.Generic.List[string]
          for($i=$marker+1;$i -lt $lines.Length;$i++) {
            $line=$lines[$i]
            if($line.Length -ge 10 -and $line.Substring(0,10) -ceq '          ') { $body.Add($line.Substring(10)) }
            elseif([string]::IsNullOrWhiteSpace($line)) { $body.Add('') }
            else { throw "Unexpected staged remediation indentation at line $($i+1)." }
          }
          $script = Join-Path $env:RUNNER_TEMP 'apply-review-486-p1.ps1'
          [IO.File]::WriteAllLines($script,$body,(New-Object Text.UTF8Encoding($false)))
          & $script
