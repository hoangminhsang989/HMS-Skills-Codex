name: Harden CodeGraph rollback manifest ordering

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Patch rollback ordering and push
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $message=((& git log -1 --format=%s)-join '').Trim()
          if($message -cne 'chore: harden CodeGraph rollback manifest ordering'){ Write-Host "No remediation action for $message"; exit 0 }
          @'
          from pathlib import Path
          p=Path('scripts/Sync-DeliveryTools.ps1')
          s=p.read_text(encoding='utf-8')
          old="""                try {
                    if ($manifestPublished) { Restore-CodeGraphManifestAfterFailure -CandidateManifest $publishedManifest -PreviousBytes $existingManifestBytes -HadPrevious $wasInstalled }
                }
                catch { $rollbackErrors += $_.Exception.Message }
"""
          new="""                try {
                    if ($rollbackErrors.Count -eq 0 -and $manifestPublished) {
                        Restore-CodeGraphManifestAfterFailure -CandidateManifest $publishedManifest -PreviousBytes $existingManifestBytes -HadPrevious $wasInstalled
                    }
                }
                catch { $rollbackErrors += $_.Exception.Message }
"""
          if s.count(old)!=1: raise SystemExit(f'rollback manifest ordering: expected 1 block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'rollback ordering patch failed'}
          $t=$null;$e=$null;[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'),[ref]$t,[ref]$e)|Out-Null
          if(@($e).Count){throw "Parser rejected Sync-DeliveryTools.ps1: $((@($e)|ForEach-Object Message)-join ' | ')"}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed'}
          git config user.name 'HMS Remediation Bot'
          git config user.email 'hms-remediation@users.noreply.github.com'
          git add scripts/Sync-DeliveryTools.ps1
          git commit -m 'fix: restore CodeGraph manifest only after bundle rollback'
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
          if($LASTEXITCODE -ne 0){throw 'push failed'}
