name: Invoke review 486 P1 remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Execute staged exact remediation script
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $message = ((& git log -1 --format=%s) -join '').Trim()
          if($message -cne 'chore: invoke registered review 486 P1 remediation v6') {
            Write-Host "No remediation action for head message: $message"
            exit 0
          }
          $source = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\remediate-review-486-p1.yml'
          $lines = [IO.File]::ReadAllLines($source)
          $marker = -1
          for($i=0;$i -lt $lines.Length;$i++) { if($lines[$i].Trim() -ceq 'run: |') { $marker=$i; break } }
          if($marker -lt 0) { throw 'Staged remediation workflow has no run block.' }
          $body = New-Object System.Collections.Generic.List[string]
          for($i=$marker+1;$i -lt $lines.Length;$i++) {
            $line=$lines[$i]
            if($line.Length -ge 10 -and $line.Substring(0,10) -ceq '          ') { $body.Add($line.Substring(10)) }
            else { $body.Add($line) }
          }
          $oldPatch = "sync=replace_once(sync,old_remove,new_remove,'CodeGraph destructive helper block')"
          $newPatch = "start=sync.index('function Remove-CodeGraphTransactionBundle {'); end=sync.index(chr(10)+'function Assert-CodeGraphBundleAgainstManifest',start); sync=sync[:start]+new_remove+sync[end+1:]"
          $patchIndex = $body.IndexOf($oldPatch)
          if($patchIndex -lt 0) { throw 'Could not locate staged CodeGraph whole-function replacement.' }
          $body[$patchIndex] = $newPatch

          $manifestPatch = "sync=replace_once(sync,old_manifest,new_manifest,'atomic manifest publication')"
          $manifestReplacement = "start=sync.index('                `$manifest = [ordered]@{'); end=sync.index('                if (`$null -ne `$backup -and (Test-Path -LiteralPath `$backup)) {',start); sync=sync[:start]+new_manifest+sync[end:]"
          $manifestIndex = $body.IndexOf($manifestPatch)
          if($manifestIndex -lt 0) { throw 'Could not locate staged manifest publication replacement.' }
          $body[$manifestIndex] = $manifestReplacement

          $pythonEnd = $body.IndexOf("'@ | python -")
          if($pythonEnd -lt 0) { throw 'Could not locate staged Python patch invocation.' }
          $body.Insert($pythonEnd+1,"if(`$LASTEXITCODE -ne 0){throw 'Python remediation patch failed'}")
          $script = Join-Path $env:RUNNER_TEMP 'apply-review-486-p1.ps1'
          [IO.File]::WriteAllLines($script,$body,(New-Object Text.UTF8Encoding($false)))
          & $script
