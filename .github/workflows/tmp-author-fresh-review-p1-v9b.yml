name: Temporary author fresh review P1 remediation V9B

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-fresh-review-p1-v9b.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BASELINE_PARENT: 2dd454f10bd7503045b2aec3ad4656d733464782
      V9_BOOTSTRAP: c66dfcdbefbf3f83658a3ce234b82bd582e30915
      V9_PATH: .github/workflows/tmp-author-fresh-review-p1-v9.yml
      SELF_PATH: .github/workflows/tmp-author-fresh-review-p1-v9b.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V9B to exact V9 bootstrap authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:V9_BOOTSTRAP){throw "V9B parent mismatch. Expected $env:V9_BOOTSTRAP, found $parent"}
          $v9Parent=((& git rev-parse "$env:V9_BOOTSTRAP^")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $v9Parent -cne $env:BASELINE_PARENT){throw "V9 bootstrap parent drifted. Expected $env:BASELINE_PARENT, found $v9Parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V9B bootstrap scope mismatch: $($changed -join ', ')"}

      - name: Replay immutable V9 patch recipe and normalize permanent regression step
        shell: python
        run: |
          import os
          from pathlib import Path
          v9=Path(os.environ['V9_PATH'])
          text=v9.read_text(encoding='utf-8')
          marker="      - name: Apply exact four-file fresh-review P1 remediation\n        shell: python\n        run: |\n"
          start=text.find(marker)
          if start < 0: raise SystemExit('V9B could not locate committed V9 remediation block.')
          raw=text[start+len(marker):]
          code=[]
          for line in raw.splitlines():
              if line.startswith('          '): code.append(line[10:])
              elif line == '': code.append('')
              else: raise SystemExit(f'Unexpected V9 remediation indentation: {line!r}')
          exec(compile('\n'.join(code)+'\n',str(v9)+'::remediation','exec'),{'__name__':'__main__'})

          workflow=Path('.github/workflows/validate-p1-trust-boundaries.yml')
          w=workflow.read_text(encoding='utf-8')
          bad='                - name: Qualify fresh-review V9 exact-object activation boundaries\n'
          pos=w.find(bad)
          if pos < 0: raise SystemExit('V9B could not locate V9 permanent regression step for indentation normalization.')
          prefix=w[:pos]
          block=w[pos:]
          fixed=[]
          for line in block.splitlines():
              if line:
                  if not line.startswith('          '): raise SystemExit(f'Unexpected V9 regression indentation: {line!r}')
                  fixed.append(line[10:])
              else: fixed.append('')
          w=prefix+'\n'.join(fixed)+'\n'
          workflow.write_text(w,encoding='utf-8',newline='\n')

          step='      - name: Qualify fresh-review V9 exact-object activation boundaries\n'
          s=w.find(step)
          if s < 0: raise SystemExit('Normalized V9 regression step is missing.')
          run=w.find('        run: |\n',s)
          if run < 0: raise SystemExit('Normalized V9 regression run block is missing.')
          body=w[run+len('        run: |\n'):]
          script=[]
          for line in body.splitlines():
              if line:
                  if not line.startswith('          '): raise SystemExit(f'V9 focused script escaped run indentation: {line!r}')
                  script.append(line[10:])
              else: script.append('')
          out=Path(os.environ['RUNNER_TEMP'])/'v9-focused.ps1'
          out.write_text('\n'.join(script)+'\n',encoding='utf-8',newline='\n')

      - name: Create exact local V9B candidate and run structural qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'scripts/Build-HmsCompositeSkill.impl.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            'manager/HmsModelSettings.utf8.ps1',
            '.github/workflows/validate-p1-trust-boundaries.yml'
          )
          $temps=@($env:V9_PATH,$env:SELF_PATH)
          foreach($path in $temps){Remove-Item -LiteralPath $path -Force}
          $allowed=@($targets+$temps)
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $unexpected=@($changed|Where-Object {$_ -notin $allowed})
          if($unexpected.Count){throw "Unexpected V9B paths: $($unexpected -join ', ')"}
          foreach($path in $allowed){if($path -notin $changed){throw "Expected V9B path not changed: $path"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V9B.'}
          foreach($path in $targets|Where-Object{$_.EndsWith('.ps1')}){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count){throw "PowerShell parser rejected $path : $((@($errors)|ForEach-Object Message)-join ' | ')"}
          }
          $yaml=[IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\workflows\validate-p1-trust-boundaries.yml'))
          if($yaml -notmatch [regex]::Escape('      - name: Qualify fresh-review V9 exact-object activation boundaries')){throw 'Permanent V9 regression step is not a sibling workflow step.'}
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Close fresh review exact-object P1 boundaries V9B'
          if($LASTEXITCODE -ne 0){throw 'Local V9B candidate commit failed.'}
          $net=@(& git diff --name-only $env:BASELINE_PARENT HEAD)
          if($net.Count -ne 4 -or @($net|Where-Object{$_ -notin $targets}).Count){throw "V9B net scope mismatch: $($net -join ', ')"}
          $localHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $localTree=((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant()
          Write-Host "LOCAL_CANDIDATE=$localHead"
          Write-Host "LOCAL_TREE=$localTree"
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}

      - name: Run focused V9 fresh-review P1 qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & (Join-Path $env:RUNNER_TEMP 'v9-focused.ps1')
          if($LASTEXITCODE -ne 0){throw "V9 focused qualification failed with exit code $LASTEXITCODE"}

      - name: Prepare four verified GitHub blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'scripts/Build-HmsCompositeSkill.impl.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            'manager/HmsModelSettings.utf8.ps1',
            '.github/workflows/validate-p1-trust-boundaries.yml'
          )
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
            $body=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
            $blob=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/blobs" -Body $body -ContentType 'application/json'
            $localBlob=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
            if(-not $blob.sha -or $localBlob -cne ([string]$blob.sha).ToLowerInvariant()){throw "GitHub blob identity mismatch for $path"}
            Write-Host "PREPARED_BLOB $path $($blob.sha)"
          }
          $qualifiedHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $qualifiedTree=((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant()
          Write-Host "QUALIFIED_LOCAL_HEAD=$qualifiedHead"
          Write-Host "QUALIFIED_LOCAL_TREE=$qualifiedTree"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'
