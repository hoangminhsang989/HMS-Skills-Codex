name: Author permanent gate compatibility fix

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/author-permanent-gate-compatibility-fix.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact authoring head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact-blob permanent gate compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          payload=''
          exec(compile(base64.b64decode(payload),'<gate-patch>','exec'))
          PY
          git diff --check
          git config user.name 'HMS exact-blob remediation'
          git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          git add -- .github/workflows/validate-p1-trust-boundaries.yml .github/workflows/validate-review-486-latest-p1.yml .github/workflows/validate-review-5dbd-latest-p1.yml .github/workflows/validate-fresh-review-destructive-boundaries.yml
          git commit -m 'Align permanent gates with exact-tree trust contract'
          git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
