name: Diagnose HMS composite wrapper liveness

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-wrapper-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Qualify exact-HEAD archive transport inside Start-Job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSha = $env:CANDIDATE_SHA.ToLowerInvariant()
          $actualSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $expectedSha) {
            throw "Workflow checkout identity mismatch. Expected $expectedSha, found $actualSha"
          }

          $pathSpec = 'scripts/Build-HmsCompositeSkill.impl.ps1'
          $blob = (& git -C $env:GITHUB_WORKSPACE rev-parse "$expectedSha`:$pathSpec").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $blob -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve implementation blob.' }
          $gitExe = [string](Get-Command git -ErrorAction Stop).Source
          $tempRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-archive-transport-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          $archivePath = Join-Path $tempRoot 'support.zip'
          $destination = Join-Path $tempRoot 'implementation.ps1'

          $job = $null
          try {
            $job = Start-Job -ScriptBlock {
              param($GitExe,$RepoRoot,$Head,$PathSpec,$ArchivePath,$Destination)
              $ErrorActionPreference = 'Stop'
              Write-Output "HMS_ARCHIVE_START pid=$PID utc=$([DateTime]::UtcNow.ToString('o'))"
              & $GitExe -C $RepoRoot archive --format=zip "--output=$ArchivePath" $Head -- $PathSpec
              if ($LASTEXITCODE -ne 0) { throw "git archive failed with exit code $LASTEXITCODE" }

              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $archive = [System.IO.Compression.ZipFile]::OpenRead($ArchivePath)
              try {
                $matches = @($archive.Entries | Where-Object { $_.FullName -ceq $PathSpec })
                if ($matches.Count -ne 1) { throw "Expected exactly one archive entry '$PathSpec', found $($matches.Count)." }
                $input = $matches[0].Open()
                $output = New-Object System.IO.FileStream($Destination,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                try { $input.CopyTo($output); $output.Flush() }
                finally { $output.Dispose(); $input.Dispose() }
              }
              finally { $archive.Dispose() }
              Write-Output "HMS_ARCHIVE_RETURN pid=$PID utc=$([DateTime]::UtcNow.ToString('o'))"
            } -ArgumentList $gitExe,$env:GITHUB_WORKSPACE,$expectedSha,$pathSpec,$archivePath,$destination

            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while ([DateTime]::UtcNow -lt $deadline -and $job.State -notin @('Completed','Failed','Stopped')) {
              Receive-Job -Job $job -ErrorAction Stop | Write-Host
              Start-Sleep -Milliseconds 100
            }
            Receive-Job -Job $job -ErrorAction Stop | Write-Host
            if ($job.State -ne 'Completed') { throw "Exact-HEAD archive transport did not complete within 15s. State=$($job.State)" }

            $actualBlob = (& git -C $env:GITHUB_WORKSPACE hash-object --no-filters -- $destination).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $blob) {
              throw "Archive transport literal-byte mismatch. Expected $blob, found $actualBlob"
            }
            Write-Host "PASS: exact-HEAD archive transport completed inside Start-Job and preserved literal blob $blob."
          }
          finally {
            if ($null -ne $job) { Remove-Job -Job $job -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $tempRoot) { Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue }
          }
