name: Diagnose HMS composite wrapper liveness

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-wrapper-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Prove exact transport and remediated public wrapper liveness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSha = $env:CANDIDATE_SHA.ToLowerInvariant()
          $actualSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $expectedSha) {
            throw "Workflow checkout identity mismatch. Expected $expectedSha, found $actualSha"
          }

          function Drain-JobsUntilTerminal {
            param(
              [Parameter(Mandatory)][object[]]$Jobs,
              [Parameter(Mandatory)][string]$Label,
              [Parameter(Mandatory)][int]$TimeoutSeconds
            )
            $deadline = [DateTime]::UtcNow.AddSeconds($TimeoutSeconds)
            while ([DateTime]::UtcNow -lt $deadline) {
              foreach ($job in $Jobs) { Receive-Job -Job $job -ErrorAction Stop | Write-Host }
              if (@($Jobs | Where-Object { $_.State -notin @('Completed','Failed','Stopped') }).Count -eq 0) { break }
              Start-Sleep -Milliseconds 200
            }
            foreach ($job in $Jobs) { Receive-Job -Job $job -ErrorAction Stop | Write-Host }
            $nonCompleted = @($Jobs | Where-Object { $_.State -ne 'Completed' })
            if ($nonCompleted.Count -ne 0) {
              $states = (($Jobs | ForEach-Object { "Id=$($_.Id):$($_.State)" }) -join ', ')
              throw "$Label did not complete within ${TimeoutSeconds}s. $states"
            }
            Write-Host "PASS: $Label completed within ${TimeoutSeconds}s."
          }

          function Remove-TestJobs {
            param([object[]]$Jobs)
            foreach ($job in @($Jobs)) { Remove-Job -Job $job -Force -ErrorAction SilentlyContinue }
          }

          # First retain the independently-qualified transport proof used by the production bootstrap.
          $pathSpec = 'scripts/Build-HmsCompositeSkill.impl.ps1'
          $blob = (& git -C $env:GITHUB_WORKSPACE rev-parse "$expectedSha`:$pathSpec").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $blob -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve implementation blob.' }
          $gitExe = [string](Get-Command git -ErrorAction Stop).Source
          $transportRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-archive-transport-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $transportRoot | Out-Null
          $archivePath = Join-Path $transportRoot 'support.zip'
          $destination = Join-Path $transportRoot 'implementation.ps1'
          $transportJob = $null
          try {
            $transportJob = Start-Job -ScriptBlock {
              param($GitExe,$RepoRoot,$Head,$PathSpec,$ArchivePath,$Destination)
              $ErrorActionPreference = 'Stop'
              Write-Output "HMS_ARCHIVE_START pid=$PID utc=$([DateTime]::UtcNow.ToString('o'))"
              & $GitExe -C $RepoRoot -c core.autocrlf=false -c core.eol=lf archive --format=zip "--output=$ArchivePath" $Head -- $PathSpec
              if ($LASTEXITCODE -ne 0) { throw "git archive failed with exit code $LASTEXITCODE" }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $archive = [System.IO.Compression.ZipFile]::OpenRead($ArchivePath)
              try {
                $matches = @($archive.Entries | Where-Object { $_.FullName -ceq $PathSpec })
                if ($matches.Count -ne 1) { throw "Expected exactly one archive entry '$PathSpec', found $($matches.Count)." }
                $input = $matches[0].Open()
                $output = New-Object System.IO.FileStream($Destination,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                try { $input.CopyTo($output); $output.Flush() }
                finally { $output.Dispose(); $input.Dispose() }
              }
              finally { $archive.Dispose() }
              Write-Output "HMS_ARCHIVE_RETURN pid=$PID utc=$([DateTime]::UtcNow.ToString('o'))"
            } -ArgumentList $gitExe,$env:GITHUB_WORKSPACE,$expectedSha,$pathSpec,$archivePath,$destination
            Drain-JobsUntilTerminal -Jobs @($transportJob) -Label 'no-EOL exact-HEAD archive transport' -TimeoutSeconds 15
            $actualBlob = (& git -C $env:GITHUB_WORKSPACE hash-object --no-filters -- $destination).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $blob) {
              throw "Archive transport literal-byte mismatch. Expected $blob, found $actualBlob"
            }
            Write-Host "PASS: no-EOL exact-HEAD archive transport preserved literal blob $blob."
          }
          finally {
            if ($null -ne $transportJob) { Remove-TestJobs -Jobs @($transportJob) }
            if (Test-Path -LiteralPath $transportRoot) { Remove-Item -LiteralPath $transportRoot -Recurse -Force -ErrorAction SilentlyContinue }
          }

          # Then execute the actual remediated production public wrapper concurrently.
          $builderPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\Build-HmsCompositeSkill.ps1'
          $wrapperJobScript = {
            param($Builder,$Install,$Output,$Skills,$Label)
            $ErrorActionPreference = 'Stop'
            Write-Output "HMS_WRAPPER_JOB_START label=$Label pid=$PID utc=$([DateTime]::UtcNow.ToString('o'))"
            & $Builder `
              -InstallRoot $Install `
              -OutputRoot $Output `
              -SkillsRoot $Skills `
              -Hms $false `
              -Superpowers $false `
              -Taste $false `
              -Impeccable $false
            Write-Output "HMS_WRAPPER_JOB_RETURN label=$Label pid=$PID utc=$([DateTime]::UtcNow.ToString('o'))"
          }

          $tempRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-wrapper-runtime-' + [guid]::NewGuid().ToString('N'))
          try {
            $distinctJobs = @()
            try {
              $distinctJobs += Start-Job -ScriptBlock $wrapperJobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,(Join-Path $tempRoot 'distinct-a-output'),(Join-Path $tempRoot 'distinct-a-skills'),'wrapper-distinct-a'
              $distinctJobs += Start-Job -ScriptBlock $wrapperJobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,(Join-Path $tempRoot 'distinct-b-output'),(Join-Path $tempRoot 'distinct-b-skills'),'wrapper-distinct-b'
              Drain-JobsUntilTerminal -Jobs $distinctJobs -Label 'two-process remediated public wrapper distinct-target OFF/OFF build' -TimeoutSeconds 60
            }
            finally { Remove-TestJobs -Jobs $distinctJobs }

            $sharedOutput = Join-Path $tempRoot 'shared-output'
            $sharedSkills = Join-Path $tempRoot 'shared-skills'
            $sharedJobs = @()
            try {
              $sharedJobs += Start-Job -ScriptBlock $wrapperJobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,$sharedOutput,$sharedSkills,'wrapper-shared-a'
              $sharedJobs += Start-Job -ScriptBlock $wrapperJobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,$sharedOutput,$sharedSkills,'wrapper-shared-b'
              Drain-JobsUntilTerminal -Jobs $sharedJobs -Label 'two-process remediated public wrapper shared-target OFF/OFF build' -TimeoutSeconds 60
            }
            finally { Remove-TestJobs -Jobs $sharedJobs }

            Write-Host 'PASS: remediated production public wrapper satisfies bounded distinct-target and shared-target Windows liveness.'
          }
          finally {
            if (Test-Path -LiteralPath $tempRoot) { Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue }
          }
