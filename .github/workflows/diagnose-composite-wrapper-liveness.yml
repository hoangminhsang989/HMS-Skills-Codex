name: Diagnose HMS composite wrapper liveness

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-wrapper-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Qualify git show exact blob materialization inside Start-Job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSha = $env:CANDIDATE_SHA.ToLowerInvariant()
          $actualSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $expectedSha) {
            throw "Workflow checkout identity mismatch. Expected $expectedSha, found $actualSha"
          }

          $blob = (& git -C $env:GITHUB_WORKSPACE rev-parse "$expectedSha`:scripts/Build-HmsCompositeSkill.impl.ps1").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $blob -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve implementation blob.' }
          $gitExe = [string](Get-Command git -ErrorAction Stop).Source
          $tempRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-blob-show-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          $destination = Join-Path $tempRoot 'implementation.ps1'
          $stderrPath = Join-Path $tempRoot 'git.stderr.txt'

          $job = $null
          try {
            $job = Start-Job -ScriptBlock {
              param($GitExe,$RepoRoot,$Blob,$Destination,$StderrPath)
              $ErrorActionPreference = 'Stop'
              Write-Output "HMS_BLOB_SHOW_START pid=$PID blob=$Blob utc=$([DateTime]::UtcNow.ToString('o'))"
              $process = Start-Process -FilePath $GitExe `
                -ArgumentList @('show',$Blob) `
                -WorkingDirectory $RepoRoot `
                -NoNewWindow `
                -Wait `
                -PassThru `
                -RedirectStandardOutput $Destination `
                -RedirectStandardError $StderrPath
              if ($process.ExitCode -ne 0) {
                $stderr = if (Test-Path -LiteralPath $StderrPath) { Get-Content -LiteralPath $StderrPath -Raw } else { '' }
                throw "git show failed with exit code $($process.ExitCode): $stderr"
              }
              Write-Output "HMS_BLOB_SHOW_RETURN pid=$PID blob=$Blob utc=$([DateTime]::UtcNow.ToString('o'))"
            } -ArgumentList $gitExe,$env:GITHUB_WORKSPACE,$blob,$destination,$stderrPath

            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while ([DateTime]::UtcNow -lt $deadline -and $job.State -notin @('Completed','Failed','Stopped')) {
              Receive-Job -Job $job -ErrorAction Stop | Write-Host
              Start-Sleep -Milliseconds 100
            }
            Receive-Job -Job $job -ErrorAction Stop | Write-Host
            if ($job.State -ne 'Completed') { throw "git show blob materialization did not complete within 15s. State=$($job.State)" }

            $actualBlob = (& git -C $env:GITHUB_WORKSPACE hash-object --no-filters -- $destination).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $blob) {
              throw "git show materialization mismatch. Expected $blob, found $actualBlob"
            }
            Write-Host "PASS: git show completed inside Start-Job and preserved exact blob $blob."
          }
          finally {
            if ($null -ne $job) { Remove-Job -Job $job -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $tempRoot) { Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue }
          }
