name: Temporary author permanent harness closure sync V4

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-permanent-harness-closure-sync-v4.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BRANCH_NAME: stage/hms-superpowers-v0.2.0-ui-design-authority
      BASELINE_PARENT: 0b228b4572dc6a7ad7b8b55b6f7fb83e8877181b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V4 transport successor to failed author bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:BASELINE_PARENT){throw "V4 transport parent mismatch. Expected $env:BASELINE_PARENT, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne '.github/workflows/tmp-author-permanent-harness-closure-sync-v4.yml'){throw "V4 transport bootstrap scope mismatch: $($changed -join ', ')"}

      - name: Refresh stale permanent harnesses without changing production trust semantics
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8', newline='\n')
          def replace_once(path, old, new, label):
              text=read(path); count=text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              write(path,text.replace(old,new,1))
          def regex_once(path, pattern, replacement, label):
              text=read(path); updated,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
              if count != 1: raise SystemExit(f'{label}: expected exactly one regex anchor, found {count}')
              write(path,updated)

          p1='.github/workflows/validate-p1-trust-boundaries.yml'
          replace_once(p1,"            'Assert-OwnedCompositeRoot -Path $quarantine'\n","            '$assertOwnedCompositeRoot = ${function:Assert-OwnedCompositeRoot}',\n            '$validator={param($p) & $assertOwnedCompositeRoot -Path $p}.GetNewClosure()'\n",'P1 composite closure static contract')
          regex_once(p1,r"          \$tokens=\$null; \$parseErrors=\$null\n          \$ast=\[System\.Management\.Automation\.Language\.Parser\]::ParseFile\(\$uninstallPath,\[ref\]\$tokens,\[ref\]\$parseErrors\)\n          if \(@\(\$parseErrors\)\.Count -ne 0\) \{ throw 'Could not parse uninstall script for function-level destructive-boundary regression\.' \}\n          \$needed = @\('Assert-SafeRemovalPath','Assert-OwnedCompositeRoot','Restore-Quarantine','Remove-VerifiedCompositeRoot'\)\n          \$defs = foreach \(\$name in \$needed\) \{.*?          \$definitionText = \$defs -join \"`r`n`r`n\"\n","          $definitionStart=$uninstallText.IndexOf('$HmsRemote = ')\n          $definitionEnd=$uninstallText.IndexOf('$buildMutex = New-Object System.Threading.Mutex')\n          if($definitionStart -lt 0 -or $definitionEnd -le $definitionStart){throw 'Could not isolate uninstall pre-main production definitions.'}\n          $definitionText=$uninstallText.Substring($definitionStart,$definitionEnd-$definitionStart)\n",'P1 uninstall pre-main definition extraction')
          replace_once(p1,"          `$compositeRoot = Join-Path `$TestHome '.codex\\hms-composite\\hms-superpowers'\n          $definitionText\n","          `$compositeRoot = Join-Path `$TestHome '.codex\\hms-composite\\hms-superpowers'\n          `$InstallRoot = Join-Path `$TestHome '.codex\\hms-skills-codex'\n          $definitionText\n",'P1 uninstall harness InstallRoot binding')

          destructive='.github/workflows/validate-fresh-review-destructive-boundaries.yml'
          replace_once(destructive,"            'Assert-ManagedCodeGraphRoot -Path $quarantine',\n","            '$assertManagedCodeGraphRoot = ${function:Assert-ManagedCodeGraphRoot}',\n            '$validator={param($p) & $assertManagedCodeGraphRoot -Path $p}.GetNewClosure()',\n",'fresh destructive CodeGraph closure static contract')
          replace_once(destructive,"          $codeDefs = Get-FunctionText -Path $uninstallPath -Names @('Assert-SafeRemovalPath','Assert-ManagedCodeGraphRoot','Restore-Quarantine','Remove-VerifiedCodeGraphRoot')\n","          $uninstallDefinitionStart=$uninstallText.IndexOf('$HmsRemote = ')\n          $uninstallDefinitionEnd=$uninstallText.IndexOf('$buildMutex = New-Object System.Threading.Mutex')\n          if($uninstallDefinitionStart -lt 0 -or $uninstallDefinitionEnd -le $uninstallDefinitionStart){throw 'Could not isolate uninstall pre-main production definitions.'}\n          $codeDefs=$uninstallText.Substring($uninstallDefinitionStart,$uninstallDefinitionEnd-$uninstallDefinitionStart)\n",'fresh destructive uninstall pre-main definitions')
          replace_once(destructive,"          `$env:USERPROFILE=`$TestHome\n          $codeDefs\n","          `$env:USERPROFILE=`$TestHome\n          `$InstallRoot=Join-Path `$TestHome '.codex\\hms-skills-codex'\n          $codeDefs\n",'fresh destructive InstallRoot binding')

          review486='.github/workflows/validate-review-486-latest-p1.yml'
          regex_once(review486,r"          \$defs=Get-FunctionText -Path \$delivery -Names @\(\n.*?\n          \)\n","          $deliveryLiteral=$delivery.Replace(\"'\",\"''\")\n          $defs=\". '$deliveryLiteral' -SkipCodeGraph -SkipThreeLevelDelivery\"\n",'review486 exact delivery definition loading')
          replace_once(review486,"            'bundle_tree_sha256'\n","            'bundle_tree_sha256',\n            '$assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}',\n            '$validator={param($p) & $assertCodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()'\n",'review486 closure contract strengthening')

          fresh='.github/workflows/validate-fresh-review-p1-trust-and-transaction-boundaries.yml'
          replace_once(fresh,"          $codeDefs=Get-FunctionText -Path $delivery -Names @('Assert-CodeGraphVersion','Assert-RegularCodeGraphBundle','Assert-CodeGraphTransactionBundle','Remove-CodeGraphTransactionBundle')\n","          $deliveryLiteral=$delivery.Replace(\"'\",\"''\")\n          $codeDefs=\". '$deliveryLiteral' -SkipCodeGraph -SkipThreeLevelDelivery\"\n",'fresh review exact delivery definition loading')
          replace_once(fresh,"            'Repair-CodeGraphRollbackState -CurrentPath $current -BackupPath $backup'\n","            'Repair-CodeGraphRollbackState -CurrentPath $current -BackupPath $backup',\n            '$assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}',\n            '$validator={param($p) & $assertCodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()'\n",'fresh review closure contract strengthening')

          latest='.github/workflows/validate-review-5dbd-latest-p1.yml'
          regex_once(latest,r"          \$deliveryDefs=Get-FunctionText -Path \$delivery -Names @\(\n.*?\n          \)\n","          $deliveryLiteral=$delivery.Replace(\"'\",\"''\")\n          $deliveryDefs=\". '$deliveryLiteral' -SkipCodeGraph -SkipThreeLevelDelivery\"\n",'latest rollback exact delivery definition loading')
          regex_once(latest,r"          \$compositeDefs=Get-FunctionText -Path \$composite -Names @\(\n.*?\n          \)\n","          $compositeDefinitionStart=$compositeText.IndexOf('$CompositeName = ')\n          $compositeDefinitionEnd=$compositeText.IndexOf('$stageId = $null')\n          if($compositeDefinitionStart -lt 0 -or $compositeDefinitionEnd -le $compositeDefinitionStart){throw 'Could not isolate composite pre-main production definitions.'}\n          $compositeDefs=$compositeText.Substring($compositeDefinitionStart,$compositeDefinitionEnd-$compositeDefinitionStart)\n",'latest rollback composite pre-main definitions')
          replace_once(latest,"          $deliveryDefs\n          $compositeDefs\n","          $deliveryDefs\n          `$InstallRoot=`$Root\n          `$OutputRoot=`$Root\n          `$SkillsRoot=`$Root\n          $compositeDefs\n",'latest rollback composite parameter binding')
          replace_once(latest,"            'Repair-CodeGraphRollbackState -CurrentPath $current -BackupPath $backup'\n","            'Repair-CodeGraphRollbackState -CurrentPath $current -BackupPath $backup',\n            '$assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}',\n            '$validator={param($p) & $assertCodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()'\n",'latest rollback closure contract strengthening')

      - name: Verify exact scope and prepare detached remediation commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $self='.github/workflows/tmp-author-permanent-harness-closure-sync-v4.yml'
          Remove-Item -LiteralPath $self -Force
          $targets=@(
            '.github/workflows/validate-p1-trust-boundaries.yml',
            '.github/workflows/validate-review-5dbd-latest-p1.yml',
            '.github/workflows/validate-fresh-review-destructive-boundaries.yml',
            '.github/workflows/validate-review-486-latest-p1.yml',
            '.github/workflows/validate-fresh-review-p1-trust-and-transaction-boundaries.yml'
          )
          $allowed=@($targets + $self)
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $unexpected=@($changed | Where-Object {$_ -notin $allowed})
          if($unexpected.Count -ne 0){throw "Unexpected changed paths: $($unexpected -join ', ')"}
          foreach($path in $allowed){if($path -notin $changed){throw "Expected remediation path was not changed: $path"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected remediation.'}
          foreach($path in $targets){
            $text=[IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $path))
            if($text -match 'Assert-OwnedCompositeRoot -Path \$quarantine' -or $text -match 'Assert-ManagedCodeGraphRoot -Path \$quarantine'){throw "Stale direct-quarantine assertion remains in $path"}
          }
          $remote=((& git ls-remote origin "refs/heads/$env:BRANCH_NAME")-join '').Split("`t")[0].Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $remote -cne $env:GITHUB_SHA.ToLowerInvariant()){throw "Branch drift before detached commit. Expected $env:GITHUB_SHA, found $remote"}

          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          $entries=@()
          foreach($path in $targets){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
            $body=@{content=[Convert]::ToBase64String($bytes);encoding='base64'} | ConvertTo-Json -Compress
            $blob=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/blobs" -Body $body -ContentType 'application/json'
            if(-not $blob.sha){throw "Blob creation failed for $path"}
            $entries += @{path=$path;mode='100644';type='blob';sha=$blob.sha}
            Write-Host "PREPARED_BLOB $path $($blob.sha)"
          }
          $entries += @{path=$self;mode='100644';type='blob';sha=$null}
          $head=Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/git/commits/$env:GITHUB_SHA"
          $treeBody=@{base_tree=$head.tree.sha;tree=$entries} | ConvertTo-Json -Depth 5 -Compress
          $tree=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/trees" -Body $treeBody -ContentType 'application/json'
          if(-not $tree.sha){throw 'Detached tree creation failed.'}
          $commitBody=@{message='Refresh permanent trust harnesses for exact-handle closures';tree=$tree.sha;parents=@($env:GITHUB_SHA)} | ConvertTo-Json -Depth 4 -Compress
          $commit=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/commits" -Body $commitBody -ContentType 'application/json'
          if(-not $commit.sha){throw 'Detached commit creation failed.'}
          Write-Host "PREPARED_TREE=$($tree.sha)"
          Write-Host "PREPARED_COMMIT=$($commit.sha)"
          Write-Host 'DETACHED_ONLY=YES'
