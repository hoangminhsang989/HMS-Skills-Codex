name: Author late rollback identity P1 remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority

permissions:
  contents: write

jobs:
  author:
    runs-on: windows-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch exact production boundaries and run regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $workspace=$env:GITHUB_WORKSPACE
          $expected=$env:GITHUB_SHA.ToLowerInvariant()
          $actual=((& git -C $workspace rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $actual -cne $expected){throw "Author checkout identity mismatch. Expected $expected, found $actual"}

          & python (Join-Path $workspace '.github\author-late-rollback-identity-p1.py')
          if($LASTEXITCODE -ne 0){throw 'Exact rollback identity patcher failed.'}

          foreach($relative in @(
            'scripts\Sync-DeliveryTools.ps1',
            'scripts\Build-HmsCompositeSkill.impl.ps1',
            'scripts\Test-HmsSkills.ps1',
            'scripts\Test-HmsRollbackIdentityHandoff.ps1'
          )){
            $path=Join-Path $workspace $relative
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count -ne 0){throw "PowerShell parser rejected $relative : $((@($errors)|ForEach-Object Message)-join ' | ')"}
          }

          & (Join-Path $workspace 'scripts\Test-HmsRollbackIdentityHandoff.ps1') -RepoRoot $workspace
          if($LASTEXITCODE -ne 0){throw 'Rollback identity handoff regression failed.'}

          & git -C $workspace diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed.'}
          $changed=@(& git -C $workspace diff --name-only)
          $expectedChanged=@(
            'scripts/Build-HmsCompositeSkill.impl.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            'scripts/Test-HmsSkills.ps1'
          )
          if(($changed.Count -ne $expectedChanged.Count) -or (@($changed|Sort-Object) -join "`n") -cne (@($expectedChanged|Sort-Object) -join "`n")){
            throw "Unexpected author diff scope: $($changed -join ', ')"
          }

          git -C $workspace config user.name 'github-actions[bot]'
          git -C $workspace config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $workspace add -- $expectedChanged
          git -C $workspace commit -m 'Remediate late rollback identity handoff P1s'
          if($LASTEXITCODE -ne 0){throw 'Author commit failed.'}
          git -C $workspace push origin "HEAD:$env:GITHUB_REF_NAME"
          if($LASTEXITCODE -ne 0){throw 'Author push failed.'}
