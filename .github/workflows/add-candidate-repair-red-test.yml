name: Add authenticated candidate repair RED test

on:
  push:
    paths:
      - '.github/workflows/add-candidate-repair-red-test.yml'

permissions:
  contents: write

jobs:
  add-red-test:
    runs-on: windows-latest
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact guarded inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Workflow checkout mismatch: $head" }
          $testBlob = (& git rev-parse 'HEAD:scripts/Test-HmsWindowsSetup.ps1').Trim().ToLowerInvariant()
          if ($testBlob -cne '444afae28680bf955992e0c33140832269f89192') { throw "Unexpected Windows setup test blob: $testBlob" }
          $shimBlob = (& git rev-parse 'HEAD:scripts/Invoke-HmsLifecycleAction.ps1').Trim().ToLowerInvariant()
          if ($shimBlob -cne '9906c04176697a4547d68aea43c0e9edf3adbc72') { throw "Unexpected lifecycle shim blob: $shimBlob" }
          $installBlob = (& git rev-parse 'HEAD:install.ps1').Trim().ToLowerInvariant()
          if ($installBlob -cne '9dce5258c472e2fdb9755405fe49601212475bad') { throw "Unexpected install blob: $installBlob" }
          $status = ((& git status --porcelain=v1 --untracked-files=all) -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($status)) { throw "RED test checkout is not clean: $status" }
          Write-Host "PASS: RED inputs HEAD=$head test=$testBlob shim=$shimBlob install=$installBlob"

      - name: Add exact authenticated repair contract test
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/Test-HmsWindowsSetup.ps1')
          text = path.read_text(encoding='utf-8')
          marker = '''    if ($lifecycleShimText -match '(?i)powershell(?:\\.exe)?[^\\r\\n]*-File[^\\r\\n]*(install|update|uninstall)\\.ps1') {
                  throw 'Lifecycle shim must not execute mutable lifecycle scripts through powershell -File.'
              }
          '''
          insertion = '''    if ($lifecycleShimText -match '(?i)powershell(?:\\.exe)?[^\\r\\n]*-File[^\\r\\n]*(install|update|uninstall)\\.ps1') {
                  throw 'Lifecycle shim must not execute mutable lifecycle scripts through powershell -File.'
              }

              $installPath = Join-Path $RepoRoot 'install.ps1'
              $installText = [IO.File]::ReadAllText($installPath)
              $canonicalSyncLiteral = 'Sync-Repository -Remote $HmsRemote -Path $InstallRoot'
              if ([regex]::Matches($installText,[regex]::Escape($canonicalSyncLiteral)).Count -ne 1) {
                  throw 'Direct install.ps1 must retain exactly one canonical HMS synchronization call.'
              }
              Assert-TextContains -Path $installPath -Pattern 'Assert-BranchMatchesFetchedRef' -Message 'Direct install.ps1 must retain canonical fetched-branch equality enforcement.'
              Assert-TextContains -Path $lifecycleShimPath -Pattern 'function\\s+Get-HmsTrustedRepairScriptBlock' -Message 'Lifecycle shim must define authenticated repair-only install transform.'
              Assert-TextContains -Path $lifecycleShimPath -Pattern 'HmsTrustedLifecycleHead' -Message 'Authenticated repair transform must bind the exact trusted lifecycle HEAD.'
              if ([regex]::Matches($lifecycleShimText,[regex]::Escape($canonicalSyncLiteral)).Count -ne 1) {
                  throw 'Authenticated repair transform must target exactly one canonical install synchronization call.'
              }
          '''
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'expected lifecycle insertion marker exactly once, found {count}')
          text = text.replace(marker, insertion, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          print('PASS: added authenticated candidate repair RED contract')

      - name: Prove new contract is RED for the intended missing transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'candidate-repair-red.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'candidate-repair-red.stderr.log'
          $test = Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsWindowsSetup.ps1'
          $proc = Start-Process -FilePath 'pwsh.exe' -ArgumentList @('-NoProfile','-NonInteractive','-File',('"' + $test + '"'),'-Scope','Lifecycle') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $combined = ''
          if (Test-Path -LiteralPath $stdout) { $combined += [IO.File]::ReadAllText($stdout) }
          if (Test-Path -LiteralPath $stderr) { $combined += "`n" + [IO.File]::ReadAllText($stderr) }
          if ($proc.ExitCode -eq 0) { throw 'Authenticated candidate repair contract unexpectedly passed before implementation.' }
          if ($combined -notmatch 'Lifecycle shim must define authenticated repair-only install transform') {
              Write-Host $combined
              throw "RED contract failed for an unexpected reason. Exit=$($proc.ExitCode)"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed for RED test patch.' }
          Write-Host 'PASS: authenticated candidate repair contract is RED for the intended missing transform.'

      - name: Publish test-only RED successor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(& git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -cne 'scripts/Test-HmsWindowsSetup.ps1') { throw "Unexpected RED patch scope: $($changed -join ', ')" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Test-HmsWindowsSetup.ps1
          git commit -m 'test: require authenticated staged-candidate repair handoff'
          git push origin HEAD:refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish authenticated repair RED successor.' }
          Write-Host ("PASS: published test-only RED successor " + (& git rev-parse HEAD).Trim().ToLowerInvariant())
