name: Temporary author V11L fresh-review P1 remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-v11l-fresh-review-p1-batch.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      CLEAN_BASELINE: f627df23dfc65b8f4cd8ecb2192c9bfccfdd69f5
      EXPECTED_PARENT: b98cf7d30ffb1cc7a61393f0f65ca6610d1f3650
      EXPECTED_V11J_BLOB: 7266bb0f7069aaa7e9ee87ab50e769fca82bac22
      EXPECTED_V11K_BLOB: b776d1b56e58b2d7850778ff25bca2469aab6f3a
      V11J_SOURCE: .github/workflows/tmp-author-v11j-fresh-review-p1-batch.yml
      V11K_SOURCE: .github/workflows/tmp-author-v11k-fresh-review-p1-batch.yml
      SELF_PATH: .github/workflows/tmp-author-v11l-fresh-review-p1-batch.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V11L to exact V11K bootstrap and source blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:EXPECTED_PARENT){throw "V11L parent mismatch. Expected $env:EXPECTED_PARENT, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V11L bootstrap scope mismatch: $($changed -join ', ')"}
          & git merge-base --is-ancestor $env:CLEAN_BASELINE HEAD
          if($LASTEXITCODE -ne 0){throw "V11L clean baseline is not an ancestor of HEAD: $env:CLEAN_BASELINE"}
          $v11jBlob=((& git rev-parse "HEAD:$env:V11J_SOURCE")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $v11jBlob -cne $env:EXPECTED_V11J_BLOB){throw "V11L V11J source blob mismatch. Expected $env:EXPECTED_V11J_BLOB, found $v11jBlob"}
          $v11kBlob=((& git rev-parse "HEAD:$env:V11K_SOURCE")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $v11kBlob -cne $env:EXPECTED_V11K_BLOB){throw "V11L V11K source blob mismatch. Expected $env:EXPECTED_V11K_BLOB, found $v11kBlob"}
          Write-Host 'V11L_BINDING=PASS_EXACT_PARENT_SELF_ONLY_SOURCE_BLOBS'

      - name: Replay exact V11J remediation steps
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sourcePath=Join-Path $env:GITHUB_WORKSPACE $env:V11J_SOURCE
          $lines=[IO.File]::ReadAllLines($sourcePath)
          function Invoke-V11JStep {
            param([Parameter(Mandatory)][string]$StepName,[Parameter(Mandatory)][string]$RunnerName)
            $marker="      - name: $StepName"
            $start=[Array]::IndexOf($lines,$marker)
            if($start -lt 0){throw "V11L could not find V11J step: $StepName"}
            $end=$lines.Length
            for($i=$start+1;$i -lt $lines.Length;$i++){if(([string]$lines[$i]).StartsWith('      - name: ')){$end=$i;break}}
            $run=-1
            for($i=$start;$i -lt $end;$i++){if($lines[$i] -ceq '        run: |'){$run=$i;break}}
            if($run -lt 0){throw "V11L V11J run-block marker not found for: $StepName"}
            $body=New-Object System.Collections.Generic.List[string]
            for($i=$run+1;$i -lt $end;$i++){
              $raw=[string]$lines[$i]
              if(-not[string]::IsNullOrWhiteSpace($raw) -and -not $raw.StartsWith('          ')){throw "V11L found under-indented V11J PowerShell line at $($i+1): $raw"}
              $body.Add($(if($raw.StartsWith('          ')){$raw.Substring(10)}else{$raw}))
            }
            $runner=Join-Path $env:RUNNER_TEMP $RunnerName
            [IO.File]::WriteAllText($runner,([string]::Join("`n",$body)+"`n"),(New-Object Text.UTF8Encoding($false)))
            $tokens=$null;$errs=$null
            [Management.Automation.Language.Parser]::ParseFile($runner,[ref]$tokens,[ref]$errs)|Out-Null
            if(@($errs).Count){throw "V11L replay parser rejected '$StepName': $((@($errs)|ForEach-Object Message)-join ' | ')"}
            & $runner
            if($LASTEXITCODE -ne 0){throw "V11L replay step '$StepName' exited $LASTEXITCODE"}
          }
          Invoke-V11JStep -StepName 'Replay exact qualified V11H remediation step' -RunnerName 'v11l-replay-v11j-v11h.ps1'
          Invoke-V11JStep -StepName 'Add YAML-safe direct exact-handle byte reader' -RunnerName 'v11l-replay-v11j-handle-reader.ps1'
          Write-Host 'V11L_REPLAY_V11J_REMEDIATION=PASS'

      - name: Correct manifest comparison for IDictionary and PSObject
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE 'scripts/Sync-DeliveryTools.ps1'
          $text=[IO.File]::ReadAllText($path)
          $old='    foreach($field in @(''managed_by'',''version'',''tag'',''commit'',''asset'',''sha256'',''bundle_transaction_id'',''bundle_tree_sha256'')){if([string]$record.Object.$field -cne [string]$Manifest[$field]){throw "$Label manifest mismatch for ''$field''."}}'
          if(([regex]::Matches($text,[regex]::Escape($old))).Count -ne 1){throw 'V11L expected exactly one PSObject-incompatible manifest comparison.'}
          $newLines=@(
            '    foreach($field in @(''managed_by'',''version'',''tag'',''commit'',''asset'',''sha256'',''bundle_transaction_id'',''bundle_tree_sha256'')){' ,
            '        $manifestValue=$null',
            '        if($Manifest -is [System.Collections.IDictionary]){',
            '            if(-not $Manifest.Contains($field)){throw "$Label expected manifest is missing ''$field''."}',
            '            $manifestValue=$Manifest[$field]',
            '        }',
            '        else{',
            '            if($Manifest.PSObject.Properties.Name -cnotcontains $field){throw "$Label expected manifest is missing ''$field''."}',
            '            $manifestValue=$Manifest.$field',
            '        }',
            '        if([string]$record.Object.$field -cne [string]$manifestValue){throw "$Label manifest mismatch for ''$field''."}',
            '    }'
          )
          $new=[string]::Join("`n",$newLines)
          $text=$text.Replace($old,$new)
          if($text.Contains($old)){throw 'V11L PSObject-incompatible manifest comparison remained.'}
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
          Write-Host 'V11L_MANIFEST_SHAPE=PASS_IDICTIONARY_AND_PSOBJECT'

      - name: Create exact local V11L candidate and run full structural suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'install.ps1','update.ps1','scripts/Sync-DeliveryTools.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1','uninstall.ps1',
            'scripts/Test-HmsTrustRemediations.ps1','scripts/Test-HmsOwnedTempCleanup.ps1','scripts/Test-HmsLateTrustBoundaries.ps1'
          )
          $temps=@(
            '.github/workflows/tmp-author-v11-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11b-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11c-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11d-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11e-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11f-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11g-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11h-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11i-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11j-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11k-fresh-review-p1-batch.yml',
            $env:SELF_PATH
          )
          foreach($temp in $temps){if(-not(Test-Path -LiteralPath $temp)){throw "Expected V11L temp file missing: $temp"};Remove-Item -LiteralPath $temp -Force}
          $allowed=@($targets+$temps)
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $unexpected=@($changed|Where-Object{$_ -notin $allowed})
          if($unexpected.Count){throw "Unexpected V11L author paths: $($unexpected -join ', ')"}
          foreach($p in $allowed){if($p -notin $changed){throw "Expected V11L path not changed: $p"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V11L.'}
          Write-Host 'V11L_DIFF_CHECK=PASS'
          foreach($p in $targets){
            $tokens=$null;$errs=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $p),[ref]$tokens,[ref]$errs)|Out-Null
            if(@($errs).Count){throw "Parser rejected $p : $((@($errs)|ForEach-Object Message)-join ' | ')"}
          }
          Write-Host 'V11L_POWERSHELL_PARSE=PASS_9_OF_9'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Close fresh-review lifecycle and exact-file cleanup P1s V11L'
          if($LASTEXITCODE -ne 0){throw 'Local V11L candidate commit failed.'}
          $net=@(& git diff --name-only $env:CLEAN_BASELINE HEAD)
          if($net.Count -ne $targets.Count -or @($net|Where-Object{$_ -notin $targets}).Count){throw "V11L net scope mismatch: $($net -join ', ')"}
          foreach($target in $targets){if($target -notin $net){throw "V11L net diff is missing target: $target"}}
          Write-Host "LOCAL_CANDIDATE=$(((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant())"
          Write-Host "LOCAL_TREE=$(((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant())"
          Write-Host 'V11L_NET_SCOPE=PASS_EXACT_9_FILES'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}
          Write-Host 'V11L_FULL_TEST_HMS_SKILLS=PASS'

      - name: Prove production lifecycle excludes developer validators
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('install.ps1','update.ps1')){
            $text=[IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $path))
            foreach($bad in @('scripts\Test-HmsSkills.ps1','scripts\Test-DeliveryTools.ps1')){if($text-match[regex]::Escape($bad)){throw "$path still executes developer validator: $bad"}}
          }
          Write-Host 'V11L_PRODUCTION_LIFECYCLE_NO_DEVELOPER_VALIDATORS=PASS'

      - name: Prepare nine verified detached GitHub blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'install.ps1','update.ps1','scripts/Sync-DeliveryTools.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1','uninstall.ps1',
            'scripts/Test-HmsTrustRemediations.ps1','scripts/Test-HmsOwnedTempCleanup.ps1','scripts/Test-HmsLateTrustBoundaries.ps1'
          )
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
            $payload=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
            $result=Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/git/blobs" -Headers $headers -Body $payload -ContentType 'application/json'
            $expected=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
            if([string]$result.sha -cne $expected){throw "GitHub blob mismatch for $path. Expected $expected, got $($result.sha)"}
            Write-Host "PREPARED_BLOB $path $expected"
          }
          Write-Host "QUALIFIED_LOCAL_HEAD=$(((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant())"
          Write-Host "QUALIFIED_LOCAL_TREE=$(((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant())"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'
