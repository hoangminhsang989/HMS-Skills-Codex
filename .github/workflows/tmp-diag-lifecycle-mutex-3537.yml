name: TMP diagnose lifecycle mutex 3537

on:
  push:
    branches:
      - diag/lifecycle-mutex-3537

permissions:
  contents: read

jobs:
  windows-mutex-diag:
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: 3537c42f4ce8672491d51f077e5de3854bb5d354
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Prove timeout-safe committed blob retrieval via cmd.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $head = $env:CANDIDATE_SHA.ToLowerInvariant()
          $relative = 'scripts/Initialize-HmsLifecycleTrust.ps1'
          $blob = ((& git -C $root rev-parse "$head`:$relative" 2>$null) -join '').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $blob -notmatch '^[0-9a-f]{40}$') { throw 'Bootstrap blob lookup failed.' }
          $gitExe = @((Get-Command git.exe -CommandType Application -ErrorAction Stop))[0].Source
          $cmdExe = $env:ComSpec
          if (-not (Test-Path -LiteralPath $gitExe -PathType Leaf)) { throw "Exact git.exe not found: $gitExe" }
          if (-not (Test-Path -LiteralPath $cmdExe -PathType Leaf)) { throw "cmd.exe not found: $cmdExe" }

          $outPath = Join-Path $env:RUNNER_TEMP ('hms-dotnet-cmd-out-' + [guid]::NewGuid().ToString('N') + '.bin')
          $errPath = Join-Path $env:RUNNER_TEMP ('hms-dotnet-cmd-err-' + [guid]::NewGuid().ToString('N') + '.txt')
          try {
            $job = Start-Job -ScriptBlock {
              param($RepoRoot,$Blob,$GitExe,$CmdExe,$OutPath,$ErrPath)
              $ErrorActionPreference = 'Stop'
              $psi = New-Object Diagnostics.ProcessStartInfo
              $psi.FileName = $CmdExe
              $psi.Arguments = ('/d /s /c ""{0}" -C "{1}" cat-file blob {2} > "{3}" 2> "{4}""' -f $GitExe,$RepoRoot,$Blob,$OutPath,$ErrPath)
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true
              $proc = New-Object Diagnostics.Process
              $proc.StartInfo = $psi
              try {
                Write-Output ('DOTNET_CMD_ARGUMENTS={0}' -f $psi.Arguments)
                if (-not $proc.Start()) { throw 'cmd.exe process did not start.' }
                Write-Output ('DOTNET_CMD_MAINMODULE={0}' -f $proc.MainModule.FileName)
                if (-not $proc.WaitForExit(10000)) {
                  try { $proc.Kill($true) } catch {}
                  throw 'DOTNET_CMD_TIMEOUT'
                }
                Write-Output ('DOTNET_CMD_EXIT={0}' -f $proc.ExitCode)
                if ($proc.ExitCode -ne 0) {
                  $err = if (Test-Path -LiteralPath $ErrPath -PathType Leaf) { [IO.File]::ReadAllText($ErrPath) } else { '' }
                  throw ('cmd.exe redirected git cat-file failed: ' + $err.Trim())
                }
                if (-not (Test-Path -LiteralPath $OutPath -PathType Leaf)) { throw 'DOTNET_CMD output file missing.' }
                Write-Output ('DOTNET_CMD_BYTES={0}' -f (Get-Item -LiteralPath $OutPath).Length)
              }
              finally {
                $proc.Dispose()
              }
            } -ArgumentList $root,$blob,$gitExe,$cmdExe,$outPath,$errPath

            try {
              $null = Wait-Job $job -Timeout 20
              $output = @(Receive-Job $job -ErrorAction Continue 2>&1)
              $output | ForEach-Object { Write-Host $_ }
              Write-Host ('DOTNET_CMD_JOB_STATE={0}' -f $job.State)
              if ($job.State -ne 'Completed') { throw "DOTNET_CMD child job did not complete: $($job.State)" }
              if (-not ($output -match '^DOTNET_CMD_EXIT=0$')) { throw 'DOTNET_CMD did not prove exit 0.' }
            }
            finally {
              if ($job.State -in @('Running','NotStarted')) { Stop-Job $job -ErrorAction SilentlyContinue }
              Remove-Job $job -Force -ErrorAction SilentlyContinue
            }

            if (-not (Test-Path -LiteralPath $outPath -PathType Leaf)) { throw 'DOTNET_CMD output disappeared before verification.' }
            $bytes = [IO.File]::ReadAllBytes($outPath)
            Write-Host ('DOTNET_CMD_PARENT_BYTES={0}' -f $bytes.Length)
            $roundTrip = ((& $gitExe -C $root hash-object -- $outPath 2>$null) -join '').Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0) { throw 'hash-object verification failed.' }
            Write-Host "DOTNET_CMD_HASH_OBJECT=$roundTrip"
            Write-Host ('DOTNET_CMD_EXACT_BLOB={0}' -f ($roundTrip -eq $blob))
            if ($roundTrip -ne $blob) { throw "DOTNET_CMD byte mismatch: expected $blob got $roundTrip" }
            if (Test-Path -LiteralPath $errPath -PathType Leaf) {
              $stderrText = [IO.File]::ReadAllText($errPath)
              Write-Host ('DOTNET_CMD_STDERR_CHARS={0}' -f $stderrText.Length)
              if ($stderrText.Length -ne 0) { throw ('Unexpected git stderr: ' + $stderrText.Trim()) }
            }
            Write-Host 'DIAG_TIMEOUT_SAFE_CMD_BLOB_RETRIEVAL=PASS'
          }
          finally {
            Remove-Item -LiteralPath $outPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $errPath -Force -ErrorAction SilentlyContinue
          }
