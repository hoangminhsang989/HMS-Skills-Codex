name: TMP diagnose lifecycle mutex 3537

on:
  push:
    branches:
      - diag/lifecycle-mutex-3537

permissions:
  contents: read

jobs:
  windows-mutex-diag:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 3537c42f4ce8672491d51f077e5de3854bb5d354
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Localize lifecycle mutex ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $runnerHome = $env:USERPROFILE
          $oldHome = $env:HOME
          $oldCodexHome = $env:CODEX_HOME
          $mutexName = 'Local\HMS-Skills-Codex-CompositeBuild-v1'

          function Invoke-ExternalMutexProbe {
            param([Parameter(Mandatory)][string]$Label)
            $job = Start-Job -ScriptBlock {
              param($Name,$ProbeLabel)
              $ErrorActionPreference='Stop'
              $m = New-Object System.Threading.Mutex($false,$Name)
              $owned=$false
              try {
                try { $owned=$m.WaitOne([TimeSpan]::FromSeconds(8)) }
                catch [System.Threading.AbandonedMutexException] { $owned=$true }
                if (-not $owned) { throw "MUTEX_PROBE_TIMEOUT:$ProbeLabel" }
                "MUTEX_PROBE_ACQUIRED:$ProbeLabel"
              }
              finally {
                if ($owned) { $m.ReleaseMutex() }
                $m.Dispose()
              }
            } -ArgumentList $mutexName,$Label
            try {
              $null = Wait-Job $job -Timeout 12
              $out = @(Receive-Job $job -ErrorAction Continue 2>&1)
              $out | ForEach-Object { Write-Host $_ }
              if ($job.State -ne 'Completed') {
                Write-Host "MUTEX_PROBE_RESULT:$Label:BLOCKED:$($job.State)"
                return $false
              }
              Write-Host "MUTEX_PROBE_RESULT:$Label:PASS"
              return $true
            }
            finally { Remove-Job $job -Force -ErrorAction SilentlyContinue }
          }

          try {
            $env:HOME=$runnerHome
            $env:CODEX_HOME=Join-Path $runnerHome '.codex'
            & (Join-Path $root 'install.ps1') -InstallRoot $root -SkipCodeGraph -SkipThreeLevelDelivery
            $afterInstall = Invoke-ExternalMutexProbe -Label 'after-full-install'

            $builder = Join-Path $root 'scripts\Build-HmsCompositeSkill.ps1'
            $rollbackObserved=$false
            try {
              $env:HMS_TEST_FAIL_STAGE_ACTIVATION='1'
              & $builder -InstallRoot $root -Hms $true -Superpowers $true -Taste $true -Impeccable $true
            }
            catch {
              Write-Host "ROLLBACK_EXCEPTION:$($_.Exception.Message)"
              if ($_.Exception.Message -match 'Injected staged-root activation failure') { $rollbackObserved=$true } else { throw }
            }
            finally { Remove-Item Env:HMS_TEST_FAIL_STAGE_ACTIVATION -ErrorAction SilentlyContinue }
            if (-not $rollbackObserved) { throw 'Expected rollback branch was not observed.' }
            $afterRollback = Invoke-ExternalMutexProbe -Label 'after-stage-rollback'

            $uiLock = Get-Content -LiteralPath (Join-Path $root 'ui-skills.lock.json') -Raw | ConvertFrom-Json
            $tasteRoot = Join-Path $runnerHome '.codex\taste-skill'
            $tasteRel = ([string]$uiLock.taste.skill_path).TrimEnd('/') + '/SKILL.md'
            $tastePath = Join-Path $tasteRoot ($tasteRel -replace '/', '\')
            Add-Content -LiteralPath $tastePath -Value "`n<!-- HMS DIAG dirty Taste -->"

            $parentMutex = New-Object System.Threading.Mutex($false,$mutexName)
            $parentOwned=$false
            $updateJob=$null
            try {
              $parentOwned=$parentMutex.WaitOne([TimeSpan]::FromSeconds(15))
              if (-not $parentOwned) { throw 'Parent could not acquire mutex before updater diagnostic.' }
              Write-Host 'PARENT_MUTEX_ACQUIRED'
              $updatePath = Join-Path $root 'update.ps1'
              $updateJob = Start-Job -ScriptBlock {
                param($Path,$Install)
                $ErrorActionPreference='Stop'
                Write-Output "UPDATE_CHILD_START:$([DateTime]::UtcNow.ToString('o'))"
                try { & $Path -InstallRoot $Install -SkipCodeGraph -SkipThreeLevelDelivery }
                catch { Write-Output "UPDATE_CHILD_EXCEPTION:$($_.Exception.Message)"; throw }
              } -ArgumentList $updatePath,$root
              Start-Sleep -Seconds 3
              Write-Host "UPDATE_CHILD_HELD_STATE:$($updateJob.State)"
              $parentMutex.ReleaseMutex(); $parentOwned=$false
              Write-Host 'PARENT_MUTEX_RELEASED'
              $deadline=[DateTime]::UtcNow.AddSeconds(30)
              while ([DateTime]::UtcNow -lt $deadline -and $updateJob.State -in @('Running','NotStarted')) {
                Receive-Job $updateJob -ErrorAction Continue 2>&1 | ForEach-Object { Write-Host $_ }
                Start-Sleep -Milliseconds 250
              }
              Receive-Job $updateJob -ErrorAction Continue 2>&1 | ForEach-Object { Write-Host $_ }
              Write-Host "UPDATE_CHILD_FINAL_STATE:$($updateJob.State)"
            }
            finally {
              if ($parentOwned) { try { $parentMutex.ReleaseMutex() } catch {} }
              $parentMutex.Dispose()
              if ($null -ne $updateJob) { Remove-Job $updateJob -Force -ErrorAction SilentlyContinue }
              & git -C $tasteRoot restore --worktree -- $tasteRel
            }

            Write-Host "DIAG_AFTER_INSTALL=$afterInstall"
            Write-Host "DIAG_AFTER_ROLLBACK=$afterRollback"
          }
          finally {
            $env:HOME=$oldHome
            $env:CODEX_HOME=$oldCodexHome
          }
