name: TMP diagnose lifecycle mutex 3537

on:
  push:
    branches:
      - diag/lifecycle-mutex-3537

permissions:
  contents: read

jobs:
  windows-mutex-diag:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      CANDIDATE_SHA: 3537c42f4ce8672491d51f077e5de3854bb5d354
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Compare sequential and concurrent committed-blob drains inside Start-Job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $relative = 'scripts/Initialize-HmsLifecycleTrust.ps1'
          $head = $env:CANDIDATE_SHA.ToLowerInvariant()
          $expected = ((& git -C $root rev-parse "$head`:$relative" 2>$null) -join '').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{40}$') { throw 'Bootstrap blob lookup failed.' }
          Write-Host "BOOTSTRAP_BLOB=$expected"

          $syncJob = Start-Job -ScriptBlock {
            param($RepoRoot,$Blob)
            $ErrorActionPreference='Stop'
            $psi=New-Object Diagnostics.ProcessStartInfo
            $psi.FileName='git'
            $psi.Arguments="cat-file blob $Blob"
            $psi.WorkingDirectory=$RepoRoot
            $psi.UseShellExecute=$false
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $psi.CreateNoWindow=$true
            $proc=New-Object Diagnostics.Process
            $proc.StartInfo=$psi
            $memory=New-Object IO.MemoryStream
            try {
              if (-not $proc.Start()) { throw 'sync start failed' }
              Write-Output 'SYNC_AFTER_START'
              $proc.StandardOutput.BaseStream.CopyTo($memory)
              Write-Output ('SYNC_AFTER_STDOUT={0}' -f $memory.Length)
              $stderr=$proc.StandardError.ReadToEnd()
              Write-Output ('SYNC_AFTER_STDERR={0}' -f $stderr.Length)
              $proc.WaitForExit()
              Write-Output ('SYNC_EXIT={0}' -f $proc.ExitCode)
            }
            finally { $memory.Dispose(); $proc.Dispose() }
          } -ArgumentList $root,$expected

          $null=Wait-Job $syncJob -Timeout 12
          Receive-Job $syncJob -ErrorAction Continue 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "SYNC_JOB_STATE=$($syncJob.State)"
          if ($syncJob.State -in @('Running','NotStarted')) { Stop-Job $syncJob -ErrorAction SilentlyContinue }
          Remove-Job $syncJob -Force -ErrorAction SilentlyContinue

          $asyncJob = Start-Job -ScriptBlock {
            param($RepoRoot,$Blob)
            $ErrorActionPreference='Stop'
            $psi=New-Object Diagnostics.ProcessStartInfo
            $psi.FileName='git'
            $psi.Arguments="cat-file blob $Blob"
            $psi.WorkingDirectory=$RepoRoot
            $psi.UseShellExecute=$false
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $psi.CreateNoWindow=$true
            $proc=New-Object Diagnostics.Process
            $proc.StartInfo=$psi
            $memory=New-Object IO.MemoryStream
            try {
              if (-not $proc.Start()) { throw 'async start failed' }
              Write-Output 'ASYNC_AFTER_START'
              $stdoutTask=$proc.StandardOutput.BaseStream.CopyToAsync($memory)
              $stderrTask=$proc.StandardError.ReadToEndAsync()
              if (-not $proc.WaitForExit(15000)) { try { $proc.Kill($true) } catch {}; throw 'async git cat-file timeout' }
              $stdoutTask.GetAwaiter().GetResult()
              $stderr=$stderrTask.GetAwaiter().GetResult()
              Write-Output ('ASYNC_AFTER_STDOUT={0}' -f $memory.Length)
              Write-Output ('ASYNC_AFTER_STDERR={0}' -f $stderr.Length)
              Write-Output ('ASYNC_EXIT={0}' -f $proc.ExitCode)
            }
            finally { $memory.Dispose(); $proc.Dispose() }
          } -ArgumentList $root,$expected

          $null=Wait-Job $asyncJob -Timeout 25
          $asyncOutput=@(Receive-Job $asyncJob -ErrorAction Continue 2>&1)
          $asyncOutput | ForEach-Object { Write-Host $_ }
          Write-Host "ASYNC_JOB_STATE=$($asyncJob.State)"
          if ($asyncJob.State -ne 'Completed') { throw 'Concurrent pipe drain did not complete in child job.' }
          if (-not ($asyncOutput -match '^ASYNC_EXIT=0$')) { throw 'Concurrent pipe drain did not prove git exit 0.' }
          Remove-Job $asyncJob -Force -ErrorAction SilentlyContinue
