name: Author owned temp cleanup remediation

on:
  push:
    branches: ['stage/hms-superpowers-v0.2.0-ui-design-authority']
    paths:
      - .github/workflows/author-owned-temp-cleanup-remediation.yml
      - .github/hms-temp/owned-temp-cleanup-remediation.py

permissions:
  contents: write

jobs:
  author-owned-temp-cleanup-remediation:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stage/hms-superpowers-v0.2.0-ui-design-authority
          fetch-depth: 0

      - name: Patch exact production blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          python .github/hms-temp/owned-temp-cleanup-remediation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exact remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $changed = @(& git diff --name-only)
          $expected = @('scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1')
          if (@(Compare-Object -ReferenceObject ($expected | Sort-Object) -DifferenceObject ($changed | Sort-Object)).Count -ne 0) {
            throw "Unexpected production patch scope: $($changed -join ', ')"
          }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          & git config user.name 'HMS exact-blob remediation'
          & git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          & git add -- scripts/Build-HmsCompositeSkill.ps1 scripts/Copy-HmsCommittedGitPath.ps1
          & git commit -m 'Bind temporary cleanup to filesystem identity'
          if ($LASTEXITCODE -ne 0) { throw 'Production remediation commit failed.' }
          & git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
          if ($LASTEXITCODE -ne 0) { throw 'Production remediation push failed.' }
