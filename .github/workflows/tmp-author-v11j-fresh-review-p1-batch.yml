name: Temporary author V11J fresh-review P1 remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-v11j-fresh-review-p1-batch.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      CLEAN_BASELINE: f627df23dfc65b8f4cd8ecb2192c9bfccfdd69f5
      EXPECTED_PARENT: 05bbe3ad94eccacaf980380667ca6bd48fc61e81
      EXPECTED_V11H_BLOB: 152b43d82a295a7f065c8e6c5b93be97a2b8a4e3
      EXPECTED_RECIPE_SHA256: f0bd94b2f56fe24ee15894c8b016c1b8b40d5c43b33a16c3a126af88bd01bd58
      V11_SOURCE: .github/workflows/tmp-author-v11-fresh-review-p1-batch.yml
      V11H_SOURCE: .github/workflows/tmp-author-v11h-fresh-review-p1-batch.yml
      SELF_PATH: .github/workflows/tmp-author-v11j-fresh-review-p1-batch.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V11J to exact V11I bootstrap and V11H source blob
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:EXPECTED_PARENT){throw "V11J parent mismatch. Expected $env:EXPECTED_PARENT, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V11J bootstrap scope mismatch: $($changed -join ', ')"}
          & git merge-base --is-ancestor $env:CLEAN_BASELINE HEAD
          if($LASTEXITCODE -ne 0){throw "V11J clean baseline is not an ancestor of HEAD: $env:CLEAN_BASELINE"}
          $v11hBlob=((& git rev-parse "HEAD:$env:V11H_SOURCE")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $v11hBlob -cne $env:EXPECTED_V11H_BLOB){throw "V11J V11H source blob mismatch. Expected $env:EXPECTED_V11H_BLOB, found $v11hBlob"}
          Write-Host 'V11J_BINDING=PASS_EXACT_PARENT_SELF_ONLY_V11H_BLOB'

      - name: Replay exact qualified V11H remediation step
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $lines=[IO.File]::ReadAllLines((Join-Path $env:GITHUB_WORKSPACE $env:V11H_SOURCE))
          $stepStart='      - name: Apply exact V11 recipe plus qualified harness and runtime-token corrections'
          $stepEnd='      - name: Create exact local V11H candidate and run full structural suite'
          $start=[Array]::IndexOf($lines,$stepStart)
          $end=[Array]::IndexOf($lines,$stepEnd)
          if($start -lt 0 -or $end -le $start){throw "V11J could not bind V11H remediation step. start=$start end=$end"}
          $run=-1
          for($i=$start;$i -lt $end;$i++){if($lines[$i] -ceq '        run: |'){$run=$i;break}}
          if($run -lt 0){throw 'V11J V11H run-block marker not found.'}
          $body=New-Object System.Collections.Generic.List[string]
          for($i=$run+1;$i -lt $end;$i++){
            $raw=[string]$lines[$i]
            if(-not[string]::IsNullOrWhiteSpace($raw) -and -not $raw.StartsWith('          ')){throw "V11J found under-indented V11H PowerShell line at $($i+1): $raw"}
            $body.Add($(if($raw.StartsWith('          ')){$raw.Substring(10)}else{$raw}))
          }
          $runner=Join-Path $env:RUNNER_TEMP 'v11j-replay-v11h.ps1'
          [IO.File]::WriteAllText($runner,([string]::Join("`n",$body)+"`n"),(New-Object Text.UTF8Encoding($false)))
          $tokens=$null;$errs=$null
          [Management.Automation.Language.Parser]::ParseFile($runner,[ref]$tokens,[ref]$errs)|Out-Null
          if(@($errs).Count){throw "V11J replay parser rejected V11H step: $((@($errs)|ForEach-Object Message)-join ' | ')"}
          & $runner
          if($LASTEXITCODE -ne 0){throw "V11J V11H remediation replay exited $LASTEXITCODE"}
          Write-Host 'V11J_REPLAY_V11H_REMEDIATION=PASS'

      - name: Add YAML-safe direct exact-handle byte reader
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE 'scripts/Sync-DeliveryTools.ps1'
          $text=[IO.File]::ReadAllText($path)
          $anchor='    public static bool RenameByHandle(SafeFileHandle handle,string destination,out int error)'
          if(([regex]::Matches($text,[regex]::Escape($anchor))).Count -ne 1){throw 'V11J native read insertion anchor missing or duplicated.'}
          $nativeLines=@(
            '    [DllImport("kernel32.dll",SetLastError=true)] [return:MarshalAs(UnmanagedType.Bool)] private static extern bool GetFileSizeEx(SafeFileHandle h,out long size);',
            '    [DllImport("kernel32.dll",SetLastError=true)] [return:MarshalAs(UnmanagedType.Bool)] private static extern bool SetFilePointerEx(SafeFileHandle h,long distance,out long newPointer,uint moveMethod);',
            '    [DllImport("kernel32.dll",SetLastError=true)] [return:MarshalAs(UnmanagedType.Bool)] private static extern bool ReadFile(SafeFileHandle h,byte[] buffer,uint bytesToRead,out uint bytesRead,IntPtr overlapped);',
            '    public static byte[] ReadAllBytesByHandle(SafeFileHandle handle,out int error)',
            '    {',
            '        long size;',
            '        if(!GetFileSizeEx(handle,out size)){error=Marshal.GetLastWin32Error();return null;}',
            '        if(size<0 || size>Int32.MaxValue){error=223;return null;}',
            '        long position;',
            '        if(!SetFilePointerEx(handle,0,out position,0)){error=Marshal.GetLastWin32Error();return null;}',
            '        byte[] result=new byte[(int)size];',
            '        int offset=0;',
            '        while(offset<result.Length)',
            '        {',
            '            int count=Math.Min(1048576,result.Length-offset);',
            '            byte[] chunk=new byte[count];',
            '            uint read;',
            '            if(!ReadFile(handle,chunk,(uint)count,out read,IntPtr.Zero)){error=Marshal.GetLastWin32Error();return null;}',
            '            if(read==0){error=38;return null;}',
            '            Buffer.BlockCopy(chunk,0,result,offset,(int)read);',
            '            offset+=(int)read;',
            '        }',
            '        error=0;return result;',
            '    }'
          )
          $native=[string]::Join("`n",$nativeLines)+"`n"
          $text=$text.Replace($anchor,$native+$anchor)
          $old='$bytes=[IO.File]::ReadAllBytes([string]$Guard.Path)'
          if(([regex]::Matches($text,[regex]::Escape($old))).Count -ne 1){throw 'V11J expected exactly one guarded pathname byte reopen.'}
          $new='$readCode=0;$bytes=[HmsDeliveryExactFsNative]::ReadAllBytesByHandle($Guard.Handle,[ref]$readCode);if($readCode -ne 0 -or $null -eq $bytes){throw "$Label exact guarded-handle read failed (Win32=$readCode)."}'
          $text=$text.Replace($old,$new)
          if($text.Contains($old)){throw 'V11J guarded pathname byte reopen remained.'}
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
          Write-Host 'V11J_EXACT_HANDLE_BYTE_READ=PASS_NO_PATH_REOPEN'

      - name: Create exact local V11J candidate and run full structural suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'install.ps1','update.ps1','scripts/Sync-DeliveryTools.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1','uninstall.ps1',
            'scripts/Test-HmsTrustRemediations.ps1','scripts/Test-HmsOwnedTempCleanup.ps1','scripts/Test-HmsLateTrustBoundaries.ps1'
          )
          $temps=@(
            '.github/workflows/tmp-author-v11-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11b-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11c-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11d-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11e-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11f-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11g-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11h-fresh-review-p1-batch.yml',
            '.github/workflows/tmp-author-v11i-fresh-review-p1-batch.yml',
            $env:SELF_PATH
          )
          foreach($temp in $temps){if(-not(Test-Path -LiteralPath $temp)){throw "Expected V11J temp file missing: $temp"};Remove-Item -LiteralPath $temp -Force}
          $allowed=@($targets+$temps)
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $unexpected=@($changed|Where-Object{$_ -notin $allowed})
          if($unexpected.Count){throw "Unexpected V11J author paths: $($unexpected -join ', ')"}
          foreach($p in $allowed){if($p -notin $changed){throw "Expected V11J path not changed: $p"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V11J.'}
          Write-Host 'V11J_DIFF_CHECK=PASS'
          foreach($p in $targets){
            $tokens=$null;$errs=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $p),[ref]$tokens,[ref]$errs)|Out-Null
            if(@($errs).Count){throw "Parser rejected $p : $((@($errs)|ForEach-Object Message)-join ' | ')"}
          }
          Write-Host 'V11J_POWERSHELL_PARSE=PASS_9_OF_9'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Close fresh-review lifecycle and exact-file cleanup P1s V11J'
          if($LASTEXITCODE -ne 0){throw 'Local V11J candidate commit failed.'}
          $net=@(& git diff --name-only $env:CLEAN_BASELINE HEAD)
          if($net.Count -ne $targets.Count -or @($net|Where-Object{$_ -notin $targets}).Count){throw "V11J net scope mismatch: $($net -join ', ')"}
          foreach($target in $targets){if($target -notin $net){throw "V11J net diff is missing target: $target"}}
          Write-Host "LOCAL_CANDIDATE=$(((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant())"
          Write-Host "LOCAL_TREE=$(((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant())"
          Write-Host 'V11J_NET_SCOPE=PASS_EXACT_9_FILES'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}
          Write-Host 'V11J_FULL_TEST_HMS_SKILLS=PASS'

      - name: Prove production lifecycle excludes developer validators
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('install.ps1','update.ps1')){
            $text=[IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $path))
            foreach($bad in @('scripts\Test-HmsSkills.ps1','scripts\Test-DeliveryTools.ps1')){if($text-match[regex]::Escape($bad)){throw "$path still executes developer validator: $bad"}}
          }
          Write-Host 'V11J_PRODUCTION_LIFECYCLE_NO_DEVELOPER_VALIDATORS=PASS'

      - name: Prepare nine verified detached GitHub blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'install.ps1','update.ps1','scripts/Sync-DeliveryTools.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Copy-HmsCommittedGitPath.ps1','uninstall.ps1',
            'scripts/Test-HmsTrustRemediations.ps1','scripts/Test-HmsOwnedTempCleanup.ps1','scripts/Test-HmsLateTrustBoundaries.ps1'
          )
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
            $payload=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
            $result=Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/git/blobs" -Headers $headers -Body $payload -ContentType 'application/json'
            $expected=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
            if([string]$result.sha -cne $expected){throw "GitHub blob mismatch for $path. Expected $expected, got $($result.sha)"}
            Write-Host "PREPARED_BLOB $path $expected"
          }
          Write-Host "QUALIFIED_LOCAL_HEAD=$(((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant())"
          Write-Host "QUALIFIED_LOCAL_TREE=$(((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant())"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'
