name: Diagnose uninstall live-byte EOL identity

on:
  push:
    paths:
      - '.github/workflows/diagnose-uninstall-eol-identity.yml'

permissions:
  contents: read

jobs:
  diagnose-uninstall-eol-identity:
    runs-on: windows-latest
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove CRLF checkout is the exact uninstall trust mismatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Diagnostic checkout mismatch: $head" }
          $sourceRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $remoteLine = ((& git ls-remote origin $sourceRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve diagnostic source ref.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "Diagnostic source ref moved. Expected $head, found $remoteSha" }

          $path = Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'
          $expected = ((& git rev-parse 'HEAD:uninstall.ps1') -join '').Trim().ToLowerInvariant()
          $live = ((& git hash-object --no-filters -- $path) -join '').Trim().ToLowerInvariant()
          $bytes = [IO.File]::ReadAllBytes($path)
          $crlfCount = 0
          for ($i = 0; $i -lt ($bytes.Length - 1); $i++) {
            if ($bytes[$i] -eq 13 -and $bytes[$i+1] -eq 10) { $crlfCount++ }
          }
          $text = (New-Object Text.UTF8Encoding($false,$true)).GetString($bytes)
          $normalizedText = $text.Replace("`r`n","`n").Replace("`r","`n")
          $normalizedPath = Join-Path $env:RUNNER_TEMP 'uninstall-normalized-lf.ps1'
          [IO.File]::WriteAllText($normalizedPath,$normalizedText,(New-Object Text.UTF8Encoding($false)))
          $normalized = ((& git hash-object --no-filters -- $normalizedPath) -join '').Trim().ToLowerInvariant()

          Write-Host "EXPECTED_COMMITTED_BLOB=$expected"
          Write-Host "LIVE_CHECKOUT_BLOB=$live"
          Write-Host "LF_NORMALIZED_BLOB=$normalized"
          Write-Host "CRLF_PAIR_COUNT=$crlfCount"

          if ($expected -cne '56ad20cc3d97485c874645b0ae8162270ab44921') { throw "Unexpected committed uninstall blob: $expected" }
          if ($live -cne '637e5bd213d1c2b0e42dd3e0b0e5d0f72f63895e') { throw "Unexpected live uninstall blob; diagnostic no longer reproduces exact runtime mismatch: $live" }
          if ($crlfCount -le 0) { throw 'Live uninstall checkout contains no CRLF pairs; EOL hypothesis is false.' }
          if ($normalized -cne $expected) { throw "LF normalization did not restore committed blob identity. Expected $expected, found $normalized" }
          Write-Host 'PASS: uninstall.ps1 trust mismatch is exactly Windows CRLF checkout transformation; LF normalization restores the committed Git blob identity.'
