name: Apply ExpectedHead fixture alignment

on:
  pull_request:

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  align-fixture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Patch synthetic support-binding fixture only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $message=((& git log -1 --format=%s)-join '').Trim()
          if($message -cne 'chore: trigger ExpectedHead fixture alignment'){
            Write-Host "No fixture alignment for head message: $message"
            exit 0
          }
          @'
          from pathlib import Path
          p=Path('scripts/Test-HmsTrustRemediations.ps1')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {n}')
              s=s.replace(old,new,1)
          once("function Copy-SkillModule {\n    param([string]$Source,[string]$Destination)\n    Copy-Item -LiteralPath $Source -Destination $Destination -Recurse -Force\n}",
               "function Copy-SkillModule {\n    param([string]$Source,[string]$Destination,[Parameter(Mandatory)][string]$ExpectedHead)\n    Copy-Item -LiteralPath $Source -Destination $Destination -Recurse -Force\n}",
               'synthetic Copy-SkillModule contract')
          once("$target = Join-Path $OutputRoot 'hms-superpowers'\nNew-Item -ItemType Directory -Force -Path $target | Out-Null\nCopy-SkillModule -Source (Join-Path $InstallRoot 'skills\\fixture-source') -Destination (Join-Path $target 'references\\fixture-source')",
               "$target = Join-Path $OutputRoot 'hms-superpowers'\n$fixtureExpectedHead = ((& git -C $InstallRoot rev-parse HEAD 2>$null) -join '').Trim().ToLowerInvariant()\nif ($LASTEXITCODE -ne 0 -or $fixtureExpectedHead -notmatch '^[0-9a-f]{40}$') { throw 'Synthetic support-binding fixture HEAD is unavailable.' }\nNew-Item -ItemType Directory -Force -Path $target | Out-Null\nCopy-SkillModule -Source (Join-Path $InstallRoot 'skills\\fixture-source') -Destination (Join-Path $target 'references\\fixture-source') -ExpectedHead $fixtureExpectedHead",
               'synthetic Copy-SkillModule call')
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Fixture patch failed.'}
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsTrustRemediations.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw "Patched trust regression failed PowerShell parse: $((@($errors)|ForEach-Object Message)-join ' | ')"}
          & git diff --check -- scripts/Test-HmsTrustRemediations.ps1
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed.'}
          $diffNames=@(& git diff --name-only)
          if($diffNames.Count -ne 1 -or $diffNames[0] -cne 'scripts/Test-HmsTrustRemediations.ps1'){throw "Unexpected patch scope: $($diffNames -join ', ')"}
          & git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          & git config user.name 'hoangminhsang989'
          & git add -- scripts/Test-HmsTrustRemediations.ps1
          & git commit -m 'test: align support-binding fixture with ExpectedHead contract'
          if($LASTEXITCODE -ne 0){throw 'Fixture commit failed.'}
          & git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
          if($LASTEXITCODE -ne 0){throw 'Fixture push failed.'}
