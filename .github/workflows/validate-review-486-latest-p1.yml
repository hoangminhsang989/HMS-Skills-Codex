name: Apply CodeGraph rollback-order hardening

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  harden-rollback-order:
    runs-on: windows-latest
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Patch CodeGraph manifest rollback ordering only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $message=((& git log -1 --format=%s)-join '').Trim()
          if($message -cne 'chore: trigger CodeGraph rollback-order hardening push'){
            Write-Host "No hardening for head message: $message"
            exit 0
          }
          @'
          from pathlib import Path
          p=Path('scripts/Sync-DeliveryTools.ps1')
          s=p.read_text(encoding='utf-8')
          old="""                try {
                    if ($manifestPublished) { Restore-CodeGraphManifestAfterFailure -CandidateManifest $publishedManifest -PreviousBytes $existingManifestBytes -HadPrevious $wasInstalled }
                }
                catch { $rollbackErrors += $_.Exception.Message }
"""
          new="""                try {
                    if ($rollbackErrors.Count -eq 0 -and $manifestPublished) { Restore-CodeGraphManifestAfterFailure -CandidateManifest $publishedManifest -PreviousBytes $existingManifestBytes -HadPrevious $wasInstalled }
                }
                catch { $rollbackErrors += $_.Exception.Message }
"""
          n=s.count(old)
          if n!=1:
              raise SystemExit(f'rollback manifest ordering block: expected exactly one occurrence, found {n}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Rollback-order patch failed.'}
          $path=Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw "Patched delivery script failed PowerShell parse: $((@($errors)|ForEach-Object Message)-join ' | ')"}
          & git diff --check -- scripts/Sync-DeliveryTools.ps1
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed.'}
          $diffNames=@(& git diff --name-only)
          if($diffNames.Count -ne 1 -or $diffNames[0] -cne 'scripts/Sync-DeliveryTools.ps1'){throw "Unexpected patch scope: $($diffNames -join ', ')"}
          $patched=[IO.File]::ReadAllText($path)
          $required='$rollbackErrors.Count -eq 0 -and $manifestPublished'
          if($patched -notmatch [regex]::Escape($required)){throw 'Rollback-order hardening literal missing after patch.'}
          & git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          & git config user.name 'hoangminhsang989'
          & git add -- scripts/Sync-DeliveryTools.ps1
          & git commit -m 'fix: restore CodeGraph manifest only after bundle rollback succeeds'
          if($LASTEXITCODE -ne 0){throw 'Hardening commit failed.'}
          & git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
          if($LASTEXITCODE -ne 0){throw 'Hardening push failed.'}
