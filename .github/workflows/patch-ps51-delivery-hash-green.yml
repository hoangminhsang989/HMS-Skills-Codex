name: Patch PS5.1-safe delivery SHA-256 GREEN

on:
  push:
    paths:
      - '.github/workflows/patch-ps51-delivery-hash-green.yml'

permissions:
  contents: write

jobs:
  patch-ps51-delivery-hash-green:
    runs-on: windows-latest
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Prove exact GREEN inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "GREEN checkout mismatch: $head" }
          $sourceRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $remoteLine = ((& git ls-remote origin $sourceRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve GREEN source ref.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "GREEN source ref moved. Expected $head, found $remoteSha" }
          $status = ((& git status --porcelain=v1 --untracked-files=all) -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($status)) { throw "GREEN checkout is not clean: $status" }
          $deliveryBlob = (& git rev-parse 'HEAD:scripts/Sync-DeliveryTools.ps1').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $deliveryBlob -cne 'd574cb9a8f952525a8824a0357c59ece29b73e8e') {
            throw "Unexpected pre-remediation delivery blob: $deliveryBlob"
          }
          $testText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsWindowsSetup.ps1'))
          if ($testText -notmatch 'Get-HmsDeliveryFileSha256 helper; found') { throw 'Permanent PS5.1 delivery hash RED contract is not present.' }
          Write-Host "PASS: exact GREEN inputs HEAD=$head DELIVERY_BLOB=$deliveryBlob"

      - name: Apply minimal PS5.1-safe delivery SHA-256 remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'
          $content = [IO.File]::ReadAllText($path)
          if ([regex]::Matches($content,'(?i)\bGet-FileHash\b').Count -ne 2) { throw 'Expected exactly two pre-remediation Get-FileHash references.' }
          if ([regex]::Matches($content,'function\s+Get-HmsDeliveryFileSha256\b').Count -ne 0) { throw 'PS5.1-safe delivery hash helper already exists unexpectedly.' }

          $marker = 'function Open-CodeGraphVerifiedArchive {'
          if ([regex]::Matches($content,[regex]::Escape($marker)).Count -ne 1) { throw 'Expected exactly one Open-CodeGraphVerifiedArchive insertion marker.' }
          $helper = @'
          function Get-HmsDeliveryFileSha256 {
              param([Parameter(Mandatory)][string]$Path)
              $stream = New-Object IO.FileStream($Path,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
              $sha = [Security.Cryptography.SHA256]::Create()
              try {
                  return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-','').ToLowerInvariant()
              }
              finally {
                  $sha.Dispose()
                  $stream.Dispose()
              }
          }

          '@
          $content = $content.Replace($marker,($helper + $marker))

          $oldAsset = '$actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()'
          $newAsset = '$actual = Get-HmsDeliveryFileSha256 -Path $Path'
          if ([regex]::Matches($content,[regex]::Escape($oldAsset)).Count -ne 1) { throw 'Expected exactly one CodeGraph asset Get-FileHash call.' }
          $content = $content.Replace($oldAsset,$newAsset)

          $oldTree = '$hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()'
          $newTree = '$hash = Get-HmsDeliveryFileSha256 -Path $item.FullName'
          if ([regex]::Matches($content,[regex]::Escape($oldTree)).Count -ne 1) { throw 'Expected exactly one CodeGraph bundle-tree Get-FileHash call.' }
          $content = $content.Replace($oldTree,$newTree)

          if ([regex]::Matches($content,'(?i)\bGet-FileHash\b').Count -ne 0) { throw 'Get-FileHash remains after PS5.1 remediation.' }
          if ([regex]::Matches($content,'function\s+Get-HmsDeliveryFileSha256\b').Count -ne 1) { throw 'PS5.1-safe delivery hash helper count is not exactly one after remediation.' }
          [IO.File]::WriteAllText($path,$content,(New-Object Text.UTF8Encoding($false)))
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'GREEN delivery hash patch failed git diff --check.' }

      - name: Prove permanent PS5.1 delivery hash contract is GREEN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-HmsWindowsSetup.ps1 -Scope Bootstrap
          Write-Host 'PASS: permanent PS5.1-safe delivery hash contract is GREEN.'

      - name: Publish minimal GREEN successor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/Sync-DeliveryTools.ps1
          git commit -m 'fix: make delivery SHA-256 hashing PS5.1-safe'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit PS5.1-safe delivery hash remediation.' }
          git push origin HEAD:refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish PS5.1-safe delivery hash remediation.' }
