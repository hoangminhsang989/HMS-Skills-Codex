name: Validate HMS composite mutex liveness

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-mutex-liveness:
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Localize post-lifecycle lock and two-process builder liveness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSha = $env:CANDIDATE_SHA.ToLowerInvariant()
          $actualSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $expectedSha) {
            throw "Workflow checkout identity mismatch. Expected $expectedSha, found $actualSha"
          }

          $buildMutexName = 'Local\HMS-Skills-Codex-CompositeBuild-v1'
          $builderPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\Build-HmsCompositeSkill.ps1'

          function Assert-ExternalMutexAcquire {
            param([Parameter(Mandatory)][string]$Label)
            $probe = Start-Job -ScriptBlock {
              param($MutexName)
              $ErrorActionPreference = 'Stop'
              $mutex = New-Object System.Threading.Mutex($false, $MutexName)
              $owned = $false
              try {
                try {
                  $owned = $mutex.WaitOne([TimeSpan]::FromSeconds(10))
                }
                catch [System.Threading.AbandonedMutexException] {
                  $owned = $true
                }
                if (-not $owned) { throw "Timed out acquiring composite build mutex from external process: $MutexName" }
              }
              finally {
                if ($owned) {
                  $mutex.ReleaseMutex()
                  $owned = $false
                }
                $mutex.Dispose()
              }
            } -ArgumentList $buildMutexName
            try {
              $null = Wait-Job -Job $probe -Timeout 20
              if ($probe.State -eq 'Completed') {
                Receive-Job -Job $probe -ErrorAction Stop | Write-Host
              }
              elseif ($probe.State -eq 'Failed') {
                Receive-Job -Job $probe -ErrorAction Stop | Write-Host
                throw "External composite mutex probe failed after $Label."
              }
              else {
                throw "External composite mutex probe did not complete after $Label. State=$($probe.State)"
              }
            }
            finally {
              Remove-Job -Job $probe -Force -ErrorAction SilentlyContinue
            }
            Write-Host "PASS: external process acquired and released composite mutex after $Label."
          }

          function Wait-BuilderPair {
            param(
              [Parameter(Mandatory)][object[]]$Jobs,
              [Parameter(Mandatory)][string]$Label,
              [Parameter(Mandatory)][int]$TimeoutSeconds
            )
            $deadline = [DateTime]::UtcNow.AddSeconds($TimeoutSeconds)
            while ([DateTime]::UtcNow -lt $deadline) {
              foreach ($job in $Jobs) { Receive-Job -Job $job -ErrorAction Stop | Write-Host }
              if (@($Jobs | Where-Object { $_.State -notin @('Completed','Failed','Stopped') }).Count -eq 0) { break }
              Start-Sleep -Milliseconds 250
            }
            foreach ($job in $Jobs) {
              Receive-Job -Job $job -ErrorAction Stop | Write-Host
              if ($job.State -ne 'Completed') {
                $states = (($Jobs | ForEach-Object { "Id=$($_.Id):$($_.State)" }) -join ', ')
                throw "$Label did not complete within ${TimeoutSeconds}s. $states"
              }
            }
            Write-Host "PASS: $Label completed within ${TimeoutSeconds}s."
          }

          $jobScript = {
            param($Builder,$Install,$Output,$Skills,$HmsEnabled,$Label)
            $ErrorActionPreference = 'Stop'
            Write-Output "HMS_JOB_START label=$Label pid=$PID hms=$HmsEnabled utc=$([DateTime]::UtcNow.ToString('o'))"
            & $Builder `
              -InstallRoot $Install `
              -OutputRoot $Output `
              -SkillsRoot $Skills `
              -Hms ([bool]$HmsEnabled) `
              -Superpowers $false `
              -Taste $false `
              -Impeccable $false
            Write-Output "HMS_JOB_RETURN label=$Label pid=$PID hms=$HmsEnabled utc=$([DateTime]::UtcNow.ToString('o'))"
          }

          $runnerHome = $env:USERPROFILE
          $originalHome = $env:HOME
          $originalCodexHome = $env:CODEX_HOME
          $tempRoot = Join-Path ([IO.Path]::GetTempPath()) ('hms-mutex-liveness-' + [guid]::NewGuid().ToString('N'))
          try {
            $env:HOME = $runnerHome
            $env:CODEX_HOME = Join-Path $runnerHome '.codex'

            & "$env:GITHUB_WORKSPACE\install.ps1" `
              -InstallRoot $env:GITHUB_WORKSPACE `
              -SkipSuperpowers `
              -SkipTaste `
              -SkipImpeccable `
              -SkipCodeGraph `
              -SkipThreeLevelDelivery
            Assert-ExternalMutexAcquire -Label 'install lifecycle'

            $directOutput = Join-Path $tempRoot 'direct-composite'
            $directSkills = Join-Path $tempRoot 'direct-skills'
            & $builderPath `
              -InstallRoot $env:GITHUB_WORKSPACE `
              -OutputRoot $directOutput `
              -SkillsRoot $directSkills `
              -Hms $false `
              -Superpowers $false `
              -Taste $false `
              -Impeccable $false
            Assert-ExternalMutexAcquire -Label 'direct builder lifecycle'

            # Phase A: both children leave public discovery OFF. This removes Junction create/remove transitions from the liveness equation.
            $offOutput = Join-Path $tempRoot 'parallel-off-composite'
            $offSkills = Join-Path $tempRoot 'parallel-off-skills'
            $offJobs = @()
            try {
              $offJobs += Start-Job -ScriptBlock $jobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,$offOutput,$offSkills,$false,'off-a'
              $offJobs += Start-Job -ScriptBlock $jobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,$offOutput,$offSkills,$false,'off-b'
              Wait-BuilderPair -Jobs $offJobs -Label 'two-process OFF/OFF composite build' -TimeoutSeconds 60
            }
            finally {
              foreach ($job in $offJobs) { Remove-Job -Job $job -Force -ErrorAction SilentlyContinue }
            }
            Assert-ExternalMutexAcquire -Label 'two-process OFF/OFF lifecycle'

            # Phase B: preserve the original reproducer: one child enables HMS discovery while the other disables it.
            $toggleOutput = Join-Path $tempRoot 'parallel-toggle-composite'
            $toggleSkills = Join-Path $tempRoot 'parallel-toggle-skills'
            $toggleJobs = @()
            try {
              $toggleJobs += Start-Job -ScriptBlock $jobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,$toggleOutput,$toggleSkills,$true,'toggle-on'
              $toggleJobs += Start-Job -ScriptBlock $jobScript -ArgumentList $builderPath,$env:GITHUB_WORKSPACE,$toggleOutput,$toggleSkills,$false,'toggle-off'
              Wait-BuilderPair -Jobs $toggleJobs -Label 'two-process ON/OFF composite build' -TimeoutSeconds 120
            }
            finally {
              foreach ($job in $toggleJobs) { Remove-Job -Job $job -Force -ErrorAction SilentlyContinue }
            }
            Assert-ExternalMutexAcquire -Label 'two-process ON/OFF lifecycle'

            $toggleManifestPath = Join-Path $toggleOutput 'hms-superpowers\manifest.json'
            if (-not (Test-Path -LiteralPath $toggleManifestPath)) { throw 'Two-process ON/OFF build did not leave a composite manifest.' }
            $leftovers = @(Get-ChildItem -LiteralPath $toggleOutput -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '.stage-*' -or $_.Name -like '.backup-*' })
            if ($leftovers.Count -ne 0) { throw 'Two-process ON/OFF build left stage/backup artifacts.' }

            Write-Host 'PASS: external mutex reacquisition, OFF/OFF process serialization, and ON/OFF process serialization all satisfy bounded Windows liveness.'
          }
          finally {
            if (Test-Path -LiteralPath $tempRoot) { Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue }
            $env:HOME = $originalHome
            $env:CODEX_HOME = $originalCodexHome
          }
