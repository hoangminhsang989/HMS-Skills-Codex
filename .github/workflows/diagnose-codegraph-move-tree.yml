name: Author logical CodeGraph bundle tree identity

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/diagnose-codegraph-move-tree.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Replace path-dependent tree identity from exact production blob
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('scripts/Sync-DeliveryTools.ps1')
          expected = 'fac65fd6d06ed5842a9d027f9ac2c6380dd53b0b'
          actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip().lower()
          if actual != expected:
              raise SystemExit(f'Production blob drifted. Expected {expected}, found {actual}')
          text = path.read_text(encoding='utf-8')
          begin = 'function Get-CodeGraphBundleTreeSha256 {'
          end = 'function New-CodeGraphBundleIdentity {'
          if text.count(begin) != 1 or text.count(end) != 1:
              raise SystemExit('CodeGraph tree-hash function anchors are not unique.')
          start = text.index(begin)
          finish = text.index(end, start)
          lines = [
              'function Add-CodeGraphBundleTreeRecords {',
              '    param(',
              '        [Parameter(Mandatory)][string]$Directory,',
              '        [Parameter(Mandatory)][string]$LogicalPrefix,',
              '        [Parameter(Mandatory)]$Records',
              '    )',
              '    foreach ($item in @(Get-ChildItem -LiteralPath $Directory -Force -ErrorAction Stop)) {',
              '        if ([bool]($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "CodeGraph bundle tree contains a reparse point: $($item.FullName)" }',
              '        $logical = if ([string]::IsNullOrEmpty($LogicalPrefix)) { [string]$item.Name } else { $LogicalPrefix + "/" + [string]$item.Name }',
              '        if ([bool]$item.PSIsContainer) {',
              '            Add-CodeGraphBundleTreeRecords -Directory $item.FullName -LogicalPrefix $logical -Records $Records',
              '            continue',
              '        }',
              '        if ([string]::IsNullOrEmpty($LogicalPrefix) -and [string]$item.Name -ceq $CodeGraphBundleMarkerName) { continue }',
              '        $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()',
              '        $Records.Add($logical + "`t" + $hash)',
              '    }',
              '}',
              '',
              'function Get-CodeGraphBundleTreeSha256 {',
              '    param([Parameter(Mandatory)][string]$Path)',
              '    Assert-RegularCodeGraphBundle -Path $Path -Label "CodeGraph bundle tree"',
              '    $root = (Resolve-Path -LiteralPath $Path -ErrorAction Stop).Path',
              '    $records = New-Object System.Collections.Generic.List[string]',
              '    Add-CodeGraphBundleTreeRecords -Directory $root -LogicalPrefix "" -Records $records',
              '    if ($records.Count -eq 0) { throw "CodeGraph bundle tree contains no authenticated files: $Path" }',
              '    $sorted = [string[]]@($records)',
              '    [Array]::Sort($sorted, [StringComparer]::Ordinal)',
              '    $payload = [string]::Join("`n", $sorted)',
              '    $sha = [Security.Cryptography.SHA256]::Create()',
              '    try {',
              '        $bytes = [Text.Encoding]::UTF8.GetBytes($payload)',
              '        return ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()',
              '    }',
              '    finally { $sha.Dispose() }',
              '}',
              '',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[finish:], encoding='utf-8', newline='\n')
      - name: Validate and push production commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- scripts/Sync-DeliveryTools.ps1
          git config user.name 'HMS exact-blob remediation'
          git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          git add scripts/Sync-DeliveryTools.ps1
          git commit -m 'Make CodeGraph bundle tree identity path-independent'
          git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
