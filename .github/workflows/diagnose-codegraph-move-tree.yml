name: Diagnose CodeGraph move tree identity

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/diagnose-codegraph-move-tree.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emit one-line move identity oracle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $lock=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'delivery-tools.lock.json') -Raw|ConvertFrom-Json
          $spec=$lock.codegraph
          $asset=$spec.windows_assets.x64
          $markerName='.hms-codegraph-bundle.json'
          function Snapshot([string]$Path) {
            $root=(Resolve-Path -LiteralPath $Path -ErrorAction Stop).Path.TrimEnd('\')
            $markerFull=[IO.Path]::GetFullPath((Join-Path $root $markerName))
            $m=[ordered]@{}
            $markerItemFull='<missing>'
            $markerRelative='<missing>'
            $markerMatch=$false
            foreach($item in @(Get-ChildItem -LiteralPath $root -Force -Recurse -ErrorAction Stop)) {
              if([bool]$item.PSIsContainer){continue}
              $full=[IO.Path]::GetFullPath($item.FullName)
              $isMarker=[string]::Equals($full,$markerFull,[StringComparison]::OrdinalIgnoreCase)
              $relative=$item.FullName.Substring($root.Length).TrimStart('\').Replace('\','/')
              if($item.Name -ceq $markerName){$markerItemFull=$full;$markerRelative=$relative;$markerMatch=$isMarker}
              if($isMarker){continue}
              $m[$relative]=(Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            [pscustomobject]@{Root=$root;MarkerFull=$markerFull;MarkerItemFull=$markerItemFull;MarkerRelative=$markerRelative;MarkerMatch=$markerMatch;Map=$m}
          }
          function TreeHash($Map){
            $records=@($Map.Keys|ForEach-Object{[string]$_+"`t"+[string]$Map[$_]}|Sort-Object)
            $payload=[string]::Join("`n",$records)
            $sha=[Security.Cryptography.SHA256]::Create();try{return ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload)))).Replace('-','').ToLowerInvariant()}finally{$sha.Dispose()}
          }
          function DiffSummary($A,$B){
            $out=New-Object System.Collections.Generic.List[string]
            $keys=@($A.Keys)+@($B.Keys)|Sort-Object -Unique
            foreach($k in $keys){$av=if($A.Contains($k)){$A[$k]}else{'<missing>'};$bv=if($B.Contains($k)){$B[$k]}else{'<missing>'};if($av -cne $bv){$out.Add([string]$k)}}
            if($out.Count -eq 0){return '<none>'}
            return (($out|Select-Object -First 8)-join ',')
          }
          $temp=Join-Path $env:TEMP ('hms-cg-move-'+[guid]::NewGuid().ToString('N'))
          $zip=Join-Path $temp ([string]$asset.name)
          $extract=Join-Path $temp 'extract'
          $flat=Join-Path $temp 'flat'
          $destParent=Join-Path $env:USERPROFILE '.codex\hms-cg-move-diag'
          $current=Join-Path $destParent 'current'
          try {
            New-Item -ItemType Directory -Force -Path $extract,$flat,$destParent|Out-Null
            $url="https://github.com/colbymchenry/codegraph/releases/download/$([string]$spec.tag)/$([string]$asset.name)"
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
            $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -cne [string]$asset.sha256){throw "asset SHA mismatch: $actual"}
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $inner=Join-Path $extract 'codegraph-win32-x64'
            Get-ChildItem -LiteralPath $inner -Force|ForEach-Object{Move-Item -LiteralPath $_.FullName -Destination $flat -Force}
            $cmd=Join-Path $flat 'bin\codegraph.cmd'
            $out=(& $cmd --version 2>&1)-join "`n";if($LASTEXITCODE -ne 0){throw "version failed: $out"}
            $s0=Snapshot $flat; $h0=TreeHash $s0.Map
            [IO.File]::WriteAllText((Join-Path $flat $markerName),'{"transaction_id":"0123456789abcdef0123456789abcdef"}',(New-Object Text.UTF8Encoding($false)))
            $s1=Snapshot $flat; $h1=TreeHash $s1.Map
            Move-Item -LiteralPath $flat -Destination $current
            $s2=Snapshot $current; $h2=TreeHash $s2.Map
            $diff=DiffSummary $s1.Map $s2.Map
            throw ("MOVE_TREE_ORACLE|R1={0}|MF1={1}|MI1={2}|MR1={3}|MM1={4}|H0={5}|H1={6}|R2={7}|MF2={8}|MI2={9}|MR2={10}|MM2={11}|H2={12}|DIFF={13}" -f $s1.Root,$s1.MarkerFull,$s1.MarkerItemFull,$s1.MarkerRelative,$s1.MarkerMatch,$h0,$h1,$s2.Root,$s2.MarkerFull,$s2.MarkerItemFull,$s2.MarkerRelative,$s2.MarkerMatch,$h2,$diff)
          }
          finally {
            Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $destParent -Recurse -Force -ErrorAction SilentlyContinue
          }
