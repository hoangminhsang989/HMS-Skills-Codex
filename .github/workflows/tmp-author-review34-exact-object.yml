name: Temporary author review34 exact-object remediations

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority

permissions:
  contents: write

jobs:
  author:
    if: github.event.head_commit.message == 'Retry review34 author with portable quarantine cleanup'
    runs-on: windows-latest
    steps:
      - name: Checkout author head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate and apply baseline-locked patcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/.tmp_patch_exact_object_review34.py
          python scripts/.tmp_patch_exact_object_review34.py

      - name: Bind late regression to production exact-temp helper scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsLateTrustBoundaries.ps1'
          $text = [IO.File]::ReadAllText($path)
          $needle = "$owned = New-HmsOwnedTempDirectory -Prefix 'hms-review34-root-lock-' -Label 'review34 root lock regression'"
          if (-not $text.Contains($needle)) { throw 'Late regression exact-root probe anchor missing.' }
          $insert = @'
          $ownedHelperStart = $builderText.IndexOf("if (-not ('HmsOwnedTempNative' -as [type])) {")
          $ownedHelperEnd = $builderText.IndexOf('$repoRoot = Split-Path -Parent $PSScriptRoot',$ownedHelperStart)
          if ($ownedHelperStart -lt 0 -or $ownedHelperEnd -lt 0) { throw 'Could not isolate production exact-temp helper prelude for review34 regression.' }
          $ownedHelperPath = Join-Path $env:TEMP ('hms-review34-owned-helper-' + [guid]::NewGuid().ToString('N') + '.ps1')
          [IO.File]::WriteAllText($ownedHelperPath,$builderText.Substring($ownedHelperStart,$ownedHelperEnd-$ownedHelperStart),(New-Object Text.UTF8Encoding($false)))
          try { . $ownedHelperPath } finally { Remove-Item -LiteralPath $ownedHelperPath -Force -ErrorAction SilentlyContinue }

          '@
          $text = $text.Replace($needle,$insert + $needle)
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

      - name: Replace cross-script regression helper with self-contained probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/.tmp_fix_review34_late_probe.py
          python scripts/.tmp_fix_review34_late_probe.py

      - name: Preserve clone quarantine revalidation under exact root authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/.tmp_fix_review34_clone_quarantine.py
          python scripts/.tmp_fix_review34_clone_quarantine.py

      - name: Harden portable quarantine root cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/.tmp_fix_review34_nonwindows_cleanup.py
          python scripts/.tmp_fix_review34_nonwindows_cleanup.py

      - name: Adapt rollback handoff regression to factored exact guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/.tmp_fix_review34_rollback_handoff_harness.py
          python scripts/.tmp_fix_review34_rollback_handoff_harness.py

      - name: Normalize generated exact-object helper syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts\Build-HmsCompositeSkill.impl.ps1',
            'scripts\Sync-DeliveryTools.ps1',
            'uninstall.ps1'
          )
          $replacements = [ordered]@{
            "if(`$env:OS-cne'Windows_NT')" = "if (`$env:OS -cne 'Windows_NT')"
            'if($null-eq$h-or$h.IsInvalid)' = 'if ($null -eq $h -or $h.IsInvalid)'
            'if($null-ne$h)' = 'if ($null -ne $h)'
            'if($before-cne[string]$Guard.Identity)' = 'if ($before -cne [string]$Guard.Identity)'
            'if($after-cne[string]$Guard.Identity)' = 'if ($after -cne [string]$Guard.Identity)'
            'foreach($child in@(' = 'foreach ($child in @('
            'if(-not$deleteStarted-and$renamed-and$null-ne$guard.Handle-and-not$guard.Handle.IsClosed-and-not(' = 'if (-not $deleteStarted -and $renamed -and $null -ne $guard.Handle -and -not $guard.Handle.IsClosed -and -not ('
            'elseif($deleteStarted-and(' = 'elseif ($deleteStarted -and ('
            'if($null-ne$guard-and$null-ne$guard.Handle)' = 'if ($null -ne $guard -and $null -ne $guard.Handle)'
            'if(-not(Test-Path' = 'if (-not (Test-Path'
            'if(-not[HmsDeliveryExactFsNative]::DeleteByHandle' = 'if (-not [HmsDeliveryExactFsNative]::DeleteByHandle'
            'if(-not[HmsUninstallExactFsNative]::DeleteByHandle' = 'if (-not [HmsUninstallExactFsNative]::DeleteByHandle'
          }
          foreach ($relative in $paths) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $text = [IO.File]::ReadAllText($path)
            foreach ($entry in $replacements.GetEnumerator()) { $text = $text.Replace([string]$entry.Key,[string]$entry.Value) }
            [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))
          }

      - name: Parse all changed PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @(
            'scripts\Resolve-HmsModelRoute.ps1',
            'scripts\Build-HmsCompositeSkill.impl.ps1',
            'scripts\Sync-DeliveryTools.ps1',
            'uninstall.ps1',
            'scripts\Test-HmsLateTrustBoundaries.ps1',
            'scripts\Test-HmsRollbackIdentityHandoff.ps1'
          )) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { throw "Parser rejected ${relative}: $((@($errors)|ForEach-Object Message)-join ' | ')" }
          }

      - name: Run permanent HMS validator before commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./scripts/Test-HmsSkills.ps1

      - name: Commit only qualified review34 remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git restore --worktree -- scripts/.tmp_patch_exact_object_review34.py scripts/.tmp_fix_review34_late_probe.py scripts/.tmp_fix_review34_clone_quarantine.py scripts/.tmp_fix_review34_nonwindows_cleanup.py scripts/.tmp_fix_review34_rollback_handoff_harness.py
          $allowed = @(
            'scripts/Resolve-HmsModelRoute.ps1',
            'scripts/Build-HmsCompositeSkill.impl.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            'uninstall.ps1',
            'scripts/Test-HmsLateTrustBoundaries.ps1',
            'scripts/Test-HmsRollbackIdentityHandoff.ps1'
          )
          $changed = @(git status --porcelain=v1 | ForEach-Object { $_.Substring(3).Replace('\','/') })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) { throw "Unexpected author changes: $($unexpected -join ', ')" }
          if ($changed.Count -ne $allowed.Count) { throw "Expected exactly $($allowed.Count) changed production/test files, found $($changed.Count): $($changed -join ', ')" }
          foreach ($p in $allowed) { if ($p -notin $changed) { throw "Expected remediation path did not change: $p" }; git add -- $p }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached --check failed.' }
          git config user.name 'hoangminhsang989'
          git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          git commit -m 'Bind review34 transitions to exact filesystem objects'
          if ($LASTEXITCODE -ne 0) { throw 'Review34 remediation commit failed.' }
          git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
