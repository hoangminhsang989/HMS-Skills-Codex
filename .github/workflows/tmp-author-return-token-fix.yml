name: Temporary author return-token runtime remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-return-token-fix.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      EXPECTED_PARENT: ${{ github.sha }}
    steps:
      - name: Checkout exact author parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch exactly two runtime return tokens
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@('scripts/Sync-DeliveryTools.ps1','uninstall.ps1')
          foreach($path in $paths){
            $text=[IO.File]::ReadAllText($path)
            $needle='return[pscustomobject]@{'
            $count=([regex]::Matches($text,[regex]::Escape($needle))).Count
            if($count -ne 1){ throw "Expected exactly one malformed return token in $path, found $count." }
            $patched=$text.Replace($needle,'return [pscustomobject]@{')
            [IO.File]::WriteAllText($path,$patched,(New-Object Text.UTF8Encoding($false)))
          }

      - name: Parse patched PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('scripts/Sync-DeliveryTools.ps1','uninstall.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count -ne 0){ throw "Parser rejected $path : $((@($errors)|ForEach-Object Message)-join ' | ')" }
          }

      - name: Execute exact guard constructors
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Get-ParsedAst([string]$Path){
            $tokens=$null;$errors=$null
            $ast=[System.Management.Automation.Language.Parser]::ParseFile($Path,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -ne 0){ throw "Parser rejected $Path : $((@($errors)|ForEach-Object Message)-join ' | ')" }
            return $ast
          }
          function Get-FunctionText([System.Management.Automation.Language.ScriptBlockAst]$Ast,[string]$Name){
            $nodes=@($Ast.FindAll({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -ceq $Name},$true))
            if($nodes.Count -ne 1){ throw "Expected one $Name, found $($nodes.Count)." }
            return $nodes[0].Extent.Text
          }
          function Import-NativeTypeBlock([System.Management.Automation.Language.ScriptBlockAst]$Ast,[string]$TypeName){
            $matches=@($Ast.EndBlock.Statements | Where-Object {
              $_ -is [System.Management.Automation.Language.IfStatementAst] -and
              $_.Extent.Text.Contains($TypeName,[StringComparison]::Ordinal) -and
              $_.Extent.Text.Contains('Add-Type',[StringComparison]::Ordinal)
            })
            if($matches.Count -ne 1){ throw "Expected one top-level native Add-Type block for $TypeName, found $($matches.Count)." }
            Invoke-Expression $matches[0].Extent.Text
            if(-not ($TypeName -as [type])){ throw "Production native type $TypeName was not loaded." }
          }
          $delivery=Join-Path $env:GITHUB_WORKSPACE 'scripts/Sync-DeliveryTools.ps1'
          $uninstall=Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'
          foreach($spec in @(
            @{Path=$delivery; Type='HmsDeliveryExactFsNative'; Get='Get-HmsDeliveryDirectoryIdentityFromHandle'; Open='Open-HmsDeliveryDirectoryGuard'},
            @{Path=$uninstall; Type='HmsUninstallExactFsNative'; Get='Get-HmsUninstallDirectoryIdentityFromHandle'; Open='Open-HmsUninstallDirectoryGuard'}
          )){
            $ast=Get-ParsedAst -Path $spec.Path
            Import-NativeTypeBlock -Ast $ast -TypeName $spec.Type
            Invoke-Expression (Get-FunctionText -Ast $ast -Name $spec.Get)
            Invoke-Expression (Get-FunctionText -Ast $ast -Name $spec.Open)
            $root=Join-Path ([IO.Path]::GetTempPath()) ('hms-return-token-'+[guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root | Out-Null
            $guard=$null
            try{
              $guard=& $spec.Open -Path $root -Label 'return-token runtime probe'
              if($null -eq $guard -or $null -eq $guard.Handle -or [string]::IsNullOrWhiteSpace([string]$guard.Identity)){ throw "$($spec.Open) did not return a populated guard object." }
            } finally {
              if($null -ne $guard -and $null -ne $guard.Handle){ $guard.Handle.Dispose() }
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host 'PASS: both exact-directory guard constructors execute and return populated PSCustomObjects.'

      - name: Enforce exact two-file scope and commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=((& git rev-parse HEAD)-join '').Trim()
          if($head -cne $env:EXPECTED_PARENT){ throw "Author checkout moved. Expected $env:EXPECTED_PARENT found $head" }
          $changed=@(& git diff --name-only)
          $expected=@('scripts/Sync-DeliveryTools.ps1','uninstall.ps1')
          if($changed.Count -ne 2){ throw "Expected exactly 2 changed paths, found $($changed.Count): $($changed -join ', ')" }
          foreach($path in $expected){ if($path -notin $changed){ throw "Missing expected changed path: $path" } }
          $unexpected=@($changed|Where-Object{$_ -notin $expected})
          if($unexpected.Count -ne 0){ throw "Unexpected changed paths: $($unexpected -join ', ')" }
          git diff --check
          if($LASTEXITCODE -ne 0){ throw 'git diff --check failed.' }
          git add -- scripts/Sync-DeliveryTools.ps1 uninstall.ps1
          $staged=@(& git diff --cached --name-only)
          if($staged.Count -ne 2){ throw "Expected exactly 2 staged paths, found $($staged.Count)." }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix exact-directory guard return token runtime'
          if($LASTEXITCODE -ne 0){ throw 'Production fix commit failed.' }
          git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
          if($LASTEXITCODE -ne 0){ throw 'Production fix push failed.' }
