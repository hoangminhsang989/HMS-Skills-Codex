name: Diagnose HMS setup bootstrap runtime v4
# Retrigger after PS5.1-safe delivery SHA-256 remediation; diagnostic-only, no production semantics.

on:
  push:
    paths:
      - '.github/workflows/diagnose-windows-setup-bootstrap-v4.yml'

permissions:
  contents: read

jobs:
  diagnose-bootstrap-runtime-v4:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact identity and generate candidate authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Diagnostic checkout mismatch: $head" }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw "Diagnostic tree capture failed: $tree" }
          $sourceRef = 'refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu'
          $remoteLine = ((& git ls-remote origin $sourceRef) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) { throw 'Unable to resolve diagnostic source ref.' }
          $remoteSha = (($remoteLine -split '\s+')[0]).ToLowerInvariant()
          if ($remoteSha -cne $head) { throw "Diagnostic source ref moved. Expected $head, found $remoteSha" }
          $generated = Join-Path $env:RUNNER_TEMP 'hms-bootstrap-runtime-diagnostic-v4'
          New-Item -ItemType Directory -Path $generated | Out-Null
          $authorityPath = Join-Path $generated 'setup-authority.json'
          $authority = [ordered]@{
            schema_version = 1
            product_version = '0.3.0'
            mode = 'candidate'
            repository = 'https://github.com/hoangminhsang989/HMS-Skills-Codex.git'
            source_ref = $sourceRef
            commit = $head
            tree = $tree
            release_tag = $null
          }
          [IO.File]::WriteAllText($authorityPath, ($authority | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding($false)))
          "AUTHORITY_PATH=$authorityPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PASS: runtime diagnostic v4 authority HEAD=$head TREE=$tree"

      - name: Execute committed bootstrap and expose exact runtime failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsPowerShell = Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell\v1.0\powershell.exe'
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE 'installer\Invoke-HmsSetupBootstrap.ps1'
          $toolsLock = Join-Path $env:GITHUB_WORKSPACE 'installer\setup-tools.lock.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'hms-bootstrap-v4.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'hms-bootstrap-v4.stderr.log'
          $arguments = @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',('"' + $bootstrap + '"'),
            '-AuthorityPath',('"' + $env:AUTHORITY_PATH + '"'),
            '-ToolsLockPath',('"' + $toolsLock + '"'),
            '-Mode','Install'
          )
          $proc = Start-Process -FilePath $windowsPowerShell -ArgumentList $arguments -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Write-Host "BOOTSTRAP_EXIT=$($proc.ExitCode)"
          Write-Host '=== BOOTSTRAP STDOUT ==='
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Raw | Write-Host }
          Write-Host '=== BOOTSTRAP STDERR ==='
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw | Write-Host }

          $appRoot = Join-Path $env:LOCALAPPDATA 'Programs\HMS Superpowers'
          $repoRoot = Join-Path $env:USERPROFILE '.codex\hms-skills-codex'
          $manifest = Join-Path $env:USERPROFILE '.codex\hms-composite\hms-superpowers\manifest.json'
          $publicSkill = Join-Path $env:USERPROFILE '.agents\skills\hms-superpowers\SKILL.md'
          $gitExe = Join-Path $appRoot 'support\git\cmd\git.exe'
          $codexExe = Join-Path $appRoot 'support\codex\codex.exe'
          foreach ($probe in @($appRoot,$gitExe,$codexExe,$repoRoot,$manifest,$publicSkill)) {
            Write-Host ("PROBE {0} EXISTS={1}" -f $probe,(Test-Path -LiteralPath $probe))
          }
          if ((Test-Path -LiteralPath $gitExe -PathType Leaf) -and (Test-Path -LiteralPath $repoRoot -PathType Container)) {
            $head = ((& $gitExe -C $repoRoot rev-parse HEAD 2>$null) -join "`n").Trim()
            Write-Host "PROBE_REPO_HEAD=$head"
            $branch = ((& $gitExe -C $repoRoot symbolic-ref --quiet --short HEAD 2>$null) -join "`n").Trim()
            Write-Host "PROBE_REPO_BRANCH=$branch"
            $status = ((& $gitExe -C $repoRoot status --porcelain=v1 --untracked-files=all 2>$null) -join "`n").Trim()
            Write-Host "PROBE_REPO_STATUS=$status"
            foreach ($relative in @('scripts/Invoke-HmsLifecycleAction.ps1','install.ps1','scripts/Initialize-HmsLifecycleTrust.ps1','scripts/Build-HmsCompositeSkill.ps1','scripts/Sync-DeliveryTools.ps1')) {
              $expected = ((& $gitExe -C $repoRoot rev-parse ($head + ':' + $relative) 2>$null) -join '').Trim().ToLowerInvariant()
              $live = Join-Path $repoRoot ($relative -replace '/', '\')
              $actual = if (Test-Path -LiteralPath $live -PathType Leaf) { ((& $gitExe hash-object --no-filters -- $live 2>$null) -join '').Trim().ToLowerInvariant() } else { '<missing>' }
              Write-Host "PROBE_BLOB $relative EXPECTED=$expected ACTUAL=$actual"
            }
          }
          if ($proc.ExitCode -eq 0) { throw 'Runtime diagnostic v4 expected the reproduced bootstrap failure, but bootstrap succeeded.' }
          throw "Runtime diagnostic v4 captured bootstrap exit $($proc.ExitCode); inspect stderr and probes above for root cause."
