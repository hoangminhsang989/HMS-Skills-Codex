name: Guarded PS5 native Git remediation

on:
  push:
    paths:
      - '.github/workflows/patch-ps51-native-git.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact guarded inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($head -cne '${{ github.sha }}'.ToLowerInvariant()) { throw "Workflow checkout mismatch: $head" }
          $bootstrapBlob = (& git rev-parse 'HEAD:installer/Invoke-HmsSetupBootstrap.ps1').Trim().ToLowerInvariant()
          if ($bootstrapBlob -cne '7435b7992cea7c85a50a0f557c8e324861fcf901') { throw "Unexpected bootstrap blob: $bootstrapBlob" }
          $testBlob = (& git rev-parse 'HEAD:scripts/Test-HmsWindowsSetup.ps1').Trim().ToLowerInvariant()
          if ($testBlob -cne 'a796ee8acf6ad3f2b9207324eb6b80fb9e50bc87') { throw "Unexpected Windows setup test blob: $testBlob" }
          $status = ((& git status --porcelain=v1 --untracked-files=all) -join "`n").Trim()
          if (-not [string]::IsNullOrWhiteSpace($status)) { throw "Guarded patch checkout is not clean: $status" }
          Write-Host "PASS: guarded inputs HEAD=$head bootstrap=$bootstrapBlob test=$testBlob"

      - name: Apply exact PS5 native Git patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('installer/Invoke-HmsSetupBootstrap.ps1')
          text = path.read_text(encoding='utf-8')

          replacements = [
          ('''function Invoke-HmsGit {
              param(
                  [Parameter(Mandatory)][string]$GitExe,
                  [Parameter(Mandatory)][string]$RepoRoot,
                  [Parameter(Mandatory)][string[]]$Arguments,
                  [Parameter(Mandatory)][string]$FailureMessage
              )
              $output = @(& $GitExe -C $RepoRoot @Arguments 2>&1)
              if ($LASTEXITCODE -ne 0) { throw ($FailureMessage + ' ' + (($output -join "`n").Trim())) }
              return (($output -join "`n").Trim())
          }''', '''function Invoke-HmsGit {
              param(
                  [Parameter(Mandatory)][string]$GitExe,
                  [Parameter(Mandatory)][string]$RepoRoot,
                  [Parameter(Mandatory)][string[]]$Arguments,
                  [Parameter(Mandatory)][string]$FailureMessage
              )
              foreach ($argument in $Arguments) {
                  if ([string]$argument -match '[\\s"\\r\\n]') { throw "Unsafe whitespace or quote in HMS Git argument: $argument" }
              }
              $psi = New-Object Diagnostics.ProcessStartInfo
              $psi.FileName = $GitExe
              $psi.WorkingDirectory = $RepoRoot
              $psi.Arguments = ($Arguments -join ' ')
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.CreateNoWindow = $true
              $proc = New-Object Diagnostics.Process
              $proc.StartInfo = $psi
              try {
                  if (-not $proc.Start()) { throw $FailureMessage }
                  $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
                  $stderrTask = $proc.StandardError.ReadToEndAsync()
                  $proc.WaitForExit()
                  $stdout = $stdoutTask.GetAwaiter().GetResult()
                  $stderr = $stderrTask.GetAwaiter().GetResult()
                  if ($proc.ExitCode -ne 0) {
                      $detail = (($stdout + "`n" + $stderr).Trim())
                      if ([string]::IsNullOrWhiteSpace($detail)) { throw $FailureMessage }
                      throw ($FailureMessage + ' ' + $detail)
                  }
                  return $stdout.Trim()
              }
              finally { $proc.Dispose() }
          }'''),
          ('''        & $GitExe init --initial-branch=main $repo 2>&1 | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize the HMS checkout.' }
                  & $GitExe -C $repo remote add origin $CanonicalHmsRemote 2>&1 | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to configure the HMS origin.' }''', '''        $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('init','--initial-branch=main') -FailureMessage 'Unable to initialize the HMS checkout.'
                  $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('remote','add','origin',$CanonicalHmsRemote) -FailureMessage 'Unable to configure the HMS origin.' '''),
          ('''    & $GitExe -C $repo fetch --no-tags origin ($sourceRef + ':' + $SetupRemoteRef) 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Unable to fetch exact HMS setup authority ref: $sourceRef" }''', '''    $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('fetch','--no-tags','origin',($sourceRef + ':' + $SetupRemoteRef)) -FailureMessage "Unable to fetch exact HMS setup authority ref: $sourceRef"'''),
          ('''        & $GitExe -C $repo checkout -B main $fetched 2>&1 | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to activate exact HMS setup authority on main.' }''', '''        $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('checkout','-B','main',$fetched) -FailureMessage 'Unable to activate exact HMS setup authority on main.' '''),
          ('''            & $GitExe -C $repo merge --ff-only $SetupRemoteRef 2>&1 | Out-Null
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to fast-forward HMS checkout to setup authority.' }''', '''            $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('merge','--ff-only',$SetupRemoteRef) -FailureMessage 'Unable to fast-forward HMS checkout to setup authority.' '''),
          ('''            & $GitExe -C $repo fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main' 2>&1 | Out-Null
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to verify newer HMS checkout against canonical origin/main.' }''', '''            $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('fetch','--no-tags','origin','refs/heads/main:refs/remotes/origin/main') -FailureMessage 'Unable to verify newer HMS checkout against canonical origin/main.' '''),
          ('''    & $GitExe -C $repo config branch.main.remote origin 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Unable to configure HMS main remote tracking.' }
              & $GitExe -C $repo config branch.main.merge refs/heads/main 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Unable to configure HMS main merge tracking.' }''', '''    $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('config','branch.main.remote','origin') -FailureMessage 'Unable to configure HMS main remote tracking.'
              $null = Invoke-HmsGit -GitExe $GitExe -RepoRoot $repo -Arguments @('config','branch.main.merge','refs/heads/main') -FailureMessage 'Unable to configure HMS main merge tracking.' ''')
          ]

          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarded replacement {index} expected exactly once, found {count}')
              new = '\n'.join(line.rstrip() for line in new.split('\n'))
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          print('PASS: applied 7 exact PS5 native Git replacements')

      - name: Verify permanent RED turns GREEN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-HmsWindowsSetup.ps1 -Scope Bootstrap
          ./scripts/Test-HmsSkills.ps1
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $changed = @(& git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -cne 'installer/Invoke-HmsSetupBootstrap.ps1') { throw "Unexpected patch scope: $($changed -join ', ')" }
          Write-Host 'PASS: permanent PS5 native stderr regression and full qualification are GREEN.'

      - name: Publish guarded successor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- installer/Invoke-HmsSetupBootstrap.ps1
          git commit -m 'fix: use explicit Git process exit semantics in setup bootstrap'
          $successor = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          git push origin HEAD:refs/heads/stage/hms-superpowers-v0.3.0-windows-setup-menu
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish guarded bootstrap successor.' }
          Write-Host "PASS: published guarded successor $successor"
