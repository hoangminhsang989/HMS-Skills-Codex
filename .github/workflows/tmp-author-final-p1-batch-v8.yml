name: Temporary author CodeGraph marker ABI remediation V8

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-final-p1-batch-v8.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BASELINE_PARENT: 75446ce1d2dd79fbe664d78e92193e5e24e908bc
      V7_BOOTSTRAP: f97ff26f27728edc80eeae5d8b9f107a65109114
      V7_PATH: .github/workflows/tmp-author-final-p1-batch-v7.yml
      SELF_PATH: .github/workflows/tmp-author-final-p1-batch-v8.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V8 to V7 authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:V7_BOOTSTRAP){throw "V8 parent mismatch. Expected $env:V7_BOOTSTRAP, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V8 bootstrap scope mismatch: $($changed -join ', ')"}
          $v7Parent=((& git rev-parse "$env:V7_BOOTSTRAP^")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $v7Parent -cne $env:BASELINE_PARENT){throw "V7 bootstrap parent drifted. Expected $env:BASELINE_PARENT, found $v7Parent"}

      - name: Reuse V7 production patch and repair P1 workflow block indentation
        shell: python
        run: |
          import os
          from pathlib import Path

          v7=Path(os.environ['V7_PATH'])
          text=v7.read_text(encoding='utf-8')
          start_marker="      - name: Apply exact two-file V7 remediation\n        shell: python\n        run: |\n"
          end_marker="\n      - name: Create exact local V7 candidate and run structural qualification"
          start=text.find(start_marker)
          if start < 0: raise SystemExit('V8 could not locate committed V7 remediation start.')
          start += len(start_marker)
          end=text.find(end_marker,start)
          if end < 0: raise SystemExit('V8 could not locate committed V7 remediation end.')
          raw=text[start:end]
          code=[]
          for line in raw.splitlines():
              if line.startswith('          '): code.append(line[10:])
              elif line == '': code.append('')
              else: raise SystemExit(f'Unexpected V7 remediation indentation: {line!r}')
          exec(compile('\n'.join(code)+'\n',str(v7)+'::remediation','exec'),{'__name__':'__main__'})

          workflow=Path('.github/workflows/validate-p1-trust-boundaries.yml')
          w=workflow.read_text(encoding='utf-8')
          reg4="          # P1 regression 4: modified builder bytes must be rejected before injected pre-auth code can execute.\n"
          final="          Write-Host 'PASS: all five remediated P1 trust boundaries are qualified on exact candidate HEAD.'"
          rs=w.find(reg4)
          re=w.find(final,rs)
          if rs < 0 or re < 0: raise SystemExit('V8 could not isolate P1 regression 4/5 block.')
          body_start=rs+len(reg4)
          body=w[body_start:re]
          if body.startswith('          '): raise SystemExit('V8 expected legacy regression 4 body to begin at leaked column 0.')
          fixed=[]
          for line in body.splitlines():
              fixed.append(('          '+line) if line else '')
          w=w[:body_start]+'\n'.join(fixed)+'\n'+w[re:]
          workflow.write_text(w,encoding='utf-8',newline='\n')

      - name: Create exact local V8 candidate and run structural qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@('scripts/Sync-DeliveryTools.ps1','.github/workflows/validate-p1-trust-boundaries.yml')
          $tempPaths=@($env:V7_PATH,$env:SELF_PATH)
          foreach($path in $tempPaths){Remove-Item -LiteralPath $path -Force}
          $allowed=@($targets+$tempPaths)
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $unexpected=@($changed|Where-Object {$_ -notin $allowed})
          if($unexpected.Count){throw "Unexpected V8 paths: $($unexpected -join ', ')"}
          foreach($path in $allowed){if($path -notin $changed){throw "Expected V8 path not changed: $path"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V8.'}
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count){throw "PowerShell parser rejected delivery V8: $((@($errors)|ForEach-Object Message)-join ' | ')"}

          $workflowPath=Join-Path $env:GITHUB_WORKSPACE '.github\workflows\validate-p1-trust-boundaries.yml'
          $lines=@([IO.File]::ReadAllLines($workflowPath))
          $runIndex=-1
          for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -ceq '        run: |'){if($runIndex -ge 0){throw 'P1 workflow unexpectedly contains multiple run blocks.'};$runIndex=$i}}
          if($runIndex -lt 0){throw 'P1 workflow run block is missing.'}
          for($i=$runIndex+1;$i -lt $lines.Count;$i++){
            $line=$lines[$i]
            if([string]::IsNullOrWhiteSpace($line)){continue}
            if($line.StartsWith('      - ')){break}
            if(-not $line.StartsWith('          ')){throw "P1 workflow contains code escaped from run block at line $($i+1): $line"}
          }
          $yaml=[IO.File]::ReadAllText($workflowPath)
          foreach($needle in @("`n`$managerSentinel =","`n# P1 regression 5:","`n`$markerProbeRoot =")){
            if($yaml.Contains($needle)){throw "P1 workflow retains legacy column-0 regression bytes: $needle"}
          }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Use native atomic CodeGraph marker replacement V8'
          if($LASTEXITCODE -ne 0){throw 'Local V8 candidate commit failed.'}
          $net=@(& git diff --name-only $env:BASELINE_PARENT HEAD)
          if($net.Count -ne 2 -or @($net|Where-Object {$_ -notin $targets}).Count){throw "V8 net scope mismatch: $($net -join ', ')"}
          $localHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $localTree=((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant()
          Write-Host "LOCAL_CANDIDATE=$localHead"
          Write-Host "LOCAL_TREE=$localTree"
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}

      - name: Qualify native marker success and failure paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $delivery=Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'
          . $delivery -SkipCodeGraph -SkipThreeLevelDelivery
          $root=Join-Path $env:RUNNER_TEMP ('hms-v8-marker-'+[guid]::NewGuid().ToString('N'))
          $bundle=Join-Path $root 'current'
          $marker=Join-Path $bundle '.hms-codegraph-bundle.json'
          $lock=$null
          try {
            New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'bin')|Out-Null
            [IO.File]::WriteAllText((Join-Path $bundle 'bin\codegraph.cmd'),"@echo off`r`necho v8`r`n",[Text.Encoding]::ASCII)
            $id1=New-CodeGraphBundleIdentity -TransactionId '11111111111111111111111111111111' -Role 'candidate' -Version 'old' -Tag 'v-old' -Commit 'c-old' -Asset 'a-old' -Sha256 's-old'
            Write-CodeGraphBundleMarker -Path $bundle -Identity $id1
            Assert-CodeGraphTransactionBundle -Path $bundle -Identity $id1
            $id2=New-CodeGraphBundleIdentity -TransactionId '22222222222222222222222222222222' -Role 'backup' -Version 'old' -Tag 'v-old' -Commit 'c-old' -Asset 'a-old' -Sha256 's-old' -BundleTreeSha256 ([string]$id1.bundle_tree_sha256)
            Write-CodeGraphBundleMarker -Path $bundle -Identity $id2
            Assert-CodeGraphTransactionBundle -Path $bundle -Identity $id2
            Write-Host 'PASS: native ReplaceFileW marker success path is operational.'
            $before=[IO.File]::ReadAllBytes($marker)
            $lock=New-Object IO.FileStream($marker,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
            $id3=New-CodeGraphBundleIdentity -TransactionId '33333333333333333333333333333333' -Role 'candidate' -Version 'new' -Tag 'v-new' -Commit 'c-new' -Asset 'a-new' -Sha256 's-new' -BundleTreeSha256 ([string]$id1.bundle_tree_sha256)
            $failed=$false
            try { Write-CodeGraphBundleMarker -Path $bundle -Identity $id3 }
            catch { if($_.Exception.Message -match 'atomic replacement failed'){ $failed=$true } else { throw } }
            if(-not $failed){throw 'Locked canonical marker did not force atomic publication failure.'}
            $after=[IO.File]::ReadAllBytes($marker)
            if([Convert]::ToBase64String($after) -cne [Convert]::ToBase64String($before)){throw 'Failed marker publication changed canonical marker bytes.'}
            Assert-CodeGraphTransactionBundle -Path $bundle -Identity $id2
            Write-Host 'PASS: failed native marker publication preserves prior canonical bytes and identity.'
          }
          finally {
            if($null -ne $lock){$lock.Dispose()}
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare two verified GitHub blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@('scripts/Sync-DeliveryTools.ps1','.github/workflows/validate-p1-trust-boundaries.yml')
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
            $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
            $body=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
            $blob=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/blobs" -Body $body -ContentType 'application/json'
            $localBlob=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
            if(-not $blob.sha -or $localBlob -cne ([string]$blob.sha).ToLowerInvariant()){throw "GitHub blob identity mismatch for $path"}
            Write-Host "PREPARED_BLOB $path $($blob.sha)"
          }
          $qualifiedHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $qualifiedTree=((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant()
          Write-Host "QUALIFIED_LOCAL_HEAD=$qualifiedHead"
          Write-Host "QUALIFIED_LOCAL_TREE=$qualifiedTree"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'