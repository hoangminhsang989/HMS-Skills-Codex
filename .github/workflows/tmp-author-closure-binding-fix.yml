name: Temporary author closure-binding remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-closure-binding-fix.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BRANCH_NAME: stage/hms-superpowers-v0.2.0-ui-design-authority
      BASELINE_HEAD: 3b17a477e3952f915206ff5f65c3f0d844e7c687
      SYNC_BLOB: 9c3016464156adec7b3d780ada91df4826e25385
      UNINSTALL_BLOB: d7d380246bddd11d841a7bce2c6ae7dbfa2b4041
      TEST_BLOB: ea67147f253f152679eaea2ec4e67c78caf32748
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind immutable committed production and validator baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & git merge-base --is-ancestor $env:BASELINE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw "Baseline HEAD is not an ancestor: $env:BASELINE_HEAD" }
          $sync = ((& git rev-parse 'HEAD:scripts/Sync-DeliveryTools.ps1') -join '').Trim().ToLowerInvariant()
          $uninstall = ((& git rev-parse 'HEAD:uninstall.ps1') -join '').Trim().ToLowerInvariant()
          $test = ((& git rev-parse 'HEAD:scripts/Test-HmsSkills.impl.ps1') -join '').Trim().ToLowerInvariant()
          if ($sync -cne $env:SYNC_BLOB) { throw "Committed Sync-DeliveryTools blob mismatch: $sync" }
          if ($uninstall -cne $env:UNINSTALL_BLOB) { throw "Committed uninstall blob mismatch: $uninstall" }
          if ($test -cne $env:TEST_BLOB) { throw "Committed Test-HmsSkills.impl blob mismatch: $test" }
          & git diff --exit-code -- 'scripts/Sync-DeliveryTools.ps1' 'uninstall.ps1' 'scripts/Test-HmsSkills.impl.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Authoring worktree differs from committed baseline.' }
          $syncText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'))
          $uninstallText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'))
          if ([regex]::Matches($syncText,'\.GetNewClosure\(\)').Count -ne 2) { throw 'Expected exactly two delivery GetNewClosure callsites.' }
          if ([regex]::Matches($uninstallText,'\.GetNewClosure\(\)').Count -ne 4) { throw 'Expected exactly four uninstall GetNewClosure callsites.' }

      - name: Patch six closure function bindings and permanent validator contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Edit-File {
            param([string]$Path,[scriptblock]$Edit)
            $text = [IO.File]::ReadAllText($Path)
            $newText = & $Edit $text
            if ($newText -ceq $text) { throw "Patch made no change: $Path" }
            [IO.File]::WriteAllText($Path,$newText,$utf8)
          }
          function Replace-Once {
            param([string]$Text,[string]$Old,[string]$New,[string]$Label)
            $count = [regex]::Matches($Text,[regex]::Escape($Old)).Count
            if ($count -ne 1) { throw "Expected exactly one '$Label' anchor, found $count." }
            return $Text.Replace($Old,$New)
          }

          $sync = Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'
          Edit-File $sync {
            param($text)
            $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            $text = Replace-Once $text '    $validator={param($p) Assert-CodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()' ('    $assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}' + $nl + '    $validator={param($p) & $assertCodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()') 'transaction validator'
            $text = Replace-Once $text '    $validator={param($p) Assert-CodeGraphTempRoot -Path $p -TransactionId $TransactionId}.GetNewClosure()' ('    $assertCodeGraphTempRoot = ${function:Assert-CodeGraphTempRoot}' + $nl + '    $validator={param($p) & $assertCodeGraphTempRoot -Path $p -TransactionId $TransactionId}.GetNewClosure()') 'temp-root validator'
            return $text
          }

          $uninstall = Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'
          Edit-File $uninstall {
            param($text)
            $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            $text = Replace-Once $text '    $validator = {' ('    $assertCloneIdentity = ${function:Assert-CloneIdentity}' + $nl + '    $validator = {') 'clone validator capture'
            $text = Replace-Once $text '        Assert-CloneIdentity -Path $p -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath' '        & $assertCloneIdentity -Path $p -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath' 'clone validator invocation'
            $text = Replace-Once $text '        Assert-CloneIdentity -Path $quarantine -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath' '        & $assertCloneIdentity -Path $quarantine -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath' 'clone quarantine invocation'
            $text = Replace-Once $text '    $validator={param($p) Assert-OwnedCompositeRoot -Path $p}.GetNewClosure()' ('    $assertOwnedCompositeRoot = ${function:Assert-OwnedCompositeRoot}' + $nl + '    $validator={param($p) & $assertOwnedCompositeRoot -Path $p}.GetNewClosure()') 'composite validator'
            $text = Replace-Once $text '    $validator={param($p) Assert-ManagedCodeGraphRoot -Path $p}.GetNewClosure()' ('    $assertManagedCodeGraphRoot = ${function:Assert-ManagedCodeGraphRoot}' + $nl + '    $validator={param($p) & $assertManagedCodeGraphRoot -Path $p}.GetNewClosure()') 'CodeGraph validator'
            return $text
          }

          $test = Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.impl.ps1'
          Edit-File $test {
            param($text)
            $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            $old = "    foreach (`$literal in @('function Remove-VerifiedClone','Assert-CloneIdentity -Path `$quarantine')) {" + $nl + "        if (`$uninstallText -notmatch [regex]::Escape(`$literal)) { `$errors.Add(\"Uninstall clone quarantine contract missing literal: `$literal\") }" + $nl + '    }'
            $new = "    foreach (`$literal in @(" + $nl + "        'function Remove-VerifiedClone'," + $nl + "        '`$assertCloneIdentity = `${function:Assert-CloneIdentity}'," + $nl + "        '& `$assertCloneIdentity -Path `$p'," + $nl + "        '& `$assertCloneIdentity -Path `$quarantine'" + $nl + '    )) {' + $nl + "        if (`$uninstallText -notmatch [regex]::Escape(`$literal)) { `$errors.Add(\"Uninstall clone captured-closure contract missing literal: `$literal\") }" + $nl + '    }'
            return Replace-Once $text $old $new 'uninstall clone permanent contract'
          }

          $syncText = [IO.File]::ReadAllText($sync)
          $uninstallText = [IO.File]::ReadAllText($uninstall)
          if ([regex]::Matches($syncText,'\.GetNewClosure\(\)').Count -ne 2) { throw 'Delivery closure count changed unexpectedly.' }
          if ([regex]::Matches($uninstallText,'\.GetNewClosure\(\)').Count -ne 4) { throw 'Uninstall closure count changed unexpectedly.' }
          foreach ($literal in @('$assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}','$assertCodeGraphTempRoot = ${function:Assert-CodeGraphTempRoot}')) { if (-not $syncText.Contains($literal)) { throw "Missing delivery function capture: $literal" } }
          foreach ($literal in @('$assertCloneIdentity = ${function:Assert-CloneIdentity}','$assertOwnedCompositeRoot = ${function:Assert-OwnedCompositeRoot}','$assertManagedCodeGraphRoot = ${function:Assert-ManagedCodeGraphRoot}')) { if (-not $uninstallText.Contains($literal)) { throw "Missing uninstall function capture: $literal" } }

      - name: Parse changed PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('scripts\Sync-DeliveryTools.ps1','uninstall.ps1','scripts\Test-HmsSkills.impl.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { throw "Parser rejected $relative : $((@($errors) | ForEach-Object Message) -join ' | ')" }
          }

      - name: Run permanent HMS validator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1')

      - name: Exercise delivery closure bindings at runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1') -SkipCodeGraph -SkipThreeLevelDelivery
          $root = Join-Path ([IO.Path]::GetTempPath()) ('hms-closure-delivery-' + [guid]::NewGuid().ToString('N'))
          try {
            $tempRoot = Join-Path $root 'temp'
            New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
            $tx = [guid]::NewGuid().ToString('N')
            Write-CodeGraphTempMarker -Path $tempRoot -TransactionId $tx
            Assert-CodeGraphTempRoot -Path $tempRoot -TransactionId $tx
            Remove-CodeGraphTempRoot -Path $tempRoot -TransactionId $tx
            if (Test-Path -LiteralPath $tempRoot) { throw 'CodeGraph temp closure probe left root behind.' }

            $bundle = Join-Path $root 'bundle'
            New-Item -ItemType Directory -Force -Path $bundle | Out-Null
            Set-Content -LiteralPath (Join-Path $bundle 'payload.txt') -Value 'closure runtime probe' -Encoding UTF8
            $tree = Get-CodeGraphBundleTreeSha256 -Path $bundle
            $identity = New-CodeGraphBundleIdentity -TransactionId ([guid]::NewGuid().ToString('N')) -Role 'candidate' -Version '1.6.0' -Tag 'v1.6.0' -Commit 'dfccdf62547fcd76d343344d823a0e1998d3a89f' -Asset 'probe.zip' -Sha256 ('a' * 64) -BundleTreeSha256 $tree
            Write-CodeGraphBundleMarker -Path $bundle -Identity $identity
            Assert-CodeGraphTransactionBundle -Path $bundle -Identity $identity
            Remove-CodeGraphTransactionBundle -Path $bundle -Identity $identity
            if (Test-Path -LiteralPath $bundle) { throw 'CodeGraph transaction closure probe left root behind.' }
          }
          finally { if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force } }
          Write-Host 'PASS: delivery closures invoke captured production functions.'

      - name: Exercise uninstall clone closure at runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testHome = Join-Path ([IO.Path]::GetTempPath()) ('hms-closure-uninstall-' + [guid]::NewGuid().ToString('N'))
          $fakeClone = Join-Path $testHome '.codex\hms-skills-codex'
          try {
            New-Item -ItemType Directory -Force -Path (Join-Path $fakeClone 'skills\hms-superpowers') | Out-Null
            Set-Content -LiteralPath (Join-Path $fakeClone 'skills\hms-superpowers\SKILL.md') -Value 'closure probe marker' -Encoding UTF8
            & git -C $fakeClone init | Out-Null
            & git -C $fakeClone config user.email 'ci@example.invalid'
            & git -C $fakeClone config user.name 'HMS Closure Probe'
            & git -C $fakeClone add .
            & git -C $fakeClone commit -m 'closure probe clone' | Out-Null
            & git -C $fakeClone remote add origin 'https://github.com/hoangminhsang989/HMS-Skills-Codex.git'
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare closure-probe clone.' }
            $savedProfile=$env:USERPROFILE; $savedHome=$env:HOME
            try {
              $env:USERPROFILE=$testHome; $env:HOME=$testHome
              & (Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1') -InstallRoot $fakeClone -RemoveClones
            }
            finally { $env:USERPROFILE=$savedProfile; $env:HOME=$savedHome }
            if (Test-Path -LiteralPath $fakeClone) { throw 'Uninstall clone closure probe did not remove managed fake clone.' }
          }
          finally { if (Test-Path -LiteralPath $testHome) { Remove-Item -LiteralPath $testHome -Recurse -Force } }
          Write-Host 'PASS: uninstall clone closures invoke captured Assert-CloneIdentity.'

      - name: Commit exact three-file production and validator remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @('scripts/Sync-DeliveryTools.ps1','uninstall.ps1','scripts/Test-HmsSkills.impl.ps1')
          $changed = @(& git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\','/') }) | Sort-Object -Unique
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) { throw "Unexpected changed paths: $($unexpected -join ', ')" }
          foreach ($path in $allowed) { if ($path -notin $changed) { throw "Expected author path was not changed: $path" } }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check rejected closure-binding remediation.' }
          $remote = ((& git ls-remote origin "refs/heads/$env:BRANCH_NAME") -join '').Split("`t")[0].Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $remote -cne $env:GITHUB_SHA.ToLowerInvariant()) { throw "Branch drift before author commit. Expected $env:GITHUB_SHA, found $remote" }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Bind destructive validator closures to captured functions'
          if ($LASTEXITCODE -ne 0) { throw 'Closure-binding production/test commit failed.' }
          & git push origin "HEAD:$env:BRANCH_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Closure-binding production/test push failed.' }
