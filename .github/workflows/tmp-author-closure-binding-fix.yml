name: Temporary author closure-binding remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-closure-binding-fix.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BRANCH_NAME: stage/hms-superpowers-v0.2.0-ui-design-authority
      BASELINE_HEAD: 3b17a477e3952f915206ff5f65c3f0d844e7c687
      SYNC_BLOB: 9c3016464156adec7b3d780ada91df4826e25385
      UNINSTALL_BLOB: d7d380246bddd11d841a7bce2c6ae7dbfa2b4041
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind immutable production baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & git merge-base --is-ancestor $env:BASELINE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw "Baseline HEAD is not an ancestor: $env:BASELINE_HEAD" }
          $sync = ((& git hash-object --no-filters -- 'scripts/Sync-DeliveryTools.ps1') -join '').Trim().ToLowerInvariant()
          $uninstall = ((& git hash-object --no-filters -- 'uninstall.ps1') -join '').Trim().ToLowerInvariant()
          if ($sync -cne $env:SYNC_BLOB) { throw "Sync-DeliveryTools baseline blob mismatch: $sync" }
          if ($uninstall -cne $env:UNINSTALL_BLOB) { throw "uninstall baseline blob mismatch: $uninstall" }
          $syncText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'))
          $uninstallText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'))
          if ([regex]::Matches($syncText,'\.GetNewClosure\(\)').Count -ne 2) { throw 'Expected exactly two delivery GetNewClosure callsites.' }
          if ([regex]::Matches($uninstallText,'\.GetNewClosure\(\)').Count -ne 4) { throw 'Expected exactly four uninstall GetNewClosure callsites.' }

      - name: Patch six closure function bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $nl = "`n"
          function Lines { param([string[]]$Value) return ([string]::Join($nl,$Value) + $nl) }
          function Replace-ExactOnce {
            param([Parameter(Mandatory)][string]$Path,[Parameter(Mandatory)][string]$Old,[Parameter(Mandatory)][string]$New)
            $text = [IO.File]::ReadAllText($Path).Replace("`r`n","`n")
            $count = [regex]::Matches($text,[regex]::Escape($Old)).Count
            if ($count -ne 1) { throw "Expected exactly one replacement anchor in $Path, found $count.`n$Old" }
            [IO.File]::WriteAllText($Path,$text.Replace($Old,$New),$utf8)
          }

          $sync = Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'
          $old = Lines @('    $validator={param($p) Assert-CodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()')
          $new = Lines @('    $assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}','    $validator={param($p) & $assertCodeGraphTransactionBundle -Path $p -Identity $Identity}.GetNewClosure()')
          Replace-ExactOnce -Path $sync -Old $old -New $new
          $old = Lines @('    $validator={param($p) Assert-CodeGraphTempRoot -Path $p -TransactionId $TransactionId}.GetNewClosure()')
          $new = Lines @('    $assertCodeGraphTempRoot = ${function:Assert-CodeGraphTempRoot}','    $validator={param($p) & $assertCodeGraphTempRoot -Path $p -TransactionId $TransactionId}.GetNewClosure()')
          Replace-ExactOnce -Path $sync -Old $old -New $new

          $uninstall = Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1'
          $old = Lines @(
            '    $validator = {',
            '        param($p)',
            '        Assert-CloneIdentity -Path $p -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath',
            '    }.GetNewClosure()',
            '    $quarantineValidator = {',
            '        param($quarantine)',
            '        Assert-CloneIdentity -Path $quarantine -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath',
            '    }.GetNewClosure()'
          )
          $new = Lines @(
            '    $assertCloneIdentity = ${function:Assert-CloneIdentity}',
            '    $validator = {',
            '        param($p)',
            '        & $assertCloneIdentity -Path $p -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath',
            '    }.GetNewClosure()',
            '    $quarantineValidator = {',
            '        param($quarantine)',
            '        & $assertCloneIdentity -Path $quarantine -ExpectedRemote $ExpectedRemote -MarkerRelativePath $MarkerRelativePath',
            '    }.GetNewClosure()'
          )
          Replace-ExactOnce -Path $uninstall -Old $old -New $new
          $old = Lines @('    $validator={param($p) Assert-OwnedCompositeRoot -Path $p}.GetNewClosure()')
          $new = Lines @('    $assertOwnedCompositeRoot = ${function:Assert-OwnedCompositeRoot}','    $validator={param($p) & $assertOwnedCompositeRoot -Path $p}.GetNewClosure()')
          Replace-ExactOnce -Path $uninstall -Old $old -New $new
          $old = Lines @('    $validator={param($p) Assert-ManagedCodeGraphRoot -Path $p}.GetNewClosure()')
          $new = Lines @('    $assertManagedCodeGraphRoot = ${function:Assert-ManagedCodeGraphRoot}','    $validator={param($p) & $assertManagedCodeGraphRoot -Path $p}.GetNewClosure()')
          Replace-ExactOnce -Path $uninstall -Old $old -New $new

          $syncText = [IO.File]::ReadAllText($sync)
          $uninstallText = [IO.File]::ReadAllText($uninstall)
          if ([regex]::Matches($syncText,'\.GetNewClosure\(\)').Count -ne 2) { throw 'Delivery closure count changed unexpectedly.' }
          if ([regex]::Matches($uninstallText,'\.GetNewClosure\(\)').Count -ne 4) { throw 'Uninstall closure count changed unexpectedly.' }
          foreach ($literal in @('$assertCodeGraphTransactionBundle = ${function:Assert-CodeGraphTransactionBundle}','$assertCodeGraphTempRoot = ${function:Assert-CodeGraphTempRoot}')) {
            if (-not $syncText.Contains($literal)) { throw "Missing captured delivery function binding: $literal" }
          }
          foreach ($literal in @('$assertCloneIdentity = ${function:Assert-CloneIdentity}','$assertOwnedCompositeRoot = ${function:Assert-OwnedCompositeRoot}','$assertManagedCodeGraphRoot = ${function:Assert-ManagedCodeGraphRoot}')) {
            if (-not $uninstallText.Contains($literal)) { throw "Missing captured uninstall function binding: $literal" }
          }

      - name: Parse production PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('scripts\Sync-DeliveryTools.ps1','uninstall.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { throw "Parser rejected $relative : $((@($errors) | ForEach-Object Message) -join ' | ')" }
          }

      - name: Run permanent HMS validator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1')

      - name: Exercise delivery closure bindings at runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $delivery = Join-Path $env:GITHUB_WORKSPACE 'scripts\Sync-DeliveryTools.ps1'
          . $delivery -SkipCodeGraph -SkipThreeLevelDelivery
          $root = Join-Path ([IO.Path]::GetTempPath()) ('hms-closure-delivery-' + [guid]::NewGuid().ToString('N'))
          try {
            $tempRoot = Join-Path $root 'temp'
            New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
            $tx = [guid]::NewGuid().ToString('N')
            Write-CodeGraphTempMarker -Path $tempRoot -TransactionId $tx
            Assert-CodeGraphTempRoot -Path $tempRoot -TransactionId $tx
            Remove-CodeGraphTempRoot -Path $tempRoot -TransactionId $tx
            if (Test-Path -LiteralPath $tempRoot) { throw 'CodeGraph temp closure runtime probe left the root behind.' }

            $bundle = Join-Path $root 'bundle'
            New-Item -ItemType Directory -Force -Path $bundle | Out-Null
            Set-Content -LiteralPath (Join-Path $bundle 'payload.txt') -Value 'closure runtime probe' -Encoding UTF8
            $tree = Get-CodeGraphBundleTreeSha256 -Path $bundle
            $identity = New-CodeGraphBundleIdentity -TransactionId ([guid]::NewGuid().ToString('N')) -Role 'candidate' -Version '1.6.0' -Tag 'v1.6.0' -Commit 'dfccdf62547fcd76d343344d823a0e1998d3a89f' -Asset 'probe.zip' -Sha256 ('a' * 64) -BundleTreeSha256 $tree
            Write-CodeGraphBundleMarker -Path $bundle -Identity $identity
            Assert-CodeGraphTransactionBundle -Path $bundle -Identity $identity
            Remove-CodeGraphTransactionBundle -Path $bundle -Identity $identity
            if (Test-Path -LiteralPath $bundle) { throw 'CodeGraph transaction closure runtime probe left the root behind.' }
          }
          finally { if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force } }
          Write-Host 'PASS: delivery validator closures invoke captured production function ScriptBlocks at runtime.'

      - name: Exercise uninstall clone closure at runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testHome = Join-Path ([IO.Path]::GetTempPath()) ('hms-closure-uninstall-' + [guid]::NewGuid().ToString('N'))
          $fakeClone = Join-Path $testHome '.codex\hms-skills-codex'
          try {
            New-Item -ItemType Directory -Force -Path (Join-Path $fakeClone 'skills\hms-superpowers') | Out-Null
            Set-Content -LiteralPath (Join-Path $fakeClone 'skills\hms-superpowers\SKILL.md') -Value 'closure probe marker' -Encoding UTF8
            & git -C $fakeClone init | Out-Null
            & git -C $fakeClone config user.email 'ci@example.invalid'
            & git -C $fakeClone config user.name 'HMS Closure Probe'
            & git -C $fakeClone add .
            & git -C $fakeClone commit -m 'closure probe clone' | Out-Null
            & git -C $fakeClone remote add origin 'https://github.com/hoangminhsang989/HMS-Skills-Codex.git'
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare closure-probe clone.' }
            $savedProfile=$env:USERPROFILE; $savedHome=$env:HOME
            try {
              $env:USERPROFILE=$testHome; $env:HOME=$testHome
              & (Join-Path $env:GITHUB_WORKSPACE 'uninstall.ps1') -InstallRoot $fakeClone -RemoveClones
            }
            finally { $env:USERPROFILE=$savedProfile; $env:HOME=$savedHome }
            if (Test-Path -LiteralPath $fakeClone) { throw 'Uninstall clone closure runtime probe did not remove the managed fake clone.' }
          }
          finally { if (Test-Path -LiteralPath $testHome) { Remove-Item -LiteralPath $testHome -Recurse -Force } }
          Write-Host 'PASS: uninstall clone validator/quarantine closures invoke the captured Assert-CloneIdentity ScriptBlock.'

      - name: Commit exact two-file production remediation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @('scripts/Sync-DeliveryTools.ps1','uninstall.ps1')
          $changed = @(& git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\','/') }) | Sort-Object -Unique
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) { throw "Unexpected changed paths: $($unexpected -join ', ')" }
          foreach ($path in $allowed) { if ($path -notin $changed) { throw "Expected production path was not changed: $path" } }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check rejected closure-binding remediation.' }
          $remote = ((& git ls-remote origin "refs/heads/$env:BRANCH_NAME") -join '').Split("`t")[0].Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $remote -cne $env:GITHUB_SHA.ToLowerInvariant()) { throw "Branch drift before author commit. Expected $env:GITHUB_SHA, found $remote" }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Bind destructive validator closures to captured functions'
          if ($LASTEXITCODE -ne 0) { throw 'Production closure-binding commit failed.' }
          & git push origin "HEAD:$env:BRANCH_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Production closure-binding push failed.' }
