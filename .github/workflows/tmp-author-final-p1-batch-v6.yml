name: Temporary author final P1 remediation V6

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority
    paths:
      - .github/workflows/tmp-author-final-p1-batch-v6.yml

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    env:
      BASELINE_PARENT: f4c7731792310340dddf35570dd5418931bfa84f
      V5_BOOTSTRAP: 2b35c456ec7bf2846cf0f11692753fe67cf6fec3
      V5_PATH: .github/workflows/tmp-author-final-p1-batch-v5.yml
      SELF_PATH: .github/workflows/tmp-author-final-p1-batch-v6.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bind V6 to V5 bootstrap authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent=((& git rev-parse HEAD^)-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $parent -cne $env:V5_BOOTSTRAP){throw "V6 author parent mismatch. Expected $env:V5_BOOTSTRAP, found $parent"}
          $changed=@(& git diff --name-only HEAD^ HEAD)
          if($changed.Count -ne 1 -or [string]$changed[0] -cne $env:SELF_PATH){throw "V6 bootstrap scope mismatch: $($changed -join ', ')"}
          $baseline=((& git rev-parse "$env:V5_BOOTSTRAP^")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $baseline -cne $env:BASELINE_PARENT){throw "V5 bootstrap parent drifted. Expected $env:BASELINE_PARENT, found $baseline"}

      - name: Reuse exact V5 remediation recipe and repair stale owned-temp harness
        shell: python
        run: |
          import os
          from pathlib import Path

          v5 = Path(os.environ['V5_PATH'])
          text = v5.read_text(encoding='utf-8')
          start_marker = "      - name: Apply exact final P1 remediation batch\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Create local final candidate and run pre-publication qualification"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('V6 could not locate the committed V5 remediation step start.')
          start += len(start_marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('V6 could not locate the committed V5 remediation step end.')
          yaml_block = text[start:end]
          code_lines = []
          for line in yaml_block.splitlines():
              if line.startswith('          '):
                  code_lines.append(line[10:])
              elif line == '':
                  code_lines.append('')
              else:
                  raise SystemExit(f'Unexpected V5 remediation indentation: {line!r}')
          code = '\n'.join(code_lines) + '\n'
          exec(compile(code, str(v5) + '::committed-v5-remediation', 'exec'), {'__name__':'__main__'})

          owned = Path('scripts/Test-HmsOwnedTempCleanup.ps1')
          source = owned.read_text(encoding='utf-8')
          def replace_once(old,new,label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              source = source.replace(old,new,1)

          replace_once(
              '$endMarker = "`n`n`n`$repoRoot = Split-Path -Parent `$PSScriptRoot"',
              '$endMarker = "`n`n`n`$selfRelative = \'scripts/Build-HmsCompositeSkill.ps1\'"',
              'owned-temp helper-prelude end marker')
          replace_once(
              r"$removeFunction = [regex]::Match($source,'(?s)function Remove-HmsOwnedTempDirectory \{.*?\n\}\n\n\n\$repoRoot').Value",
              r"$removeFunction = [regex]::Match($source,'(?s)function Remove-HmsOwnedTempDirectory \{.*?\n\}\n\n\n\$selfRelative').Value",
              'owned-temp destructive-order function delimiter')
          owned.write_text(source,encoding='utf-8',newline='\n')

      - name: Create exact local V6 candidate and run full structural qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'manager/HmsSuperpowersManager.ps1',
            'manager/HmsSuperpowersManager.utf8.ps1',
            'scripts/Build-HmsCompositeSkill.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            'scripts/Test-HmsOwnedTempCleanup.ps1',
            '.github/workflows/validate-p1-trust-boundaries.yml'
          )
          $tempPaths=@($env:V5_PATH,$env:SELF_PATH)
          foreach($path in $tempPaths){Remove-Item -LiteralPath $path -Force}
          $changed=@(& git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')} | Sort-Object -Unique)
          $allowed=@($targets + $tempPaths)
          $unexpected=@($changed | Where-Object {$_ -notin $allowed})
          if($unexpected.Count -ne 0){throw "Unexpected V6 changed paths: $($unexpected -join ', ')"}
          foreach($path in $allowed){if($path -notin $changed){throw "Expected V6 path not changed: $path"}}
          & git diff --check
          if($LASTEXITCODE -ne 0){throw 'git diff --check rejected V6.'}
          foreach($path in $targets | Where-Object {$_.EndsWith('.ps1')}){
              $tokens=$null;$errors=$null
              [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$errors)|Out-Null
              if(@($errors).Count -ne 0){throw "Parser rejected $path : $((@($errors)|ForEach-Object Message)-join ' | ')"}
          }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git add -- $allowed
          & git commit -m 'Close final Manager and CodeGraph P1 trust boundaries V6'
          if($LASTEXITCODE -ne 0){throw 'Local V6 candidate commit failed.'}
          $net=@(& git diff --name-only $env:BASELINE_PARENT HEAD)
          if($net.Count -ne $targets.Count){throw "V6 net scope count mismatch: $($net -join ', ')"}
          foreach($path in $targets){if($path -notin $net){throw "V6 net scope missing $path"}}
          if(@($net|Where-Object {$_ -notin $targets}).Count -ne 0){throw "V6 net scope escaped: $($net -join ', ')"}
          $localHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $localTree=((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant()
          if($localHead -notmatch '^[0-9a-f]{40}$' -or $localTree -notmatch '^[0-9a-f]{40}$'){throw 'V6 local candidate identity is malformed.'}
          Write-Host "LOCAL_CANDIDATE=$localHead"
          Write-Host "LOCAL_TREE=$localTree"

          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Test-HmsSkills.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Test-HmsSkills failed with exit code $LASTEXITCODE"}

          $builderRel='scripts/Build-HmsCompositeSkill.ps1'
          $builderBlob=((& git rev-parse "$localHead`:$builderRel")-join '').Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or $builderBlob -notmatch '^[0-9a-f]{40}$'){throw 'V6 could not resolve local builder blob.'}
          $builderBytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $builderRel))
          $builderSource=(New-Object Text.UTF8Encoding($false,$true)).GetString($builderBytes)
          $builderBlock=[ScriptBlock]::Create($builderSource)
          $probe=Join-Path $env:TEMP ('hms-v6-builder-probe-' + [guid]::NewGuid().ToString('N'))
          try {
              & $builderBlock -InstallRoot $env:GITHUB_WORKSPACE -OutputRoot (Join-Path $probe 'output') -SkillsRoot (Join-Path $probe 'skills') -Hms $false -Superpowers $false -Taste $false -Impeccable $false -TrustedRepoRoot $env:GITHUB_WORKSPACE -TrustedHead $localHead -TrustedBootstrapBlob $builderBlob
          }
          finally { Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host 'PASS: authenticated builder snapshot executes against exact V6 local candidate HEAD.'

      - name: Run exact V5 focused P1 regressions on V6 local candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v5Text=((& git show "$env:V5_BOOTSTRAP`:$env:V5_PATH") -join "`n")
          if($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v5Text)){throw 'Could not recover committed V5 workflow recipe.'}
          $startMarker="      - name: Run focused new P1 regressions on local candidate`n        shell: pwsh`n        run: |`n"
          $endMarker="`n      - name: Prepare verified GitHub blobs for connector atomic commit"
          $start=$v5Text.IndexOf($startMarker)
          if($start -lt 0){throw 'Could not locate V5 focused-regression step start.'}
          $start += $startMarker.Length
          $end=$v5Text.IndexOf($endMarker,$start)
          if($end -lt 0){throw 'Could not locate V5 focused-regression step end.'}
          $raw=$v5Text.Substring($start,$end-$start)
          $lines=$raw -split "`n"
          $code=@($lines | ForEach-Object {
              if($_.StartsWith('          ')){ $_.Substring(10) }
              elseif($_ -eq ''){ '' }
              else{ throw "Unexpected V5 focused-regression indentation: $_" }
          }) -join "`n"
          $scriptPath=Join-Path $env:RUNNER_TEMP ('hms-v6-focused-' + [guid]::NewGuid().ToString('N') + '.ps1')
          try {
              [IO.File]::WriteAllText($scriptPath,$code,(New-Object Text.UTF8Encoding($false)))
              & $scriptPath
              if($LASTEXITCODE -ne 0){throw "V5 focused P1 regression recipe failed on V6 candidate with exit code $LASTEXITCODE"}
          }
          finally { Remove-Item -LiteralPath $scriptPath -Force -ErrorAction SilentlyContinue }
          Write-Host 'PASS: exact committed V5 focused P1 regressions pass on V6 local candidate.'

      - name: Prepare six verified GitHub blobs for connector atomic commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=@(
            'manager/HmsSuperpowersManager.ps1',
            'manager/HmsSuperpowersManager.utf8.ps1',
            'scripts/Build-HmsCompositeSkill.ps1',
            'scripts/Sync-DeliveryTools.ps1',
            'scripts/Test-HmsOwnedTempCleanup.ps1',
            '.github/workflows/validate-p1-trust-boundaries.yml'
          )
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $repo='hoangminhsang989/HMS-Skills-Codex'
          foreach($path in $targets){
              $bytes=[IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE $path))
              $body=@{content=[Convert]::ToBase64String($bytes);encoding='base64'}|ConvertTo-Json -Compress
              $blob=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/git/blobs" -Body $body -ContentType 'application/json'
              if(-not $blob.sha){throw "Blob creation failed for $path"}
              $localBlob=((& git hash-object --no-filters -- $path)-join '').Trim().ToLowerInvariant()
              if($localBlob -cne ([string]$blob.sha).ToLowerInvariant()){throw "GitHub blob identity mismatch for $path"}
              Write-Host "PREPARED_BLOB $path $($blob.sha)"
          }
          $qualifiedHead=((& git rev-parse HEAD)-join '').Trim().ToLowerInvariant()
          $qualifiedTree=((& git rev-parse 'HEAD^{tree}')-join '').Trim().ToLowerInvariant()
          Write-Host "QUALIFIED_LOCAL_HEAD=$qualifiedHead"
          Write-Host "QUALIFIED_LOCAL_TREE=$qualifiedTree"
          Write-Host 'DETACHED_BLOBS_ONLY=YES'