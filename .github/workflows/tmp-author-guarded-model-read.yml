name: Temporary author guarded Model Settings read remediation

on:
  push:
    branches:
      - stage/hms-superpowers-v0.2.0-ui-design-authority

permissions:
  contents: write

jobs:
  author:
    if: github.event.head_commit.message == 'Add temporary guarded model read author workflow'
    runs-on: windows-latest
    steps:
      - name: Checkout author head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact-handle guarded read remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/.tmp_patch_guarded_model_read.py

      - name: Parse changed PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('manager\HmsModelSettings.utf8.ps1','scripts\Test-HmsLateTrustBoundaries.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { throw "Parser rejected ${relative}: $((@($errors)|ForEach-Object Message)-join ' | ')" }
          }

      - name: Run permanent HMS validator including direct Model Settings self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./scripts/Test-HmsSkills.ps1

      - name: Commit only qualified remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git restore --worktree -- scripts/.tmp_patch_guarded_model_read.py
          $allowed = @('manager/HmsModelSettings.utf8.ps1','scripts/Test-HmsLateTrustBoundaries.ps1')
          $changed = @(git status --porcelain=v1 | ForEach-Object { $_.Substring(3).Replace('\','/') })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) { throw "Unexpected author changes: $($unexpected -join ', ')" }
          foreach ($path in $allowed) { git add -- $path }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached --check failed.' }
          git config user.name 'hoangminhsang989'
          git config user.email '121548965+hoangminhsang989@users.noreply.github.com'
          git commit -m 'Read Model Settings through exact guarded handles'
          if ($LASTEXITCODE -ne 0) { throw 'Guarded Model Settings remediation commit failed.' }
          git push origin HEAD:stage/hms-superpowers-v0.2.0-ui-design-authority
